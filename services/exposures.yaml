# Public service exposure declarations. Single source for public hostnames and
# access: service routes, Cloudflare DNS/tunnel/Access, and identity callbacks
# derive from these entries. One entry per service, keyed by service name.
# The service catalog carries no copy of these fields.
exposures:
  notes:
    service: notes
    publication: published
    exposure:
      class: public
      hostname: notes.unclethree.uk
      access: public
      backend: notes-web
      path: /
      port: 8080
  # DISPOSABLE T5 exposure (short-lived publish->verify->retire proof). Not
  # production: retired and removed by the follow-up retirement PR, never kept.
  t5-disposable:
    service: t5-disposable
    publication: published
    exposure:
      class: public
      hostname: t5-disposable.unclethree.uk
      access: public
      backend: t5-disposable
      path: /
      port: 8080
