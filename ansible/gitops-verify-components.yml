---
- name: Verify certificate mesh and access dependencies
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify certificate issuance and reissuance
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/certificates/tasks/verify.yml
      when: certificates_enabled | bool
    - name: Verify ambient identity and gateway isolation
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/istio/tasks/verify.yml
      when: mesh_enabled | bool
    - name: Verify outside and tailnet access
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/access/tasks/verify.yml
      when: access_enabled | bool
