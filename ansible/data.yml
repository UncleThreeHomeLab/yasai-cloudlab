---
- name: Run the explicit application data action
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require enabled application data services
      ansible.builtin.assert:
        that: data_enabled | bool
        fail_msg: Application data services are not enabled.
    - name: Run the scoped data action
      ansible.builtin.command:
        argv: [python3, '/opt/cloudlab/automation/data/{{ data_module }}.py', '{{ data_action }}']
      vars:
        data_module: "{{ 'control' if lookup('env', 'LAB_DATA_ACTION') == 'resume' else 'backup' }}"
        data_action: "{{ lookup('env', 'LAB_DATA_ACTION') }}"
      register: data_action_result
      changed_when: false
      failed_when: false
      no_log: true
    - name: Require the data action to succeed
      ansible.builtin.assert:
        that: data_action_result.rc == 0
        fail_msg: '{{ data_action_result.stderr }}'
    - name: Report only sanitized data results
      ansible.builtin.debug:
        msg: '{{ data_action_result.stdout | from_json }}'
