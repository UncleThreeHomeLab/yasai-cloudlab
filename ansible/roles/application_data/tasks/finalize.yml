---
- name: Reconcile SQL grants and buckets after private DNS is ready
  ansible.builtin.command: python3 /opt/cloudlab/automation/data/control.py reconcile
  register: data_reconciled
  changed_when: data_reconciled.rc == 0 and (data_reconciled.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require data provisioning and credential reload to pass
  ansible.builtin.assert:
    that: data_reconciled.rc == 0
    fail_msg: '{{ data_reconciled.stderr }}'
