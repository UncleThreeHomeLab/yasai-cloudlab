---
- name: Prove outside HTTPS, private access, RBAC and bounded replica failures
  ansible.builtin.command: python /workspace/automation/connectivity/verify.py
  delegate_to: localhost
  become: false
  register: access_verified
  changed_when: false
  failed_when: false
  no_log: true

- name: Require real access and disruption acceptance
  ansible.builtin.assert:
    that: access_verified.rc == 0
    fail_msg: Access acceptance failed; existing host management remains available. Run lab access-check for sanitized progress.

- name: Report access and disruption evidence without private addresses or credentials
  ansible.builtin.debug:
    msg: '{{ access_verified.stdout_lines | last | from_json }}'
