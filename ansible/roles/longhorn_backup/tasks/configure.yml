---
- name: Install the bounded default-target adoption helper
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/longhorn/adopt_backup_target.py'
    dest: /var/lib/cloudlab/longhorn/adopt_backup_target.py
    mode: '0640'

- name: Adopt only the untouched Longhorn default target fields
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/longhorn/adopt_backup_target.py]
    stdin: "{{ lookup('template', 'resources.yml.j2') | from_yaml_all | list | first | to_json }}"
  register: longhorn_target_adoption
  changed_when: longhorn_target_adoption.rc == 0 and (longhorn_target_adoption.stdout | from_json).changed
  no_log: true

- name: Configure backup target and retention
  block:
    - name: Create a temporary private manifest
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: cloudlab-backup-
      register: longhorn_backup_temp
      changed_when: false

    - name: Render private backup configuration
      ansible.builtin.template:
        src: resources.yml.j2
        dest: "{{ longhorn_backup_temp.path }}"
        mode: '0600'
      changed_when: false
      no_log: true

    - name: Reconcile backup resources
      ansible.builtin.include_role:
        name: kubernetes_manifest
      vars:
        manifest_path: "{{ longhorn_backup_temp.path }}"

    - name: Wait for Longhorn to reach the backup target during monthly proof
      ansible.builtin.command: /usr/local/bin/k3s kubectl get backuptargets.longhorn.io default -n longhorn-system -o json
      register: longhorn_backup_ready
      until: (longhorn_backup_ready.stdout | from_json).status.available | default(false)
      retries: 36
      delay: 5
      changed_when: false
      no_log: true
      when: lookup('env', 'LAB_MONTHLY_PROOF') == '1'
  always:
    - name: Remove the temporary credential manifest
      ansible.builtin.file:
        path: "{{ longhorn_backup_temp.path }}"
        state: absent
      when: longhorn_backup_temp.path is defined
      changed_when: false
