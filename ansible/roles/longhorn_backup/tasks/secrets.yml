---
- name: Render the B2 ExternalSecret without secret values
  ansible.builtin.template:
    src: external-secret.yml.j2
    dest: /var/lib/cloudlab/longhorn/external-secret.yml
    mode: '0640'

- name: Reconcile the B2 ExternalSecret
  ansible.builtin.include_role:
    name: kubernetes_manifest
  vars:
    manifest_path: /var/lib/cloudlab/longhorn/external-secret.yml

- name: Wait for B2 synchronization from 1Password
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, wait, '--for=condition=Ready', '--timeout=180s', '-n', longhorn-system, 'externalsecret/{{ longhorn_backup_policy.external_secret_name }}']
  changed_when: false

- name: Read synchronized B2 configuration privately
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, secret, '{{ longhorn_backup_secret_name }}', '-n', longhorn-system, '-o', json]
  register: longhorn_backup_synced
  no_log: true
  changed_when: false

- name: Decode synchronized B2 configuration in memory
  ansible.builtin.set_fact:
    longhorn_backup_values: "{{ dict((longhorn_backup_synced.stdout | from_json).data.keys() | zip((longhorn_backup_synced.stdout | from_json).data.values() | map('b64decode'))) }}"
  no_log: true

- name: Install the B2 access check and its policy
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/longhorn/{{ item }}'
    dest: '/var/lib/cloudlab/longhorn/{{ item }}'
    mode: '0640'
  loop: [check_backup.py, backup-policy.json, monthly_window.py]

- name: Prove synchronized credentials before changing the backup target
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/longhorn/check_backup.py]
    stdin: '{{ longhorn_backup_values | to_json }}'
  register: longhorn_backup_access
  no_log: true
  changed_when: false
  failed_when: false
  when: lookup('env', 'LAB_MONTHLY_PROOF') == '1'

- name: Require B2 list, write, read and delete access
  ansible.builtin.assert:
    that: longhorn_backup_access.rc == 0
    fail_msg: B2 access check failed using the 1Password item; existing backup target was not switched.
  when: lookup('env', 'LAB_MONTHLY_PROOF') == '1'

- name: Select backup destination from synchronized configuration
  ansible.builtin.set_fact:
    longhorn_backup_bucket: '{{ longhorn_backup_values.BUCKET }}'
    longhorn_backup_region: '{{ longhorn_backup_values.REGION }}'
  no_log: true
