---
- name: Render the B2 ExternalSecret without secret values
  ansible.builtin.template:
    src: external-secret.yml.j2
    dest: /var/lib/cloudlab/longhorn/external-secret.yml
    mode: '0640'

- name: Reconcile the B2 ExternalSecret
  ansible.builtin.include_role:
    name: kubernetes_manifest
  vars:
    manifest_path: /var/lib/cloudlab/longhorn/external-secret.yml

- name: Read the synchronized backup inputs
  ansible.builtin.import_tasks: read.yml

- name: Retain the bounded monthly credential access check
  ansible.builtin.import_tasks: access.yml
