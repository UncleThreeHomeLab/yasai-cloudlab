---
- name: Inspect the Longhorn ownership checkpoint
  ansible.builtin.stat:
    path: /var/lib/cloudlab/longhorn/ownership.json
  register: longhorn_checkpoint

- name: Detect an existing Longhorn namespace before adopting its baseline
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, namespace, longhorn-system, --ignore-not-found, -o, name]
  register: longhorn_existing
  changed_when: false

- name: Require host access and early recovery before changing existing ownership
  ansible.builtin.include_role:
    name: gitops
    tasks_from: prerequisites
  when: not longhorn_checkpoint.stat.exists and longhorn_existing.stdout | length > 0

- name: Require same-version chart parity before initial adoption
  ansible.builtin.command:
    argv: [python, /workspace/verification/integration/chart_parity.py]
  delegate_to: localhost
  become: false
  changed_when: false
  when: not longhorn_checkpoint.stat.exists

- name: Require Argo embedded Helm parity before adopting an existing Longhorn baseline
  ansible.builtin.command:
    argv: [python, /workspace/automation/longhorn/embedded_parity.py]
  delegate_to: localhost
  become: false
  changed_when: false
  when: not longhorn_checkpoint.stat.exists and longhorn_existing.stdout | length > 0

- name: Render the locked Longhorn module used by Argo
  ansible.builtin.command:
    argv: [python, /workspace/automation/longhorn/chart.py]
  delegate_to: localhost
  become: false
  register: longhorn_chart
  changed_when: false
  no_log: true

- name: Install the storage module's bounded tooling
  ansible.builtin.import_tasks: tooling.yml

- name: Seed the operator only before release of bootstrap ownership
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/longhorn/bootstrap.py, "{{ 'seed-stop' if lookup('env', 'LAB_LONGHORN_STOP_AFTER_SEED') == '1' else 'seed' }}"]
    stdin: '{{ (longhorn_chart.stdout | from_json) | combine({"fixture": longhorn_handoff_fixture}) | to_json }}'
  register: longhorn_seed
  changed_when: longhorn_seed.rc == 0 and (longhorn_seed.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require safe Longhorn seed or resume
  ansible.builtin.assert:
    that: longhorn_seed.rc == 0
    fail_msg: '{{ longhorn_seed.stderr }}'

- name: Stop this explicit interruption fixture after its durable seed checkpoint
  ansible.builtin.meta: end_play
  when: lookup('env', 'LAB_LONGHORN_STOP_AFTER_SEED') == '1'


- name: Report storage ownership without private diagnostics
  ansible.builtin.debug:
    msg: '{{ longhorn_seed.stdout | from_json }}'
