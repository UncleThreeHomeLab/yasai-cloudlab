---
- name: Create the bounded storage tooling directory
  ansible.builtin.file:
    path: /var/lib/cloudlab/longhorn
    state: directory
    mode: '0750'

- name: Install storage ownership code and its explicit dependencies
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/longhorn/{{ item }}'
    dest: '/var/lib/cloudlab/longhorn/{{ item }}'
    mode: '0640'
  loop: [bootstrap.py, handoff_fixture.py, kube.py, verify_health.py, verify_gitops.py, backup_gitops.py, adopt_backup_target.py]
