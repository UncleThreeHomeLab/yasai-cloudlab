---
# Inputs: local address/interface/port/MTU and peer address/endpoint/public key.
# Output: wireguard_public_key. Private keys stay on their respective hosts.
- name: Install WireGuard tooling
  ansible.builtin.apt:
    name: wireguard-tools
    state: present

- name: Ensure the WireGuard kernel module is available
  ansible.builtin.command: modprobe wireguard
  changed_when: false

- name: Protect WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Check for a persistent node key
  ansible.builtin.stat:
    path: /etc/wireguard/cloudlab.key
  register: wireguard_key_file

- name: Generate the node key once
  when: not wireguard_key_file.stat.exists
  block:
    - name: Generate a private key
      ansible.builtin.command: wg genkey
      register: wireguard_new_key
      changed_when: false
      no_log: true

    - name: Persist the private key on its owning VM
      ansible.builtin.copy:
        content: "{{ wireguard_new_key.stdout }}\n"
        dest: /etc/wireguard/cloudlab.key
        owner: root
        group: root
        mode: '0600'
      no_log: true

- name: Enforce private key ownership and permissions
  ansible.builtin.file:
    path: /etc/wireguard/cloudlab.key
    owner: root
    group: root
    mode: '0600'

- name: Read the local private key for configuration
  ansible.builtin.slurp:
    src: /etc/wireguard/cloudlab.key
  register: wireguard_local_key
  no_log: true

- name: Derive the public key
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ wireguard_local_key.content | b64decode }}"
  register: wireguard_public_key_result
  changed_when: false
  no_log: true

- name: Publish the public key for peer configuration
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wireguard_public_key_result.stdout | trim }}"
  no_log: true

- name: Manage the encrypted point-to-point link
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart WireGuard

- name: Apply tunnel changes on both peers
  ansible.builtin.meta: flush_handlers

- name: Keep WireGuard enabled and running
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started

- name: Verify bidirectional tunnel connectivity before changing K3s
  ansible.builtin.command:
    argv: [ping, '-I', "{{ wireguard_interface }}", '-c', '1', '-W', '2', "{{ wireguard_peer_address }}"]
  register: wireguard_ping
  until: wireguard_ping.rc == 0
  retries: 12
  delay: 5
  changed_when: false
