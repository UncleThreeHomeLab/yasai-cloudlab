---
- name: Require a bounded identity phase
  ansible.builtin.assert:
    that: identity_phase in ['server', 'bootstrap', 'scoped', 'argo']
    fail_msg: Select an explicitly supported identity bootstrap phase.

- name: Create private identity automation directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0700'
  loop: [/opt/cloudlab/automation/identity, /opt/cloudlab/automation/gitops, /var/lib/cloudlab/identity]

- name: Install the shared private Git credential template from its owner
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/gitops/private_sources.py'
    dest: /opt/cloudlab/automation/gitops/private_sources.py
    mode: '0600'

- name: Install identity runtime from its owning module
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/identity/{{ item }}'
    dest: '/opt/cloudlab/automation/identity/{{ item }}'
    mode: '0600'
  loop: [bootstrap.py, configuration.py, maintenance.py, recovery.py, rotation.py, lifecycle.py, lease.py, argo.py, health.py, integrations.py]

- name: Install the bounded public root handoff from its GitOps owner
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/gitops/{{ item }}'
    dest: '/opt/cloudlab/automation/gitops/{{ item }}'
    mode: '0600'
  loop: [bootstrap.py, source_transition.py]

- name: Discover existing CNPG and private access inputs
  ansible.builtin.command:
    argv: [python3, /opt/cloudlab/automation/identity/bootstrap.py, inputs]
  register: identity_private_inputs
  changed_when: false
  no_log: true

- name: Reconcile only the bounded identity Application
  ansible.builtin.command:
    argv: [python3, /opt/cloudlab/automation/identity/bootstrap.py, '{{ identity_phase }}']
    stdin: "{{ (identity_public_source.stdout | from_json) | combine({'values': identity_private_inputs.stdout | from_json}) | to_json }}"
  register: identity_result
  changed_when: identity_result.rc == 0 and (identity_result.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require identity convergence
  ansible.builtin.assert:
    that: identity_result.rc == 0
    fail_msg: '{{ identity_result.stderr }}'

- name: Report the redacted identity phase result
  ansible.builtin.debug:
    msg: '{{ identity_result.stdout | from_json }}'
