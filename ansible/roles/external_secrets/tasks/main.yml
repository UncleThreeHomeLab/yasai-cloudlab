---
- name: Require the bootstrap service account token
  ansible.builtin.assert:
    that: external_secrets_token | length > 0
    fail_msg: Set OP_SERVICE_ACCOUNT_TOKEN in .env.
  no_log: true

- name: Inspect the ESO ownership checkpoint
  ansible.builtin.stat:
    path: /var/lib/cloudlab/external-secrets/ownership.json
  register: external_secrets_checkpoint

- name: Detect an existing ESO namespace before adopting its baseline
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, namespace, external-secrets, --ignore-not-found, -o, name]
  register: external_secrets_existing
  changed_when: false

- name: Require host access and early recovery before changing existing ownership
  ansible.builtin.include_role:
    name: gitops
    tasks_from: prerequisites
  when: not external_secrets_checkpoint.stat.exists and external_secrets_existing.stdout | length > 0

- name: Require same-version chart parity before initial adoption
  ansible.builtin.command:
    argv: [python, /workspace/verification/integration/chart_parity.py]
  delegate_to: localhost
  become: false
  changed_when: false
  when: not external_secrets_checkpoint.stat.exists

- name: Render the locked ESO module used by Argo
  ansible.builtin.command:
    argv: [python, /workspace/automation/external_secrets/chart.py]
  delegate_to: localhost
  become: false
  register: external_secrets_chart
  changed_when: false
  no_log: true

- name: Create the bounded ESO tooling directory
  ansible.builtin.file:
    path: /var/lib/cloudlab/external-secrets
    state: directory
    mode: '0750'

- name: Install the bounded ESO transition and existing verification
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../automation/external_secrets/{{ item }}'
    dest: '/var/lib/cloudlab/external-secrets/{{ item }}'
    mode: '0640'
  loop: [bootstrap.py, verify.py]

- name: Seed the operator only before release of bootstrap ownership
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/external-secrets/bootstrap.py, "{{ 'seed-stop' if lookup('env', 'LAB_ESO_STOP_AFTER_SEED') == '1' else 'seed' }}"]
    stdin: '{{ external_secrets_chart.stdout }}'
  register: external_secrets_seed
  changed_when: external_secrets_seed.rc == 0 and (external_secrets_seed.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require safe ESO seed or resume
  ansible.builtin.assert:
    that: external_secrets_seed.rc == 0
    fail_msg: '{{ external_secrets_seed.stderr }}'

- name: Stop this explicit interruption fixture after its durable seed checkpoint
  ansible.builtin.meta: end_play
  when: lookup('env', 'LAB_ESO_STOP_AFTER_SEED') == '1'

- name: Reconcile only the bootstrap-owned 1Password token
  ansible.builtin.include_tasks: token.yml

- name: Release operator and store reconciliation to Argo
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/external-secrets/bootstrap.py, release]
    stdin: '{{ external_secrets_chart.stdout }}'
  register: external_secrets_release
  changed_when: external_secrets_release.rc == 0 and (external_secrets_release.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require the durable writer-release checkpoint
  ansible.builtin.assert:
    that: external_secrets_release.rc == 0
    fail_msg: '{{ external_secrets_release.stderr }}'

- name: Notify ESO only when its bootstrap token changes
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/external-secrets/bootstrap.py, notify]
    stdin: '{{ external_secrets_chart.stdout }}'
  register: external_secrets_notification
  changed_when: external_secrets_notification.rc == 0 and (external_secrets_notification.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require bootstrap credential notification to succeed
  ansible.builtin.assert:
    that: external_secrets_notification.rc == 0
    fail_msg: '{{ external_secrets_notification.stderr }}'

- name: Wait for CloudLab vault access
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, wait, --for=condition=Ready, --timeout=180s, 'clustersecretstore/{{ external_secrets_store }}']
  changed_when: false

- name: Report ESO ownership without resource or credential diagnostics
  ansible.builtin.debug:
    msg: '{{ external_secrets_release.stdout | from_json }}'
