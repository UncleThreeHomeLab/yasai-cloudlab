---
- name: Verify External Secrets controllers
  ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status deployment -n external-secrets --timeout=300s
  changed_when: false

- name: Verify live store readiness and secret reconciliation
  ansible.builtin.command:
    argv: "{{ ['python3', '/var/lib/cloudlab/external-secrets/verify.py', external_secrets_store] + (['argo'] if external_secrets_gitops_enabled | bool else []) }}"
  register: external_secrets_proof
  changed_when: true
  no_log: true
  failed_when: false

- name: Require External Secrets proof to pass
  ansible.builtin.assert:
    that: external_secrets_proof.rc == 0
    fail_msg: External Secrets verification failed; inspect controller health and CloudLab service account access locally.
    success_msg: CloudLab store ready; disposable Secret creation, refresh, and drift repair passed.

- name: Render ESO ownership verification inputs
  ansible.builtin.command:
    argv: [python, /workspace/automation/external_secrets/chart.py]
  delegate_to: localhost
  become: false
  register: external_secrets_acceptance_payload
  changed_when: false
  no_log: true
  when: external_secrets_gitops_enabled | bool

- name: Verify preserved identities and accept the ESO Argo owner
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/external-secrets/bootstrap.py, accept]
    stdin: '{{ external_secrets_acceptance_payload.stdout }}'
  register: external_secrets_acceptance
  changed_when: external_secrets_acceptance.rc == 0 and (external_secrets_acceptance.stdout | from_json).changed
  until: external_secrets_acceptance.rc != 2
  retries: 40
  delay: 5
  failed_when: false
  no_log: true
  when: external_secrets_gitops_enabled | bool

- name: Require ESO identity and ownership acceptance without retrying permanent failures
  ansible.builtin.assert:
    that: external_secrets_acceptance.rc == 0
    fail_msg: '{{ external_secrets_acceptance.stderr }}'
    success_msg: ESO operator/store identities and existing generated credentials survived Argo adoption.
  when: external_secrets_gitops_enabled | bool
