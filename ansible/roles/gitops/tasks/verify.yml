---
- name: Render committed GitOps verification inputs
  ansible.builtin.command:
    argv: [python, /workspace/automation/gitops/render.py]
  delegate_to: localhost
  become: false
  register: gitops_verification_payload
  changed_when: false
  no_log: true
- name: Prove public source restrictions and private Argo access
  ansible.builtin.command:
    argv: [python3, /opt/cloudlab/gitops/verify.py]
    stdin: '{{ gitops_verification_payload.stdout }}'
  register: gitops_verification
  changed_when: false
  failed_when: false
  no_log: true
- name: Require the public GitOps behavior checks to pass
  ansible.builtin.assert:
    that: gitops_verification.rc == 0
    fail_msg: '{{ gitops_verification.stderr }}'
- name: Report only the sanitized public GitOps proof
  ansible.builtin.debug:
    msg: '{{ gitops_verification.stdout | from_json }}'

- name: Render optional private verification inputs
  ansible.builtin.command:
    argv: [python, /workspace/automation/gitops/private_sources.py]
  delegate_to: localhost
  become: false
  register: gitops_private_verification_payload
  changed_when: false
  no_log: true

- name: Prove private convergence and fixture retention without public diagnostics
  ansible.builtin.command:
    argv: [python3, /opt/cloudlab/gitops/private_verify.py]
    stdin: '{{ (gitops_private_verification_payload.stdout | from_json) | combine({"store": external_secrets_store}) | to_json }}'
  register: gitops_private_verification
  changed_when: false
  failed_when: false
  no_log: true

- name: Require configured private sources to pass their checks
  ansible.builtin.assert:
    that: gitops_private_verification.rc == 0
    fail_msg: '{{ gitops_private_verification.stderr }}'

- name: Report sanitized private verification counts
  ansible.builtin.debug:
    msg: '{{ gitops_private_verification.stdout | from_json }}'

- name: Prove certificate issuance and reissuance
  ansible.builtin.include_role:
    name: certificates
    tasks_from: verify
  when: certificates_enabled | bool

- name: Prove ambient identity and internal gateway isolation
  ansible.builtin.include_role:
    name: mesh
    tasks_from: verify
  when: mesh_enabled | bool

- name: Prove outside and tailnet access before any legacy ingress cutover
  ansible.builtin.include_role:
    name: connectivity
    tasks_from: verify
  when: access_enabled | bool
