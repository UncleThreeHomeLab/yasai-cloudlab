---
- name: Reconcile the bounded access Application
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Validate the published GitOps source
      ansible.builtin.command:
        argv: [python, /workspace/automation/gitops/render.py]
      delegate_to: localhost
      become: false
      register: gitops_payload
      changed_when: false
      no_log: true
  roles:
    - connectivity

- name: Configure independent private resolvers on both hosts
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    wireguard_peer_address: "{{ hostvars[wireguard_peer_host]['wireguard_address'] }}"
    wireguard_peer_endpoint: "{{ hostvars[wireguard_peer_host]['wireguard_public_endpoint'] }}"
  roles:
    - firewall
  tasks:
    - name: Configure private DNS
      ansible.builtin.include_role:
        name: connectivity
        tasks_from: dns
