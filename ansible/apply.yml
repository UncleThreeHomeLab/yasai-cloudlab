---
- name: Prepare both hosts and their encrypted network
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    wireguard_peer_address: "{{ hostvars[wireguard_peer_host]['wireguard_address'] }}"
    wireguard_peer_endpoint: "{{ hostvars[wireguard_peer_host]['wireguard_public_endpoint'] }}"
    wireguard_peer_public_key: "{{ hostvars[wireguard_peer_host]['wireguard_public_key'] }}"
  roles:
    - host
    - firewall
    - wireguard
    - role: tailscale
      when: tailscale_enabled | bool

- name: Configure the control plane and publish the worker join credential
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - k3s

  tasks:
    - name: Publish the K3s worker join credential
      ansible.builtin.include_role:
        name: k3s
        tasks_from: join_token

- name: Join the worker over WireGuard
  hosts: k3s_agents
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    k3s_join_token: "{{ hostvars[k3s_server_host]['k3s_agent_join_token'] }}"
  roles:
    - k3s

- name: Prepare persistent storage on both nodes
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - longhorn_host

- name: Install and reconcile secrets and replicated storage
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - external_secrets
    - longhorn
    - role: longhorn_backup
      when: longhorn_backup_enabled | bool
    - recovery

- name: Bootstrap or verify the public GitOps ownership boundary
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - gitops

- name: Configure independent private resolvers on both hosts
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Configure private DNS after access readiness
      ansible.builtin.include_role:
        name: connectivity
        tasks_from: dns
      when: access_enabled | bool

- name: Provision application data after both private resolvers are ready
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Reconcile application data grants and buckets
      ansible.builtin.include_role:
        name: application_data
        tasks_from: finalize
      when: data_enabled | bool

    - name: Resolve the current source for the accepted identity owner
      ansible.builtin.command: python /workspace/automation/identity/inputs.py
      environment: {LAB_IDENTITY_PHASE: retained}
      delegate_to: localhost
      become: false
      register: identity_public_source
      changed_when: false
      no_log: true
      when: observability_enabled | bool

    - name: Reconcile only the accepted retired identity before its consumers
      ansible.builtin.include_role:
        name: identity
      vars:
        identity_phase: retained
      when: observability_enabled | bool

    - name: Configure services after scoped data grants and buckets converge
      ansible.builtin.include_role:
        name: services
      when: services_enabled | bool

    - name: Reconcile telemetry after retained identity and service owners
      ansible.builtin.include_role:
        name: observability
      when: observability_enabled | bool
