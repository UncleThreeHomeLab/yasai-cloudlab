---
- name: Provision application data after both private resolvers are ready
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Reconcile application data grants and buckets
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/data/tasks/finalize.yml
      when: data_enabled | bool

    - name: Resolve the current source for the accepted identity owner
      ansible.builtin.command: python /workspace/automation/identity/inputs.py
      environment: {LAB_IDENTITY_PHASE: retained}
      delegate_to: localhost
      become: false
      register: identity_public_source
      changed_when: false
      no_log: true
      when: (observability_enabled | bool) or (harbor_enabled | bool)

    - name: Reconcile only the accepted retired identity before its consumers
      ansible.builtin.include_role:
        name: identity
      vars:
        identity_phase: retained
      when: (observability_enabled | bool) or (harbor_enabled | bool)

    - name: Configure services after scoped data grants and buckets converge
      ansible.builtin.include_role:
        name: services
      when: services_enabled | bool

    - name: Reconcile telemetry after retained identity and service owners
      ansible.builtin.include_role:
        name: observability
      when: observability_enabled | bool

    - name: Reconcile the private registry after identity and private DNS
      ansible.builtin.include_role:
        name: harbor
        apply: {tags: [harbor]}
      tags: [harbor]
      when: harbor_enabled | bool
