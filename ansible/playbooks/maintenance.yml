---
- name: Require explicit maintenance scope
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refuse unspecified maintenance before mutation
      ansible.builtin.fail:
        msg: >-
          Select a named component operation for the exact resource scope.
          Host packages remain on configured Debian repositories; distribution upgrades,
          reboots and arbitrary package updates are unsupported. Preserve independent
          access, readiness and recovery gates. No mutation performed.
