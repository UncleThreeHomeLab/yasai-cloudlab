---
- name: Verify workload admission and restricted Pod Security
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Resolve the approved catalog for composition security verification
      ansible.builtin.command: python -m playbooks.services.files.payload
      args: {chdir: /workspace}
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
      register: admission_service_catalog
      when: admission_enabled | bool and services_enabled | bool

    - name: Verify published admission controllers and declared policy behavior
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys, types
            sys.path.insert(0, '/opt/cloudlab')
            import playbooks.services.files as services_files
            module = types.ModuleType('playbooks.services.files.composition_verify')
            module.__package__ = 'playbooks.services.files'
            module.__file__ = '/opt/cloudlab/playbooks/services/files/composition_verify.py'
            sys.modules[module.__name__] = module
            services_files.composition_verify = module
            exec(compile({{ lookup('file', '/workspace/ansible/playbooks/services/files/composition_verify.py') | to_json }},
              module.__file__, 'exec'), module.__dict__)
            import playbooks
            for name, path in (('playbooks.admission', '/opt/cloudlab/playbooks/admission'),
              ('playbooks.admission.files', '/opt/cloudlab/playbooks/admission/files')):
                if name not in sys.modules:
                    package = types.ModuleType(name)
                    package.__path__ = [path]
                    sys.modules[name] = package
                    setattr(sys.modules[name.rsplit('.', 1)[0]], name.rsplit('.', 1)[1], package)
            module = types.ModuleType('playbooks.admission.files.namespace_guard')
            module.__package__ = 'playbooks.admission.files'
            module.__file__ = '/opt/cloudlab/playbooks/admission/files/namespace_guard.py'
            sys.modules[module.__name__] = module
            sys.modules['playbooks.admission.files'].namespace_guard = module
            exec(compile({{ lookup('file', '/workspace/ansible/playbooks/admission/files/namespace_guard.py') | to_json }},
              module.__file__, 'exec'), module.__dict__)
            exec(compile({{ lookup('file', '/workspace/ansible/playbooks/admission/files/verify.py') | to_json }},
              '/opt/cloudlab/playbooks/admission/files/verify.py', 'exec'),
              {'__name__': '__main__', '__file__': '/opt/cloudlab/playbooks/admission/files/verify.py'})
          - '{{ lookup("pipe", "git -C /workspace rev-parse HEAD") }}'
          - "{{ (lookup('file', '/workspace/platform/delivery/admission/policies/values.yaml') | from_yaml).validationActions | to_json }}"
      args:
        stdin: "{{ {'catalog': ((admission_service_catalog.stdout | from_json)['values']['catalog'] if services_enabled | bool else []),
          'permissionsGuard': (lookup('file', '/workspace/platform/delivery/admission/policies/templates/permissions.yaml') | from_yaml_all | list),
          'namespaceGuard': (lookup('file', '/workspace/platform/delivery/admission/policies/templates/workload-namespace.yaml') | from_yaml)} | to_json }}"
      changed_when: false
      no_log: true
      register: admission_verified
      when: admission_enabled | bool

    - name: Report sanitized admission evidence
      ansible.builtin.debug:
        msg: '{{ admission_verified.stdout | from_json }}'
      when: admission_enabled | bool

    - name: Verify shared CI admission and runner API permissions
      ansible.builtin.script:
        cmd: >-
          files/ci_verify.py
          {{ (lookup('file', '/workspace/platform/delivery/admission/policies/values.yaml') | from_yaml).runnerValidationActions | to_json | quote }}
        executable: python3
      changed_when: false
      no_log: true
      register: ci_admission_verified
      when: admission_enabled | bool and ((lookup('file', '/workspace/gitops/roots/public/values.yaml') | from_yaml).ci.enabled | default(false) | bool)

    - name: Report sanitized CI admission evidence
      ansible.builtin.debug:
        msg: '{{ ci_admission_verified.stdout | from_json }}'
      when: ci_admission_verified is not skipped
