---
- name: Verify workload admission and restricted Pod Security
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Resolve the approved catalog for composition security verification
      ansible.builtin.command: python -m playbooks.services.files.payload
      args: {chdir: /workspace}
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
      register: admission_service_catalog
      when: admission_enabled | bool and services_enabled | bool

    - name: Verify published admission controllers and declared policy behavior
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('file', '/workspace/ansible/playbooks/admission/files/verify.py') }}"
          - '{{ lookup("pipe", "git -C /workspace rev-parse HEAD") }}'
          - "{{ (lookup('file', '/workspace/platform/delivery/admission/policies/values.yaml') | from_yaml).validationActions | to_json }}"
      args:
        stdin: "{{ ((admission_service_catalog.stdout | from_json)['values']['catalog'] if services_enabled | bool else []) | to_json }}"
      changed_when: false
      no_log: true
      register: admission_verified
      when: admission_enabled | bool

    - name: Report sanitized admission evidence
      ansible.builtin.debug:
        msg: '{{ admission_verified.stdout | from_json }}'
      when: admission_enabled | bool

    - name: Verify shared CI admission and runner API permissions
      ansible.builtin.script:
        cmd: >-
          files/ci_verify.py
          {{ (lookup('file', '/workspace/platform/delivery/admission/policies/values.yaml') | from_yaml).runnerValidationActions | to_json | quote }}
        executable: python3
      changed_when: false
      no_log: true
      register: ci_admission_verified
      when: admission_enabled | bool and ((lookup('file', '/workspace/gitops/roots/public/values.yaml') | from_yaml).ci.enabled | default(false) | bool)

    - name: Report sanitized CI admission evidence
      ansible.builtin.debug:
        msg: '{{ ci_admission_verified.stdout | from_json }}'
      when: ci_admission_verified is not skipped
