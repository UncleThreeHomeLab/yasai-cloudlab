---
- name: Prepare native provider locks for explicit dependency review
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    infrastructure_root: "{{ lookup('ansible.builtin.env', 'LAB_INFRA_ROOT') }}"
  vars_files: [/workspace/ansible/playbooks/infrastructure/vars.yml]
  tasks:
    - name: Require one accepted provider source
      ansible.builtin.assert:
        that: infrastructure_root in ['cloudflare', 'github']
    - name: Allocate disposable lock review workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: infrastructure-lock-review-
      register: infrastructure_lock_review
    - name: Copy native declarations without changing tracked pins
      ansible.builtin.copy:
        src: '/workspace/infra/{{ infrastructure_root }}/'
        dest: '{{ infrastructure_lock_review.path }}/'
        mode: preserve
    - name: Remove only the disposable copied lock
      ansible.builtin.file:
        path: '{{ infrastructure_lock_review.path }}/.terraform.lock.hcl'
        state: absent
    - name: Prepare and validate provider locks through native commands
      ansible.builtin.command:
        argv: '{{ item }}'
        chdir: '{{ infrastructure_lock_review.path }}'
      loop:
        - [tofu, fmt, -recursive]
        - >-
          {{ ['tofu', 'providers', 'lock']
             + (['-fs-mirror=/opt/providers'] if infrastructure_root == 'cloudflare' else [])
             + ['-platform=linux_amd64'] }}
        - [tofu, init, -backend=false, -input=false, -lockfile=readonly]
        - [tofu, validate, -no-color]
      environment: '{{ infrastructure_offline_environment }}'
      changed_when: item[1] in ['fmt', 'providers', 'init']
    - name: Retain native lock output for dependency review
      ansible.builtin.debug:
        msg: 'Review {{ infrastructure_lock_review.path }}; tracked pins remain unchanged.'
