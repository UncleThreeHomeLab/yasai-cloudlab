---
- name: Run the scoped Harbor native state operation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Execute the reviewed Harbor custody transaction
      ansible.builtin.command:
        argv: "{{ ['python', '-m', 'playbooks.infrastructure.files.harbor'] + (lookup('ansible.builtin.env', 'LAB_INFRA_ARGUMENTS') | from_json) }}"
        chdir: /workspace
      register: infrastructure_harbor
      no_log: true
      changed_when: >-
        (lookup('ansible.builtin.env', 'LAB_INFRA_ARGUMENTS') | from_json)[0]
        in ['apply', 'recover-apply', 'recover-state', 'recover-import', 'inputs']
    - name: Report sanitized Harbor transaction result
      ansible.builtin.debug:
        var: infrastructure_harbor.stdout_lines
