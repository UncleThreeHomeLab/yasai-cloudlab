---
- name: Read the retained data Application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: '{{ data_native_contract.bootstrap_application }}'
  register: data_ca_application
  no_log: true

- name: Require the existing data owner and ordinary reconciliation mode
  ansible.builtin.assert:
    that:
      - data_ca_application.resources | length == 1
      - data_ca_application.resources[0].metadata.labels['cloudlab.io/owner'] == data_native_owner
      - not data_ca_application.resources[0].spec.source.helm.valuesObject.maintenance | bool
    fail_msg: Data repair requires the retained owner outside maintenance.
    quiet: true
  no_log: true

- name: Read approved settings through the data owner's public interface
  ansible.builtin.set_fact:
    data_native_values: '{{ data_ca_application.resources[0].spec.source.helm.valuesObject }}'
  no_log: true
