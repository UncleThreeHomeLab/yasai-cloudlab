---
- name: Install serialized data service jobs
  ansible.builtin.template:
    src: '/workspace/ansible/playbooks/data/templates/service.j2'
    dest: '/etc/systemd/system/cloudlab-data-{{ item.name }}.service'
    mode: '0644'
  loop:
    - {name: monthly, module: backup, action: monthly}
    - {name: freshness, module: backup, action: freshness}
    - {name: reconcile, module: control, action: reconcile}
  notify: Reload application data units

- name: Inspect the superseded daily application timer
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudlab-data-local.timer
  register: data_daily_timer

- name: Disable the superseded daily application timer
  ansible.builtin.systemd_service:
    name: cloudlab-data-local.timer
    enabled: false
    state: stopped
  when: data_daily_timer.stat.exists

- name: Remove the superseded daily application units
  ansible.builtin.file:
    path: '/etc/systemd/system/cloudlab-data-local.{{ item }}'
    state: absent
  loop: [timer, service]
  notify: Reload application data units

- name: Install monthly backup and local receipt-check schedules
  ansible.builtin.template:
    src: '/workspace/ansible/playbooks/data/templates/timer.j2'
    dest: '/etc/systemd/system/cloudlab-data-{{ item.name }}.timer'
    mode: '0644'
  loop:
    - {name: monthly, calendar: '{{ data_policy.monthly_calendar }}'}
    - {name: freshness, calendar: '*-*-* 06:00:00 UTC'}
    - {name: reconcile, calendar: '*-*-* *:0/5:00 UTC'}
  notify: Reload application data units

- name: Load the declared data job definitions
  ansible.builtin.meta: flush_handlers

- name: Enable data timers
  ansible.builtin.systemd_service:
    name: 'cloudlab-data-{{ item }}.timer'
    enabled: true
    state: started
  loop: [monthly, freshness, reconcile]
