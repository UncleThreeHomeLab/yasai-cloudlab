---
- name: Install maintained host clients for independent scheduled repair
  ansible.builtin.import_tasks: /workspace/ansible/playbooks/host/tasks/ansible-client.yml

- name: Resolve the immutable native deployment source
  ansible.builtin.command:
    argv: [git, -C, /workspace, rev-parse, HEAD]
  delegate_to: localhost
  become: false
  register: data_ca_revision
  changed_when: false

- name: Require an immutable deployment directory
  ansible.builtin.assert:
    that: data_ca_revision.stdout is match('^[0-9a-f]{40}$')
    quiet: true

- name: Set the staged public trust runtime path
  ansible.builtin.set_fact:
    data_ca_stage: '/opt/cloudlab/playbooks/data/ca/{{ data_ca_revision.stdout }}'

- name: Create private immutable native runtime directories
  ansible.builtin.file:
    path: '{{ data_ca_stage }}/{{ item }}'
    state: directory
    mode: '0700'
  loop: ['', tasks, templates, files]

- name: Stage native public trust declarations and the small dispatch interface
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/data/{{ item }}'
    dest: '{{ data_ca_stage }}/{{ item }}'
    mode: '0600'
  loop:
    - native-ca.yml
    - native-ca-install.yml
    - tasks/ca-source.yml
    - tasks/ca-consumer.yml
    - tasks/ca-existing-namespace.yml
    - tasks/ca-target-owner.yml
    - tasks/ca-handoff.yml
    - tasks/ca-write.yml
    - templates/database-ca.yml.j2
    - templates/database-ca-patch.yml.j2
    - files/control.py
    - files/rotation.py
    - files/verify.py

- name: Inspect whether this is an initial data bootstrap
  ansible.builtin.stat:
    path: /opt/cloudlab/playbooks/data/files/control.py
    follow: false
  register: data_ca_installed_control

- name: Install initial imports before configuring data for the first time
  ansible.builtin.copy:
    src: '{{ data_ca_stage }}/files/{{ item }}'
    dest: '/opt/cloudlab/playbooks/data/files/{{ item }}'
    remote_src: true
    mode: '0600'
  loop: [control.py, rotation.py, verify.py]
  when: not data_ca_installed_control.stat.exists
