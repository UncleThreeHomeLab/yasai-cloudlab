---
- name: Require the namespace's sole service-platform owner
  ansible.builtin.assert:
    that:
      - data_ca_namespace_info.resources[0].metadata.labels['cloudlab.io/owner'] | default('') == 'service-platform'
      - (data_ca_namespace_info.resources[0].metadata.annotations | default({})).get('argocd.argoproj.io/tracking-id', '').startswith('cloudlab-services:')
      - not data_ca_namespace_info.resources[0].metadata.ownerReferences | default([])
    fail_msg: CA projection namespace has an ambiguous owner.
    quiet: true

- name: Inspect the existing public trust object
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ data_ca_namespace }}'
    name: database-ca
  register: data_ca_current_info

- name: Record the observed target and clear per-consumer release state
  ansible.builtin.set_fact:
    data_ca_current: '{{ data_ca_current_info.resources | first | default({}) }}'
    data_ca_service: '{{ data_ca_namespace | regex_replace("^cloudlab-app-", "") }}'
    data_ca_release_ready: true

- name: Validate retained ownership and any prior Argo handoff
  ansible.builtin.import_tasks: ca-target-owner.yml
  when: data_ca_current_info.resources | length == 1

- name: Update only the released public trust fields
  ansible.builtin.import_tasks: ca-write.yml
  when: data_ca_release_ready
