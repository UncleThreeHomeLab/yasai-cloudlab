---
- name: Resolve the committed data contract and private identities
  ansible.builtin.command: python /workspace/ansible/playbooks/data/files/inputs.py
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: data_payload

- name: Install the host parser used for isolated chart restores
  ansible.builtin.apt:
    name: [python3-yaml, python3-cryptography]
    state: present

- name: Create private data automation directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0700'
  loop:
    - /opt/cloudlab/playbooks/data/files
    - /opt/cloudlab/playbooks/istio/files
    - /opt/cloudlab/automation/identity
    - /opt/cloudlab/playbooks/argocd/files
    - /opt/cloudlab/playbooks/longhorn/files
    - /opt/cloudlab/platform/data
    - /var/lib/cloudlab/application-data

- name: Install the authoritative monthly window before data consumers
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/longhorn/files/monthly_window.py
    dest: /opt/cloudlab/playbooks/longhorn/files/monthly_window.py
    mode: '0600'

- name: Install the public convergence helper from its GitOps owner
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/argocd/files/source_revision.py'
    dest: /opt/cloudlab/playbooks/argocd/files/source_revision.py
    mode: '0600'

- name: Install the shared Kubernetes helper from its owner
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/istio/files/kube.py'
    dest: /opt/cloudlab/playbooks/istio/files/kube.py
    mode: '0600'

- name: Retain the locked restore artifacts and recovery policy
  ansible.builtin.copy:
    src: '/workspace/platform/data/{{ item }}/'
    dest: '/opt/cloudlab/platform/data/{{ item }}/'
    mode: '0600'
    directory_mode: '0700'
  loop: [cnpg, seaweedfs]

- name: Create the identity restore artifact directory
  ansible.builtin.file:
    path: /opt/cloudlab/platform/identity/keycloak
    state: directory
    mode: '0700'

- name: Install the pinned identity restore artifacts from their owner
  ansible.builtin.copy:
    src: '/workspace/platform/identity/keycloak/{{ item }}'
    dest: '/opt/cloudlab/platform/identity/keycloak/{{ item }}'
    mode: '0600'
  loop: [artifact.lock.json, config-cli.properties]

- name: Install the single application data policy
  ansible.builtin.copy:
    src: '/workspace/platform/data/contract.json'
    dest: /opt/cloudlab/platform/data/contract.json
    mode: '0600'

- name: Install the pinned restore rendering tool
  ansible.builtin.copy:
    src: '/usr/local/bin/{{ item }}'
    dest: '/usr/local/bin/{{ item }}'
    mode: '0755'
  loop: [helm]

- name: Install application data automation from its owner
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/data/files/{{ item }}'
    dest: '/opt/cloudlab/playbooks/data/files/{{ item }}'
    mode: '0600'
  loop:
    - configuration.py
    - control.py
    - requests.py
    - service_proof.py
    - s3.py
    - capture.py
    - remote.py
    - backup.py
    - restore.py
    - verify.py
    - rotation.py
    - volumes.py
    - physical.py

- name: Install identity hooks for the shared monthly capture and restore boundary
  ansible.builtin.copy:
    src: '/workspace/automation/identity/{{ item }}'
    dest: '/opt/cloudlab/automation/identity/{{ item }}'
    mode: '0600'
  loop: [maintenance.py, recovery.py, configuration.py, isolated_restore.py, tokens.py]
