---
- name: Qualify native SQL and public trust under the existing data lock
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --nonblock
      - /var/lib/cloudlab/application-data/owner.lock
      - /usr/bin/ansible-playbook
      - -i
      - localhost,
      - '{{ data_ca_stage }}/native-install.yml'
  environment:
    ANSIBLE_CONFIG: '{{ host_ansible_config }}'
    ANSIBLE_COLLECTIONS_PATH: '{{ host_ansible_collections }}'
    ANSIBLE_NOCOLOR: '1'
  register: data_ca_handoff
  changed_when: data_ca_handoff.stdout is search('changed=[1-9][0-9]*')
  no_log: true
