---
- name: Validate published public data inputs before host mutation
  ansible.builtin.command: python /workspace/ansible/playbooks/data/files/inputs.py metadata
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: data_public_payload
- name: Validate explicit handoff inputs before runtime installation
  ansible.builtin.assert:
    that:
      - data_handoff_prepare | default(false) is boolean
      - not (data_handoff_prepare | default(false)) or data_handoff_target is mapping
    fail_msg: Data handoff requires a boolean request and an exact approved target.
    quiet: true
  no_log: true
- name: Install data artifacts and component runtime
  ansible.builtin.import_tasks: runtime.yml
- name: Select the existing owner before constructing initial private values
  ansible.builtin.import_tasks: source.yml
- name: Accept scoped data ownership under its shared transaction lock
  ansible.builtin.import_tasks: configure.yml
- name: Prepare an explicitly requested data ownership handoff
  ansible.builtin.import_tasks: handoff.yml
  when: data_handoff_prepare | default(false) | bool
- name: Configure independent data repair and monthly schedules
  ansible.builtin.import_tasks: schedules.yml
