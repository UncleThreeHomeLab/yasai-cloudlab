---
- name: Read the target's retained ownership metadata
  ansible.builtin.set_fact:
    data_ca_labels: '{{ data_ca_current.metadata.labels | default({}) }}'
    data_ca_tracking: '{{ (data_ca_current.metadata.annotations | default({})).get("argocd.argoproj.io/tracking-id", "") }}'

- name: Reject ambiguous public trust ownership before handoff
  ansible.builtin.assert:
    that:
      - not data_ca_current.metadata.ownerReferences | default([])
      - >-
        data_ca_labels.get('cloudlab.io/owner') == data_ca_owner or
        ('cloudlab.io/owner' not in data_ca_labels and data_ca_tracking.startswith(data_ca_service + '-' + data_ca_service + ':'))
    fail_msg: Database CA configuration has an ambiguous owner.
    quiet: true

- name: Inspect the prior Argo owner before releasing its fields
  ansible.builtin.import_tasks: ca-handoff.yml
  when: data_ca_tracking | length > 0

- name: Require only the public CA data and a single released writer
  ansible.builtin.assert:
    that:
      - (data_ca_current.data | default({}) | list | difference(['ca.crt'])) | length == 0
      - not (data_ca_labels.get('cloudlab.io/owner') == data_ca_owner and data_ca_tracking)
    fail_msg: Database CA contains unrelated data or competing writers.
    quiet: true
  when: data_ca_release_ready
