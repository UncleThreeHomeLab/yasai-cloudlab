---
- name: Inspect the current service Application without changing it
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: '{{ data_ca_service }}-{{ data_ca_service }}'
  register: data_ca_prior_application

- name: Read the prior owner's current declarative source
  ansible.builtin.set_fact:
    data_ca_prior: '{{ data_ca_prior_application.resources | first | default({}) }}'

- name: Read the current source and observed synchronization
  ansible.builtin.set_fact:
    data_ca_prior_source: '{{ (data_ca_prior.spec.sources | default([]) | first) | default(data_ca_prior.spec.source | default({})) }}'
    data_ca_prior_status: '{{ data_ca_prior.status | default({}) }}'

- name: Release only a healthy current revision that no longer renders the trust object
  ansible.builtin.set_fact:
    data_ca_release_ready: >-
      {{ data_ca_prior_source.helm.valuesObject.definition | default({}) | length > 0
         and data_ca_prior_status.sync.revision | default('') == data_ca_prior_source.targetRevision | default('missing')
         and data_ca_prior_status.sync.status | default('') == 'Synced'
         and data_ca_prior_status.health.status | default('') == 'Healthy'
         and data_ca_prior_status.operationState.phase | default('') not in ['Running', 'Terminating']
         and not data_ca_prior.operation | default({})
         and data_ca_prior_status.conditions | default([]) | selectattr('type', 'search', 'Error$') | list | length == 0 }}
