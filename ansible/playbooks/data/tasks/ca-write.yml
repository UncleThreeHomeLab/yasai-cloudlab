---
# state=present may adopt an object created between ownership inspection and its own GET.
- name: Create missing public trust without adopting a concurrent writer
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, '--kubeconfig=/etc/rancher/k3s/k3s.yaml', '--request-timeout=30s', create, -f, '-']
    stdin: '{{ lookup("ansible.builtin.template", "../templates/database-ca.yml.j2") }}'
  changed_when: true
  when: data_ca_current_info.resources | length == 0

- name: Repair public trust with retained UID and resource-version preconditions
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ data_ca_namespace }}'
    name: database-ca
    patch: '{{ lookup("ansible.builtin.template", "../templates/database-ca-patch.yml.j2") | from_yaml }}'
  when:
    - data_ca_current_info.resources | length == 1
    - >-
      data_ca_labels.get('cloudlab.io/owner') != data_native_owner or
      data_ca_current.data | default({}) != {'ca.crt': data_ca_public}
