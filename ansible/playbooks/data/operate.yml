---
- name: Run explicit application data operation
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    data_action: "{{ lookup('env', 'LAB_DATA_ACTION') }}"
    data_operations:
      monthly: {module: backup, writes: true}
      acceptance-export: {module: backup, writes: true}
      restore-offsite: {module: backup, writes: true}
      freshness: {module: backup, writes: false}
      resume: {module: control, writes: true}
      cleanup-fixtures: {module: backup, writes: true}
  tasks:
    - name: Require enabled data and explicit supported operation
      ansible.builtin.assert:
        that:
          - data_enabled | bool
          - data_action in data_operations or data_action in ['bootstrap', 'check']
        fail_msg: Select an enabled application data operation.

    - name: Configure scoped application data when explicitly requested
      ansible.builtin.import_tasks: tasks/main.yml
      when: data_action == 'bootstrap'

    - name: Reconcile scoped grants and buckets after configuration
      ansible.builtin.import_tasks: tasks/finalize.yml
      when: data_action == 'bootstrap'

    - name: Verify scoped access and local recovery
      ansible.builtin.import_tasks: tasks/verify.yml
      when: data_action == 'check'

    - name: Run the declared data operation
      ansible.builtin.command:
        argv: [python3, '/opt/cloudlab/playbooks/data/files/{{ data_operations[data_action].module }}.py', '{{ data_action }}']
      register: data_action_result
      changed_when:
        - data_action_result.rc == 0
        - data_operations[data_action].writes | bool
        - not (data_action_result.stdout | from_json).get('already_verified_this_month', false)
      failed_when: false
      no_log: true
      when: data_action in data_operations

    - name: Require the operation to pass
      ansible.builtin.assert:
        that: data_action_result.rc == 0
        fail_msg: Data operation failed; private diagnostics withheld and recovery state preserved.
      when: data_action in data_operations

    - name: Report sanitized operation evidence
      ansible.builtin.debug:
        msg: '{{ data_action_result.stdout | from_json }}'
      when: data_action in data_operations
  handlers:
    - name: Reload application data units
      ansible.builtin.systemd_service:
        daemon_reload: true
