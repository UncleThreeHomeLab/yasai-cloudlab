---
- name: Project only the CNPG public CA under the caller's retained data lock
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    data_native_contract: '{{ lookup("ansible.builtin.file", playbook_dir + "/contract.json") | from_json }}'
    data_native_owner: '{{ data_native_contract.bootstrap_owner }}'
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Read approved settings from the retained data owner
      ansible.builtin.import_tasks: tasks/native-settings.yml
    - name: Inspect the retained data Application and current CNPG source
      ansible.builtin.import_tasks: tasks/ca-source.yml
    - name: Project public trust only into declared service consumers
      ansible.builtin.include_tasks: tasks/ca-consumer.yml
      loop: '{{ data_ca_consumers }}'
      loop_control:
        loop_var: data_ca_namespace
        label: '{{ data_ca_namespace }}'
