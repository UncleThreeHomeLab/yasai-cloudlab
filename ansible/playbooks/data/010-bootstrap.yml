---
- name: Configure scoped application data
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Configure data and independent scheduled runtime
      ansible.builtin.import_tasks: tasks/main.yml
      when: data_enabled | bool
  handlers:
    - name: Reload application data units
      ansible.builtin.systemd_service:
        daemon_reload: true
