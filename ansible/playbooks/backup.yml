---
- name: Capture control plane through its independent owner
  ansible.builtin.import_playbook: backup/monthly.yml
- name: Capture SQL and object data through their coordinated owner
  ansible.builtin.import_playbook: data/backup.yml
  when: data_enabled | bool
- name: Capture registry through its coordinated owner
  ansible.builtin.import_playbook: harbor/backup.yml
  when: harbor_enabled | bool
