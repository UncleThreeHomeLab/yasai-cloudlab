name: cloudlab-harbor-provider-fixture
services:
  proof:
    platform: linux/amd64
    build: ../../../runner
    entrypoint: [python, -m, playbooks.harbor.tests.provider_proof]
    working_dir: /workspace
    volumes:
      - ../../../:/workspace/ansible:ro
    tmpfs:
      - /fixture:mode=0700,size=256m,exec
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
