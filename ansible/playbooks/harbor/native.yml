---
- name: Converge native Harbor declarations under the shared recovery lock
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    harbor_policy: "{{ lookup('ansible.builtin.file', '/opt/cloudlab/platform/harbor/policy.json') | from_json }}"
    harbor_native_source:
      repository: "{{ lookup('ansible.builtin.env', 'HARBOR_SOURCE_REPOSITORY') }}"
      revision: "{{ lookup('ansible.builtin.env', 'HARBOR_SOURCE_REVISION') }}"
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Validate retained Harbor prerequisites
      ansible.builtin.import_tasks: tasks/native-inputs.yml
    - name: Declare boundaries before installing their backends
      ansible.builtin.import_tasks: tasks/native-application.yml
      vars:
        harbor_configuring_boundaries: true
    - name: Wait for current vault delivery before installing Harbor
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ExternalSecret
        namespace: '{{ harbor_policy.namespace }}'
        name: '{{ item }}'
      loop: '{{ harbor_policy.secrets }}'
      register: harbor_external_secrets
      until:
        - harbor_external_secrets.resources | length == 1
        - >-
          harbor_external_secrets.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
          | list | length == 1
        - >-
          harbor_external_secrets.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
          | map(attribute='observedGeneration', default=harbor_external_secrets.resources[0].metadata.generation)
          | unique | list == [harbor_external_secrets.resources[0].metadata.generation]
      retries: 60
      delay: 5
      no_log: true
    - name: Declare the Harbor server from committed Helm values
      ansible.builtin.import_tasks: tasks/native-application.yml
      vars:
        harbor_configuring_boundaries: false
    - name: Require the completed private Harbor route
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: cloudlab-harbor-configuration
      register: harbor_complete_route
      until:
        - harbor_complete_route.resources | length == 1
        - harbor_complete_route.resources[0].status.health.status | default('') == 'Healthy'
        - harbor_complete_route.resources[0].status.sync.status | default('') == 'Synced'
        - harbor_complete_route.resources[0].status.sync.revision | default('') == harbor_native_source.revision
      retries: 60
      delay: 5
      no_log: true
