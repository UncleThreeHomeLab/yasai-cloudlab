---
- name: Check the actual node resolver and trusted registry TLS path
  ansible.builtin.uri:
    url: 'https://{{ hostvars[groups["k3s_servers"][0]].harbor_verification_payload.configuration.harborHost }}/v2/'
    method: GET
    status_code: 401
    follow_redirects: none
    validate_certs: true
    use_netrc: false
    use_proxy: false
    timeout: 20
  register: harbor_host_challenge
  no_log: true

- name: Require the expected private registry challenge
  ansible.builtin.assert:
    that:
      - >-
        ('realm="https://' ~ hostvars[groups['k3s_servers'][0]].harbor_verification_payload.configuration.harborHost
         ~ '/service/token"') in harbor_host_challenge.www_authenticate | default('')
    fail_msg: Node host did not reach the authenticated private TLS registry.
    quiet: true
  no_log: true

- name: Report sanitized node registry reachability
  ansible.builtin.debug:
    msg: {host_dns: true, trusted_tls: true, registry_challenge: true}
