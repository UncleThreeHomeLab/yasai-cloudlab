---
- name: Require the published source passed by the portable runner
  ansible.builtin.assert:
    that:
      - harbor_native_source.repository is match('^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[.]git$')
      - harbor_native_source.revision is match('^[a-f0-9]{40}$')
    quiet: true
  no_log: true

- name: Refuse ordinary convergence during interrupted Harbor recovery
  ansible.builtin.stat:
    path: /var/lib/cloudlab/harbor/maintenance.json
  register: harbor_maintenance

- name: Require completed or resumed Harbor recovery
  ansible.builtin.assert:
    that: not harbor_maintenance.stat.exists
    fail_msg: Finish or resume coordinated Harbor recovery before applying setup.
    quiet: true

- name: Read retained identity and gateway public interfaces
  kubernetes.core.k8s_info:
    api_version: '{{ item.api_version }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.namespace }}'
    name: '{{ item.name }}'
  loop:
    - {api_version: argoproj.io/v1alpha1, kind: Application, namespace: argocd, name: cloudlab-identity}
    - {api_version: v1, kind: Service, namespace: cloudlab-gateway-public, name: cloudlab-istio}
    - {api_version: v1, kind: ConfigMap, namespace: cloudlab-identity, name: identity-private-state}
  register: harbor_interfaces
  no_log: true

- name: Require the existing identity and gateway interfaces
  ansible.builtin.assert:
    that: item.resources | length == 1
    quiet: true
  loop: '{{ harbor_interfaces.results }}'
  no_log: true

- name: Read the existing nodes before changing Harbor installation
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: harbor_nodes
  no_log: true

- name: Require both retained nodes and their ready internal interfaces
  ansible.builtin.assert:
    that:
      - harbor_nodes.resources | length == 2
      - >-
        harbor_nodes.resources | map(attribute='status.conditions') | flatten
        | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
        | list | length == 2
      - >-
        harbor_nodes.resources | map(attribute='status.addresses') | flatten
        | selectattr('type', 'equalto', 'InternalIP') | list | length == 2
    fail_msg: Harbor requires both retained nodes ready with their existing internal interfaces.
    quiet: true
  no_log: true

- name: Select active identity and private declaration inputs
  ansible.builtin.set_fact:
    harbor_identity_values: '{{ harbor_interfaces.results[0].resources[0].spec.source.helm.valuesObject }}'
    harbor_gateway: '{{ harbor_interfaces.results[1].resources[0].spec.clusterIP }}'
    harbor_private_identity: '{{ harbor_interfaces.results[2].resources[0].data.desired_state | from_json }}'
    harbor_revocations: '{{ harbor_interfaces.results[2].resources[0].data.revocations | from_json }}'
  no_log: true

- name: Require active canonical identity before deriving any installation values
  ansible.builtin.assert:
    that:
      - harbor_identity_values.loginHost is match('^login[.][a-z0-9.-]+$')
      - not harbor_identity_values.maintenance | default(false)
      - harbor_identity_values.reconciliationEnabled | default(false)
      - harbor_gateway is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: Harbor requires its active retained identity and private gateway interface.
    quiet: true
  no_log: true

- name: Derive the private Harbor origin from the retained issuer
  ansible.builtin.set_fact:
    harbor_login_host: '{{ harbor_identity_values.loginHost }}'
    harbor_host: 'harbor.internal.{{ harbor_identity_values.loginHost[6:] }}'
  no_log: true

- name: Describe only the approved Harbor identity client
  ansible.builtin.set_fact:
    harbor_identity_client:
      id: harbor
      audience: harbor
      public: false
      callbacks: ['https://{{ harbor_host }}/c/oidc/callback', 'https://{{ harbor_host }}/oauth2/callback']
      scopes: [profile, email]
  no_log: true

- name: Require the exact active client from the existing identity owner
  ansible.builtin.assert:
    that:
      - >-
        harbor_private_identity.realms.platform.clients | selectattr('id', 'equalto', 'harbor')
        | list == [harbor_identity_client]
      - "'harbor' not in (harbor_revocations.realms.platform.clients | default([]))"
      - "'harbor' not in (harbor_revocations.realms.platform.removed_clients | default([]))"
    fail_msg: Harbor requires its exact active client from the retained Keycloak owner.
    quiet: true
  no_log: true

- name: Inspect installation boundaries without adopting foreign resources
  kubernetes.core.k8s_info:
    api_version: '{{ item.api_version }}'
    kind: '{{ item.kind }}'
    name: '{{ harbor_policy.namespace }}'
  loop:
    - {api_version: v1, kind: Namespace}
    - {api_version: storage.k8s.io/v1, kind: StorageClass}
  register: harbor_boundaries
  no_log: true

- name: Require retained boundary ownership
  ansible.builtin.assert:
    that:
      - >-
        item.resources | length == 0 or
        item.resources[0].metadata.labels['cloudlab.io/owner'] | default('') == harbor_policy.owner
    fail_msg: Existing Harbor boundary has another owner; adoption refused.
    quiet: true
  loop: '{{ harbor_boundaries.results }}'
  no_log: true
