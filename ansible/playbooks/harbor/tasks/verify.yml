---
- name: Resolve the published Harbor verification inputs
  ansible.builtin.command: python -m playbooks.harbor.files.payload
  args: {chdir: /workspace}
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: harbor_verification_payload

- name: Verify private Harbor installation and current coordinated local restore
  ansible.builtin.command: python3 /opt/cloudlab/playbooks/harbor/files/verify.py
  args: {stdin: '{{ harbor_verification_payload.stdout }}'}
  changed_when: false
  no_log: true
  register: harbor_verified

- name: Report sanitized Harbor installation evidence
  ansible.builtin.debug:
    msg: '{{ harbor_verified.stdout | from_json }}'
