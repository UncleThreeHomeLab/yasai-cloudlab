---
- name: Resolve the published Harbor source without rendering resources
  ansible.builtin.import_tasks: /workspace/ansible/playbooks/argocd/tasks/source.yml

- name: Converge native Harbor Applications under the existing recovery lock
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --nonblock
      - /run/lock/cloudlab-harbor.lock
      - /usr/bin/ansible-playbook
      - -i
      - localhost,
      - /opt/cloudlab/playbooks/harbor/native.yml
  environment:
    ANSIBLE_CONFIG: '{{ host_ansible_config }}'
    ANSIBLE_COLLECTIONS_PATH: '{{ host_ansible_collections }}'
    ANSIBLE_NOCOLOR: '1'
    HARBOR_SOURCE_REPOSITORY: '{{ gitops_source.repository }}'
    HARBOR_SOURCE_REVISION: '{{ gitops_source.revision }}'
  register: harbor_native_applied
  changed_when: harbor_native_applied.stdout is search('changed=[1-9][0-9]*')
  no_log: true

- name: Inspect the superseded Harbor installation writer after native convergence
  ansible.builtin.stat:
    path: /opt/cloudlab/playbooks/harbor/files/bootstrap.py
    follow: false
    checksum_algorithm: sha256
  register: harbor_old_writer

- name: Require the recognized non-data writer before retirement
  ansible.builtin.assert:
    that:
      - harbor_old_writer.stat.isreg | default(false)
      - not harbor_old_writer.stat.islnk | default(false)
      - harbor_old_writer.stat.uid == 0
      - harbor_old_writer.stat.mode == '0600'
      - harbor_old_writer.stat.checksum == harbor_bootstrap_retired_sha256
    fail_msg: Superseded Harbor executable differs from its reviewed bytes; preserve it for inspection.
    quiet: true
  when: harbor_old_writer.stat.exists

- name: Retire the recognized installation writer after native convergence
  ansible.builtin.file:
    path: /opt/cloudlab/playbooks/harbor/files/bootstrap.py
    state: absent
  when: harbor_old_writer.stat.exists
