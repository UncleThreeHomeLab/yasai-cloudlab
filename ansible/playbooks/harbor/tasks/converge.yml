---
- name: Observe or explicitly register the native Harbor installation owner
  ansible.builtin.command: python3 /opt/cloudlab/playbooks/harbor/files/native.py
  args:
    stdin: '{{ {"native_handoff": harbor_native_handoff | default(false) | bool, "native_initial": harbor_native_initial | default(false) | bool} | to_json }}'
  register: harbor_applied
  changed_when: harbor_applied.rc == 0 and (harbor_applied.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require the accepted native Harbor installation
  ansible.builtin.assert:
    that: harbor_applied.rc == 0
    fail_msg: Harbor native ownership incomplete; existing credentials, volumes and owners retained.
