---
- name: Select the focused Harbor Application declaration
  ansible.builtin.set_fact:
    harbor_application_name: "{{ 'cloudlab-harbor-configuration' if harbor_configuring_boundaries else 'cloudlab-harbor' }}"
    harbor_application_path: "{{ 'platform/harbor' if harbor_configuring_boundaries else 'platform/harbor/server' }}"

- name: Inspect the existing Harbor Application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: '{{ harbor_application_name }}'
  register: harbor_existing_application
  no_log: true

- name: Select the existing Application identity
  ansible.builtin.set_fact:
    harbor_current: '{{ harbor_existing_application.resources | first | default({}) }}'
  no_log: true

- name: Check retained ownership before any Application write
  ansible.builtin.import_tasks: native-owner-check.yml
  no_log: true

- name: Apply only the scoped Harbor Application with its retained field manager
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: '{{ harbor_policy.owner }}'
      force_conflicts: false
    definition: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/application.yml.j2') | from_yaml }}"
  no_log: true

- name: Wait for the exact declared Harbor source without competing with Argo
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: '{{ harbor_application_name }}'
  register: harbor_application_ready
  until:
    - harbor_application_ready.resources | length == 1
    - harbor_application_ready.resources[0].status.sync.status | default('') == 'Synced'
    - harbor_application_ready.resources[0].status.sync.revision | default('') == harbor_native_source.revision
    - harbor_application_ready.resources[0].status.operationState.phase | default('') == 'Succeeded'
    - not harbor_application_ready.resources[0].operation | default({})
    - >-
      harbor_application_ready.resources[0].status.conditions | default([])
      | selectattr('type', 'search', 'Error$') | list | length == 0
    - >-
      harbor_application_ready.resources[0].status.sync.comparedTo.source ==
      harbor_application_ready.resources[0].spec.source
    - harbor_configuring_boundaries or harbor_application_ready.resources[0].status.health.status | default('') == 'Healthy'
    - not harbor_current or harbor_application_ready.resources[0].metadata.uid == harbor_current.metadata.uid
  retries: 180
  delay: 5
  no_log: true
