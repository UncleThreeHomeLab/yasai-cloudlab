---
- name: Verify Harbor behavior
  hosts: k3s_servers
  tags: [harbor]
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify Harbor behavior
      ansible.builtin.import_tasks: tasks/verify.yml
      when: harbor_enabled | bool

- name: Verify Harbor from both node host networks
  hosts: k3s_cluster
  tags: [harbor]
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check native host DNS, TLS and registry authentication
      ansible.builtin.import_tasks: tasks/host-verify.yml
      when: harbor_enabled | bool
