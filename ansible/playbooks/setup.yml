---
- name: Run host/010-bootstrap.yml
  ansible.builtin.import_playbook: host/010-bootstrap.yml
- name: Run network/010-firewall.yml
  ansible.builtin.import_playbook: network/010-firewall.yml
- name: Run network/020-wireguard.yml
  ansible.builtin.import_playbook: network/020-wireguard.yml
- name: Run tailscale/010-enroll.yml
  ansible.builtin.import_playbook: tailscale/010-enroll.yml
- name: Run k3s/010-server.yml
  ansible.builtin.import_playbook: k3s/010-server.yml
- name: Run k3s/020-agent.yml
  ansible.builtin.import_playbook: k3s/020-agent.yml
- name: Run longhorn/010-host-storage.yml
  ansible.builtin.import_playbook: longhorn/010-host-storage.yml
- name: Run secrets/010-bootstrap.yml
  ansible.builtin.import_playbook: secrets/010-bootstrap.yml
- name: Run longhorn/020-bootstrap.yml
  ansible.builtin.import_playbook: longhorn/020-bootstrap.yml
- name: Run longhorn/030-backup-configuration.yml
  ansible.builtin.import_playbook: longhorn/030-backup-configuration.yml
  when: longhorn_backup_enabled | bool
- name: Run backup/010-bootstrap.yml
  ansible.builtin.import_playbook: backup/010-bootstrap.yml
- name: Run argocd/010-bootstrap.yml
  ansible.builtin.import_playbook: argocd/010-bootstrap.yml
- name: Run argocd/020-private-sources.yml
  ansible.builtin.import_playbook: argocd/020-private-sources.yml
- name: Run longhorn/040-argo-handoff.yml
  ansible.builtin.import_playbook: longhorn/040-argo-handoff.yml
- name: Run certificates/010-bootstrap.yml
  ansible.builtin.import_playbook: certificates/010-bootstrap.yml
- name: Run istio/010-bootstrap.yml
  ansible.builtin.import_playbook: istio/010-bootstrap.yml
- name: Run access/010-bootstrap.yml
  ansible.builtin.import_playbook: access/010-bootstrap.yml
- name: Configure independent private resolvers
  ansible.builtin.import_playbook: access/020-private-dns.yml
- name: Run data/010-bootstrap.yml
  ansible.builtin.import_playbook: data/010-bootstrap.yml
- name: Reconcile application data before identity
  ansible.builtin.import_playbook: data/020-reconcile.yml
- name: Reconcile accepted scoped identity
  ansible.builtin.import_playbook: keycloak/050-retained.yml
- name: Run ../apply.yml
  ansible.builtin.import_playbook: ../apply.yml
- name: Retire replaced runtime after every consumer converges
  ansible.builtin.import_playbook: data/030-retire-runtime.yml
- name: Retire replaced identity runtime after consumers converge
  ansible.builtin.import_playbook: keycloak/060-retire-runtime.yml
