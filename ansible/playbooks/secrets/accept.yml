---
- name: Prove ESO drift repair and accept Argo ownership
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Accept ESO ownership after Argo convergence
      when: external_secrets_gitops_enabled | bool
      block:
        - name: Install the bounded ESO transition and drift proof
          ansible.builtin.copy:
            src: '/workspace/ansible/playbooks/secrets/files/{{ item }}'
            dest: '/var/lib/cloudlab/external-secrets/{{ item }}'
            mode: '0640'
          loop: [bootstrap.py, verify.py]

        - name: Prove Argo repairs ESO operator drift without a workload rollout
          ansible.builtin.command:
            argv: [python3, /var/lib/cloudlab/external-secrets/verify.py, '{{ external_secrets_store }}', drift-only]
          changed_when: true
          no_log: true

        - name: Render ESO ownership verification inputs
          ansible.builtin.command:
            argv: [python, /workspace/ansible/playbooks/secrets/files/chart.py]
          delegate_to: localhost
          become: false
          register: external_secrets_acceptance_payload
          changed_when: false
          no_log: true

        - name: Verify preserved identities and accept the ESO Argo owner
          ansible.builtin.command:
            argv: [python3, /var/lib/cloudlab/external-secrets/bootstrap.py, accept]
            stdin: '{{ external_secrets_acceptance_payload.stdout }}'
          register: external_secrets_acceptance
          changed_when: external_secrets_acceptance.rc == 0 and (external_secrets_acceptance.stdout | from_json).changed
          until: external_secrets_acceptance.rc != 2
          retries: 40
          delay: 5
          failed_when: false
          no_log: true

        - name: Require ESO identity and ownership acceptance without retrying permanent failures
          ansible.builtin.assert:
            that: external_secrets_acceptance.rc == 0
            fail_msg: '{{ external_secrets_acceptance.stderr }}'
            success_msg: ESO operator/store identities and existing generated credentials survived Argo adoption.
