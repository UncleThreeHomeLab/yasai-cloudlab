---
- name: Verify External Secrets controllers
  ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status deployment -n external-secrets --timeout=300s
  changed_when: false

- name: Observe the CloudLab store and configured credential delivery
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -IB
      - -c
      - "{{ lookup('file', '/workspace/ansible/playbooks/secrets/files/verify_delivery.py', rstrip=false) }}"
    expand_argument_vars: false
    stdin: >-
      {{ {'store': external_secrets_store, 'vault': external_secrets_vault,
          'certificates': certificates_enabled | bool, 'backup': longhorn_backup_enabled | bool,
          'backup_policy': longhorn_backup_policy} | to_json }}
  register: external_secrets_proof
  changed_when: false
  no_log: true
  failed_when: false

- name: Require External Secrets delivery observations to pass
  ansible.builtin.assert:
    that: external_secrets_proof.rc == 0
    fail_msg: External Secrets verification failed. Check store readiness and recent successful production credential syncs.
    success_msg: "{{ external_secrets_proof.stdout }}"
