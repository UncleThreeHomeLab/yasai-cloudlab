---
- name: Bootstrap 1Password authentication
  block:
    - name: Create a private temporary credential manifest
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: cloudlab-onepassword-
      register: external_secrets_temp
      changed_when: false

    - name: Render the bootstrap credential
      ansible.builtin.copy:
        content: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'onepassword-token', 'namespace': 'external-secrets',
                           'labels': {'cloudlab.io/owner': 'ansible-bootstrap'}},
              'type': 'Opaque', 'data': {'token': external_secrets_token | b64encode}} | to_json }}
        dest: "{{ external_secrets_temp.path }}"
        mode: '0600'
      no_log: true
      changed_when: false

    - name: Compare the bootstrap credential privately
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, diff, '--server-side=true', '--field-manager=cloudlab', '-f', '{{ external_secrets_temp.path }}']
      register: external_secrets_token_diff
      until: external_secrets_token_diff.rc in [0, 1]
      retries: 6
      delay: 5
      changed_when: false
      failed_when: external_secrets_token_diff.rc not in [0, 1]
      no_log: true

    - name: Apply only changed bootstrap credential fields
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, apply, '--server-side=true', '--field-manager=cloudlab', '-f', '{{ external_secrets_temp.path }}']
      when: external_secrets_token_diff.rc == 1
      changed_when: true
      no_log: true
  always:
    - name: Remove the private temporary credential manifest
      ansible.builtin.file:
        path: "{{ external_secrets_temp.path }}"
        state: absent
      when: external_secrets_temp.path is defined
      changed_when: false
