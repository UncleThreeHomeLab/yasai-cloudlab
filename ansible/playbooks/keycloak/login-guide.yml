---
- name: Identity login guide
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run the scoped login guide operation
      ansible.builtin.command:
        argv:
          - python
          - -m
          - playbooks.keycloak.files.credentials
          - --login-guide
        chdir: /workspace
      register: keycloak_operation
      no_log: true
      changed_when: true
    - name: Report the redacted operation result
      ansible.builtin.debug:
        msg: '{{ keycloak_operation.stdout | from_json }}'
