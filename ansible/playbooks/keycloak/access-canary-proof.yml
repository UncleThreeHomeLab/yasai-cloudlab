---
- name: Identity access canary proof
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run the scoped access canary proof operation
      ansible.builtin.command:
        argv:
          - python
          - -m
          - playbooks.keycloak.files.access_canary
          - proof
        chdir: /workspace
        stdin: '{{ lookup(''ansible.builtin.file'', lookup(''env'', ''LAB_IDENTITY_REQUEST''), rstrip=False) }}'
      register: keycloak_operation
      no_log: true
      changed_when: true
    - name: Report the redacted operation result
      ansible.builtin.debug:
        msg: '{{ keycloak_operation.stdout | from_json }}'
