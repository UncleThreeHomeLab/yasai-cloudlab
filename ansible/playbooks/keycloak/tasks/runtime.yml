---
- name: Install the shared pending Root validator and recovery closure from its owner
  ansible.builtin.import_tasks: /workspace/ansible/playbooks/argocd/tasks/runtime.yml
- name: Install identity protocol and recovery parsers
  ansible.builtin.apt:
    name:
      - python3-yaml
      - python3-cryptography
    state: present
- name: Create private identity automation directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0700'
  loop:
    - /opt/cloudlab/playbooks/keycloak/files
    - /opt/cloudlab/playbooks/argocd/files
    - /opt/cloudlab/playbooks/access/files
    - /opt/cloudlab/playbooks/istio/files
    - /opt/cloudlab/playbooks/data/files
    - /var/lib/cloudlab/identity
- name: Install the independent public DNS probe from its connectivity owner
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/access/files/dns_wire.py
    dest: /opt/cloudlab/playbooks/access/files/dns_wire.py
    mode: '0600'
- name: Install the shared private Git credential template from its owner
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/argocd/files/private_sources.py
    dest: /opt/cloudlab/playbooks/argocd/files/private_sources.py
    mode: '0600'
- name: Install the data prerequisite observer and its local runtime closure
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/data/files/{{ item }}'
    dest: '/opt/cloudlab/playbooks/data/files/{{ item }}'
    mode: '0600'
  loop: [handoff.py, native.py, control.py, s3.py, requests.py, volumes.py]
- name: Install identity runtime from its owning module
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/keycloak/files/{{ item }}
    dest: /opt/cloudlab/playbooks/keycloak/files/{{ item }}
    mode: '0600'
  loop:
    - bootstrap.py
    - ownership.py
    - configuration.py
    - maintenance.py
    - recovery.py
    - rotation.py
    - lifecycle.py
    - lease.py
    - argo.py
    - health.py
    - integrations.py
    - access_provider.py
    - access_cutover.py
    - access_canary.py
    - verify.py
    - emergency.py
    - session_fixture.py
    - owner_enrollment.py
- name: Install the access prerequisite observer from its owner
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/access/files/native.py
    dest: /opt/cloudlab/playbooks/access/files/native.py
    mode: '0600'
- name: Install the shared access authority and source convergence parsers
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/argocd/files/{{ item }}'
    dest: '/opt/cloudlab/playbooks/argocd/files/{{ item }}'
    mode: '0600'
  loop: [access_activation.py, source_revision.py, data_activation.py, source_snapshot.py, github_setup.py, github_app.py]
- name: Install the Kubernetes reader used by access prerequisites
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/istio/files/kube.py
    dest: /opt/cloudlab/playbooks/istio/files/kube.py
    mode: '0600'
