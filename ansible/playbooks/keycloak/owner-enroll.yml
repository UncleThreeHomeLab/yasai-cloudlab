---
- name: Identity owner enroll
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run the scoped owner enroll operation
      ansible.builtin.command:
        argv:
          - python
          - -m
          - playbooks.keycloak.files.owner_enrollment
          - local
        chdir: /workspace
      register: keycloak_operation
      no_log: true
      changed_when: true
    - name: Report the redacted operation result
      ansible.builtin.debug:
        msg: '{{ keycloak_operation.stdout | from_json }}'
