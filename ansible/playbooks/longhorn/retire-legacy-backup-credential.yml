---
- name: Retire the legacy backup credential after ESO verification
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars.yml]
  tasks:
    - name: Retire the legacy bootstrap credential after ESO verification
      when: longhorn_backup_enabled | bool
      block:
        - name: Require the ESO credential before retiring the legacy secret
          ansible.builtin.import_tasks: tasks/backup-credential.yml

        - name: Inspect the legacy bootstrap credential
          ansible.builtin.command: /usr/local/bin/k3s kubectl get secret cloudlab-backup -n longhorn-system --ignore-not-found -o name
          register: longhorn_backup_legacy
          changed_when: false

        - name: Remove the legacy credential only after backup restore and ESO verification
          ansible.builtin.command: /usr/local/bin/k3s kubectl delete secret cloudlab-backup -n longhorn-system
          when: longhorn_backup_legacy.stdout | length > 0
          changed_when: true
