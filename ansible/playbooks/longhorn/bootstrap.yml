---
- name: Read both node identities for the attached storage fixture
  hosts: k3s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Derive the node identity
      ansible.builtin.import_tasks: "/workspace/ansible/playbooks/host/tasks/identity.yml"

- name: Seed replicated storage
  ansible.builtin.import_playbook: 020-bootstrap.yml
