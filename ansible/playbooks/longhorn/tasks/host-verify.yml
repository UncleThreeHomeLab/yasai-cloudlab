---
- name: Check persistent storage host prerequisites directly
  ansible.builtin.command: test -d /sys/module/iscsi_tcp -a -d /sys/module/dm_crypt
  changed_when: false

- name: Check the iSCSI daemon is active on each node
  ansible.builtin.service_facts:

- name: Require the iSCSI daemon active on each node
  ansible.builtin.assert:
    that: ansible_facts.services['iscsid.service'].state == 'running'
