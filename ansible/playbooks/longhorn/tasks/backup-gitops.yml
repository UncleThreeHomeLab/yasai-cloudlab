---
- name: Require embedded Helm parity before configuring the backup writer
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/longhorn/files/backup_embedded_parity.py]
  delegate_to: localhost
  become: false
  changed_when: false

- name: Read vault-derived backup inputs without changing their owner
  ansible.builtin.import_tasks: backup-read.yml

- name: Render the private Application inputs from the public chart
  ansible.builtin.import_tasks: backup-render.yml

- name: Reconcile only the bootstrap-owned backup Application
  ansible.builtin.include_tasks: backup-action.yml
  vars:
    longhorn_backup_action: configure
