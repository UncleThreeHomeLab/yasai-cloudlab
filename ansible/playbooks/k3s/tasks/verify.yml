---
- name: Read the managed node configuration
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/config.yaml
  register: verified_node_config
  no_log: true

- name: Check the exact reviewed workload sysctl allowlist
  ansible.builtin.assert:
    that:
      - k3s_allowed_unsafe_sysctls | default([]) in [[], ['net.ipv6.conf.all.disable_ipv6']]
      - >-
        ((verified_node_config.content | b64decode | from_yaml).get('kubelet-arg', []) |
        select('match', '^allowed-unsafe-sysctls(?:=|$)') | list) ==
        (['allowed-unsafe-sysctls=net.ipv6.conf.all.disable_ipv6']
         if k3s_allowed_unsafe_sysctls | default([]) | length > 0 else [])
    fail_msg: The installed kubelet workload sysctl allowlist differs from its reviewed declaration.

- name: Check k3s is active
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ k3s_service_name }}"]
  changed_when: false

- name: Check k3s is enabled at boot
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ k3s_service_name }}"]
  changed_when: false

- name: Check the pinned release on every node
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: verified_version
  changed_when: false
  failed_when: "('k3s version ' ~ k3s_version ~ ' ') not in verified_version.stdout"

- name: Read the installed binary checksum
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
    checksum_algorithm: sha256
  register: verified_binary

- name: Check K3s matches the committed release artifact
  ansible.builtin.assert:
    that:
      - verified_binary.stat.checksum == k3s_binaries[ansible_facts['architecture']].sha256

- name: Check Flannel carries its overlay over the WireGuard address
  ansible.builtin.command: ip -j -d link show flannel.1
  register: verified_flannel
  changed_when: false
  until: >-
    verified_flannel.rc == 0 and
    (verified_flannel.stdout | from_json)[0].linkinfo.info_data.local == wireguard_address
  retries: 20
  delay: 5
