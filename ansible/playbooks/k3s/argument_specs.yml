---
argument_specs:
  main:
    short_description: Install and configure a K3s server or agent.
    options:
      k3s_mode:
        type: str
        required: true
        choices: [server, agent]
      k3s_allowed_unsafe_sysctls:
        type: list
        elements: str
        default: []
        choices: [net.ipv6.conf.all.disable_ipv6]
      k3s_service_name:
        type: str
        required: true
      k3s_version:
        type: str
        required: true
      k3s_binaries:
        type: dict
        required: true
      lab_node_name:
        type: str
        required: true
      wireguard_address:
        type: str
        required: true
      wireguard_interface:
        type: str
        required: true
