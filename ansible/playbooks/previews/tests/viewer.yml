---
- name: Run one bounded preview viewer operation through its installed owner
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate the private fixture dispatch before host changes
      ansible.builtin.assert:
        that:
          - preview_viewer.nonce is match('^[a-f0-9]{32}$')
          - preview_viewer.realm == 'applications'
          - preview_viewer.action in ['baseline', 'stage', 'enroll', 'observe', 'wait', 'offboard', 'lifecycle']
      vars:
        preview_viewer: "{{ lookup('env', 'CLOUDLAB_PREVIEW_VIEWER_REQUEST') | from_json }}"
      no_log: true
    - name: Create the explicit preview fixture operation directory
      ansible.builtin.file:
        path: /opt/cloudlab/playbooks/previews/tests
        state: directory
        mode: '0700'
      no_log: true
    - name: Create the preview contract owner directory before preactivation
      ansible.builtin.file:
        path: /opt/cloudlab/playbooks/previews/files
        state: directory
        mode: '0700'
      no_log: true
    - name: Install the published preview contract required by baseline observation
      ansible.builtin.copy:
        src: /workspace/ansible/playbooks/previews/files/contract.py
        dest: /opt/cloudlab/playbooks/previews/files/contract.py
        mode: '0600'
      no_log: true
    - name: Install the source-owned viewer dispatcher
      ansible.builtin.copy:
        src: /workspace/ansible/playbooks/previews/tests/viewer_runtime.py
        dest: /opt/cloudlab/playbooks/previews/tests/viewer_runtime.py
        mode: '0600'
      no_log: true
    - name: Install the read-only lifecycle observer
      ansible.builtin.copy:
        src: /workspace/ansible/playbooks/previews/tests/evidence_runtime.py
        dest: /opt/cloudlab/playbooks/previews/tests/evidence_runtime.py
        mode: '0600'
      no_log: true
    - name: Create canonical read-only observer directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - /opt/cloudlab/playbooks/keycloak/files
        - /opt/cloudlab/playbooks/istio/files
        - /opt/cloudlab/playbooks/argocd/files
      no_log: true
    - name: Install canonical preview observation inputs
      ansible.builtin.copy:
        src: '/workspace/ansible/playbooks/previews/files/{{ item }}'
        dest: '/opt/cloudlab/playbooks/previews/files/{{ item }}'
        mode: '0600'
      loop: [kube.py, lifecycle.py, resources.py, images.lock.json, sigstore-fulcio.crt]
      no_log: true
    - name: Install canonical identity and Kubernetes observation inputs
      ansible.builtin.copy:
        src: '/workspace/ansible/playbooks/{{ item }}'
        dest: '/opt/cloudlab/playbooks/{{ item }}'
        mode: '0600'
      loop: [keycloak/files/preview_clients.py, keycloak/files/configuration.py, istio/files/kube.py, argocd/files/source_revision.py]
      no_log: true
    - name: Invoke only remote identity owner primitives
      ansible.builtin.command: python3 /opt/cloudlab/playbooks/previews/tests/viewer_runtime.py
      args:
        stdin: "{{ lookup('env', 'CLOUDLAB_PREVIEW_VIEWER_REQUEST') }}"
      register: preview_viewer_result
      changed_when: (lookup('env', 'CLOUDLAB_PREVIEW_VIEWER_REQUEST') | from_json).action in ['stage', 'enroll', 'offboard']
      no_log: true
    - name: Retain the bounded private observation in the fixture recovery volume
      ansible.builtin.copy:
        content: '{{ preview_viewer_result.stdout }}'
        dest: "/recovery/previews/{{ (lookup('env', 'CLOUDLAB_PREVIEW_VIEWER_REQUEST') | from_json).nonce }}/viewer-result.json"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
