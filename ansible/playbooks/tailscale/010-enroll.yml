---
- name: Preserve independent host access
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "/workspace/ansible/playbooks/tailscale/vars.yml"
  tasks:
    - name: Converge host enrollment
      ansible.builtin.import_tasks: tasks/main.yml
      when: tailscale_enabled | bool
  handlers:
    - name: Load component service handlers
      ansible.builtin.import_tasks: handlers/main.yml
