---
- name: Request a scoped one-use host enrollment key in the runner
  delegate_to: localhost
  become: false
  no_log: true
  block:
    - name: Read only the host enrollment credential through the pinned vault CLI
      ansible.builtin.command:
        argv: [op, item, get, tailscale-host-enrollment, --vault, CloudLab, --format, json]
      register: tailscale_enrollment_item
      changed_when: false

    - name: Require unique nonempty OAuth fields before any API request
      ansible.builtin.assert:
        that:
          - >-
            (tailscale_enrollment_item.stdout | from_json).fields
            | selectattr('label', 'equalto', item) | list | length == 1
          - >-
            ((tailscale_enrollment_item.stdout | from_json).fields
            | selectattr('label', 'equalto', item) | first).value | default('') | length > 0
        quiet: true
      loop: [CLIENT_ID, CLIENT_SECRET]

    - name: Exchange host enrollment credentials for a short-lived token
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/oauth/token
        method: POST
        body_format: form-urlencoded
        body:
          client_id: >-
            {{ ((tailscale_enrollment_item.stdout | from_json).fields
               | selectattr('label', 'equalto', 'CLIENT_ID') | first).value }}
          client_secret: >-
            {{ ((tailscale_enrollment_item.stdout | from_json).fields
               | selectattr('label', 'equalto', 'CLIENT_SECRET') | first).value }}
          grant_type: client_credentials
        follow_redirects: none
        use_netrc: false
        validate_certs: true
        timeout: 30
        status_code: 200
      register: tailscale_enrollment_token
      changed_when: false

    - name: Require the OAuth exchange to return a usable token
      ansible.builtin.assert:
        that:
          - tailscale_enrollment_token.json.access_token is string
          - tailscale_enrollment_token.json.access_token | length > 0
        quiet: true

    - name: Create a five-minute non-ephemeral host key without retrying the mutation
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/tailnet/-/keys
        method: POST
        headers:
          Authorization: 'Bearer {{ tailscale_enrollment_token.json.access_token }}'
          Accept: application/json
        body_format: json
        body:
          capabilities:
            devices:
              create:
                reusable: false
                ephemeral: false
                preauthorized: true
                tags: [tag:cloudlab-host]
          expirySeconds: 300
          description: cloudlab host enrollment
        follow_redirects: none
        unredirected_headers: [Authorization]
        use_netrc: false
        validate_certs: true
        timeout: 30
        status_code: 200
      register: tailscale_enrollment_key
      changed_when: true

    - name: Require a usable one-use enrollment key
      ansible.builtin.assert:
        that:
          - tailscale_enrollment_key.json.key is string
          - tailscale_enrollment_key.json.key | length > 0
        quiet: true
