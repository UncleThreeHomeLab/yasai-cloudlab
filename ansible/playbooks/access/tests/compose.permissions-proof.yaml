# Disposable test cluster only. Never combine this file with the lab Compose file.
# Use a unique project: docker compose -p permissions-proof-<run> -f <this-file> up --build --abort-on-container-exit --exit-code-from proof
# After inspecting the exact project: docker compose -p permissions-proof-<run> -f <this-file> down --volumes
# Inspect project/purpose labels before cleanup. Existing receipts block a new run;
# interrupted runs require exact-project cleanup, not automatic grant resumption.
services:
  cluster:
    image: rancher/k3s:v1.36.5-k3s1@sha256:057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
    privileged: true
    command: [server, '--disable=traefik,servicelb,local-storage,metrics-server', --tls-san=cluster,
              --write-kubeconfig=/fixture/kubeconfig, --write-kubeconfig-mode=600]
    tmpfs: [/run, /var/lib/rancher/k3s]
    volumes: [credentials:/fixture]
    networks:
      fixture: {ipv4_address: 10.245.233.2}
    labels: {cloudlab.io/purpose: permissions-controller-proof}
  proof:
    build:
      context: ../../../runner
      additional_contexts:
        ci-source: ../../../../platform/delivery/ci
    entrypoint: [python, /inputs/permissions_proof.py]
    working_dir: /tmp
    environment:
      FIXTURE_PROJECT: ${COMPOSE_PROJECT_NAME:?Use a unique permissions-proof-<run> project}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./permissions_proof.py:/inputs/permissions_proof.py:ro
      - ./test_permissions_proof.py:/inputs/test_permissions_proof.py:ro
      - ../../../../platform/connectivity/permissions/Chart.yaml:/inputs/catalog/Chart.yaml:ro
      - ../../../../platform/connectivity/permissions/values.yaml:/inputs/catalog/values.yaml:ro
      - ../../../../platform/connectivity/permissions/values.schema.json:/inputs/catalog/values.schema.json:ro
      - ../../../../platform/connectivity/permissions/profiles.yaml:/inputs/catalog/profiles.yaml:ro
      - ../../../../platform/connectivity/permissions/templates/rbac.yaml:/inputs/catalog/templates/rbac.yaml:ro
      - ../../../../platform/delivery/admission/policies/templates/permissions.yaml:/inputs/guard.yaml:ro
      - ../../admission/files/verify.py:/inputs/playbooks/admission/files/verify.py:ro
      - ../../istio/files/kube.py:/inputs/playbooks/istio/files/kube.py:ro
      - ../../argocd/files/source_revision.py:/inputs/playbooks/argocd/files/source_revision.py:ro
      - ../../argocd/tests/fixtures.py:/inputs/playbooks/argocd/tests/fixtures.py:ro
      - ../../../../platform/delivery/argocd/charts/argo-cd-10.9.6.tgz:/inputs/argo-cd-10.9.6.tgz:ro
      - ../../../../platform/delivery/argocd/artifact.lock.json:/inputs/artifact.lock.json:ro
      - ../../../../platform/delivery/argocd/values.yaml:/inputs/values.yaml:ro
      - credentials:/fixture:ro
      - receipts:/receipts
    depends_on: [cluster]
    networks:
      fixture: {ipv4_address: 10.245.233.3}
    labels: {cloudlab.io/purpose: permissions-controller-proof}
volumes:
  credentials:
    labels: {cloudlab.io/purpose: permissions-controller-proof}
  receipts:
    labels: {cloudlab.io/purpose: permissions-controller-proof}
networks:
  fixture:
    labels: {cloudlab.io/purpose: permissions-controller-proof}
    ipam:
      config: [{subnet: 10.245.233.0/24}]
