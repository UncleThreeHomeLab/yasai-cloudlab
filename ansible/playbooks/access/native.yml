---
- name: Converge native access under the retained ownership lock
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    access_native_source:
      repository: "{{ lookup('ansible.builtin.env', 'ACCESS_SOURCE_REPOSITORY') }}"
      branch: "{{ lookup('ansible.builtin.env', 'ACCESS_SOURCE_BRANCH') }}"
      revision: "{{ lookup('ansible.builtin.env', 'ACCESS_SOURCE_REVISION') }}"
    access_administrator: "{{ lookup('ansible.builtin.env', 'ACCESS_ADMINISTRATOR') }}"
    access_state_path: /var/lib/cloudlab/connectivity/ownership.json
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Validate retained access inputs and controller prerequisites
      ansible.builtin.import_tasks: tasks/native-prerequisites.yml
    - name: Load retained ownership and reject adoption
      ansible.builtin.import_tasks: tasks/native-ownership.yml
    - name: Declare the focused access Application
      ansible.builtin.import_tasks: tasks/native-application.yml
    - name: Preserve access object identities and durable completion
      ansible.builtin.import_tasks: tasks/native-identities.yml
