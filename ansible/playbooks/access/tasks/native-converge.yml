---
- name: Resolve the published access source without resource generation
  ansible.builtin.import_tasks: /workspace/ansible/playbooks/argocd/tasks/source.yml

- name: Converge the native access owner under its existing lock
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --nonblock
      - /var/lib/cloudlab/connectivity/ownership.lock
      - /usr/bin/ansible-playbook
      - -i
      - localhost,
      - /opt/cloudlab/playbooks/access/native.yml
  environment:
    ANSIBLE_CONFIG: '{{ host_ansible_config }}'
    ANSIBLE_COLLECTIONS_PATH: '{{ host_ansible_collections }}'
    ANSIBLE_NOCOLOR: '1'
    ACCESS_SOURCE_REPOSITORY: '{{ gitops_source.repository }}'
    ACCESS_SOURCE_BRANCH: '{{ gitops_source.branch }}'
    ACCESS_SOURCE_REVISION: '{{ gitops_source.revision }}'
    ACCESS_ADMINISTRATOR: "{{ lookup('ansible.builtin.env', 'TAILSCALE_ADMIN_LOGIN') }}"
  register: access_native_applied
  changed_when: access_native_applied.stdout is search('changed=[1-9][0-9]*')
  no_log: true

- name: Inspect the superseded access writer after native convergence
  ansible.builtin.stat:
    path: /var/lib/cloudlab/connectivity/configuration.py
    follow: false
    checksum_algorithm: sha256
  register: access_old_writer

- name: Require the recognized non-data writer before retirement
  ansible.builtin.assert:
    that:
      - access_old_writer.stat.isreg | default(false)
      - not access_old_writer.stat.islnk | default(false)
      - access_old_writer.stat.uid == 0
      - access_old_writer.stat.mode == '0600'
      - access_old_writer.stat.checksum == access_configuration_retired_sha256
    fail_msg: Superseded access executable differs from reviewed bytes; preserve it for inspection.
    quiet: true
  when: access_old_writer.stat.exists

- name: Retire the recognized access writer after native convergence
  ansible.builtin.file:
    path: /var/lib/cloudlab/connectivity/configuration.py
    state: absent
  when: access_old_writer.stat.exists
