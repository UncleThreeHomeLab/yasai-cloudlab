---
- name: Install the resumable legacy handoff implementation
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/legacy.py'
    dest: /var/lib/cloudlab/connectivity/legacy.py
    mode: '0600'

- name: Converge the retained Gateway API owner after legacy removal
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/access/files/cutover.py]
    stdin: "{{ (gitops_payload.stdout | from_json) | combine({'action': 'finish'}) | to_json }}"
  register: access_cutover_result
  delegate_to: localhost
  become: false
  changed_when: access_cutover_result.rc == 0 and (access_cutover_result.stdout | from_json).changed
  no_log: true

- name: Read the existing host identity for standalone repair
  ansible.builtin.setup:
    gather_subset: ['!all']
    filter: ansible_nodename
  when: lab_node_name is not defined

- name: Export the existing host identity through its owner
  ansible.builtin.import_tasks: "/workspace/ansible/playbooks/host/tasks/identity.yml"
  when: lab_node_name is not defined

- name: Disable unused ServiceLB only after its controller removes the legacy Service finalizer
  ansible.builtin.import_tasks: "/workspace/ansible/playbooks/k3s/tasks/configure.yml"

- name: Apply the final packaged controller configuration
  ansible.builtin.meta: flush_handlers

- name: Require the single server to return ready after ServiceLB retirement
  ansible.builtin.import_tasks: "/workspace/ansible/playbooks/k3s/tasks/ready.yml"

- name: Read the applied packaged controller configuration
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/config.yaml
  register: access_final_k3s_config
  no_log: true

- name: Accept the handoff only after both packaged controllers are disabled
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/access/files/cutover.py]
    stdin: >-
      {{ (gitops_payload.stdout | from_json) | combine({'action': 'accept',
         'disabled': (access_final_k3s_config.content | b64decode | from_yaml).disable}) | to_json }}
  register: access_cutover_result
  delegate_to: localhost
  become: false
  changed_when: access_cutover_result.rc == 0 and (access_cutover_result.stdout | from_json).changed
  no_log: true

- name: Report retained Gateway API handoff
  ansible.builtin.debug:
    msg: '{{ access_cutover_result.stdout | from_json }}'
