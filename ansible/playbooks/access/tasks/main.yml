---
- name: Validate and reconcile access grants without changing host SSH ownership
  ansible.builtin.command: python /workspace/ansible/playbooks/access/files/policy_apply.py
  delegate_to: localhost
  become: false
  register: access_policy_result
  changed_when: (access_policy_result.stdout | from_json).changed
  no_log: true

- name: Create the private access ownership directory
  ansible.builtin.file:
    path: /var/lib/cloudlab/connectivity
    state: directory
    mode: '0700'

- name: Install the native access Application owner
  ansible.builtin.import_tasks: native-runtime.yml

- name: Require native controller readiness
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, rollout, status, '{{ item.resource }}', -n, '{{ item.namespace }}', '--timeout=300s']
  loop:
    - {namespace: tailscale, resource: deployment/operator}
  changed_when: false
  no_log: true

- name: Reconcile native access after operator and credential readiness
  ansible.builtin.import_tasks: native-converge.yml

- name: Install private DNS input discovery
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/dns_inputs.py'
    dest: /var/lib/cloudlab/connectivity/dns_inputs.py
    mode: '0600'

- name: Read private DNS inputs through maintained Kubernetes modules
  ansible.builtin.import_tasks: dns-inputs.yml

- name: Install the disposable access fixture owner
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/cluster_fixture.py'
    dest: /var/lib/cloudlab/connectivity/cluster_fixture.py
    mode: '0600'

- name: Inspect whether legacy cutover already started
  ansible.builtin.stat:
    path: /var/lib/cloudlab/connectivity/cutover.json
  register: access_cutover_receipt

- name: Resume and verify an existing legacy handoff
  ansible.builtin.include_tasks: cutover.yml
  when: access_cutover_receipt.stat.exists

- name: Require native access workload readiness
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, rollout, status, '{{ item.resource }}', -n, '{{ item.namespace }}', '--timeout=300s']
  loop:
    - {namespace: tailscale, resource: statefulset/cloudlab-ingress}
    - {namespace: tailscale, resource: statefulset/cloudlab-api}
    - {namespace: cloudlab-connectors, resource: deployment/cloudflared}
  changed_when: false
  no_log: true
