---
- name: Validate and reconcile access grants without changing host SSH ownership
  ansible.builtin.command: python /workspace/ansible/playbooks/access/files/policy_apply.py
  delegate_to: localhost
  become: false
  register: access_policy_result
  changed_when: (access_policy_result.stdout | from_json).changed
  no_log: true

- name: Create the private access ownership directory
  ansible.builtin.file:
    path: /var/lib/cloudlab/connectivity
    state: directory
    mode: '0700'

- name: Install the bounded initial seed and read-only access observer
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/{{ item }}'
    dest: '/var/lib/cloudlab/connectivity/{{ item }}'
    mode: '0600'
  loop: [initial_bootstrap.py, native.py]
- name: Install the shared administrator guard from its owner
  ansible.builtin.copy:
    src: /workspace/ansible/playbooks/argocd/files/access_activation.py
    dest: /var/lib/cloudlab/connectivity/access_activation.py
    mode: '0600'
- name: Prepare authenticated native access observation inputs
  ansible.builtin.import_tasks: source.yml
  vars:
    access_public_payload: '{{ gitops_payload.stdout | from_json }}'

- name: Require native controller readiness
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, rollout, status, '{{ item.resource }}', -n, '{{ item.namespace }}', '--timeout=300s']
  loop:
    - {namespace: tailscale, resource: deployment/operator}
  changed_when: false
  no_log: true

- name: Reconcile access after operator and credential readiness
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/connectivity/initial_bootstrap.py]
    stdin: >-
      {{ access_runtime_payload | combine({'administrator': lookup('ansible.builtin.env', 'TAILSCALE_ADMIN_LOGIN')}) | to_json }}
  register: access_configured
  changed_when: access_configured.rc == 0 and (access_configured.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require access configuration to pass
  ansible.builtin.assert:
    that: access_configured.rc == 0
    fail_msg: Access configuration failed; private checkpoint retained.

- name: Report sanitized access configuration status
  ansible.builtin.debug:
    msg: '{{ access_configured.stdout | from_json }}'

- name: Install private DNS input discovery
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/dns_inputs.py'
    dest: /var/lib/cloudlab/connectivity/dns_inputs.py
    mode: '0600'

- name: Read private DNS inputs from ready cluster interfaces
  ansible.builtin.command: python3 /var/lib/cloudlab/connectivity/dns_inputs.py
  register: access_dns_inputs
  changed_when: false
  no_log: true

- name: Install the bounded cluster DNS Application owner
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/dns_application.py'
    dest: /var/lib/cloudlab/connectivity/dns_application.py
    mode: '0600'

- name: Install the disposable access fixture owner
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/access/files/cluster_fixture.py'
    dest: /var/lib/cloudlab/connectivity/cluster_fixture.py
    mode: '0600'

- name: Inspect whether legacy cutover already started
  ansible.builtin.stat:
    path: /var/lib/cloudlab/connectivity/cutover.json
  register: access_cutover_receipt

- name: Resume and verify an existing legacy handoff
  ansible.builtin.include_tasks: cutover.yml
  when: access_cutover_receipt.stat.exists

- name: Require native access workload readiness
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, rollout, status, '{{ item.resource }}', -n, '{{ item.namespace }}', '--timeout=300s']
  loop:
    - {namespace: tailscale, resource: statefulset/cloudlab-ingress}
    - {namespace: tailscale, resource: statefulset/cloudlab-api}
    - {namespace: cloudlab-connectors, resource: deployment/cloudflared}
  changed_when: false
  no_log: true
