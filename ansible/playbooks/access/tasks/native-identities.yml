---
- name: Require both retained ProxyGroups ready
  kubernetes.core.k8s_info:
    api_version: tailscale.com/v1alpha1
    kind: ProxyGroup
    name: '{{ item }}'
  loop: [cloudlab-ingress, cloudlab-api]
  register: access_native_proxy
  until:
    - access_native_proxy.resources | length == 1
    - >-
      access_native_proxy.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'ProxyGroupReady') | selectattr('status', 'equalto', 'True')
      | list | length == 1
    - >-
      access_native_proxy.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'ProxyGroupReady') | selectattr('status', 'equalto', 'True')
      | map(attribute='observedGeneration', default=access_native_proxy.resources[0].metadata.generation)
      | unique | list == [access_native_proxy.resources[0].metadata.generation]
  retries: 180
  delay: 5
  no_log: true

- name: Inspect only the retained access objects
  kubernetes.core.k8s_info:
    api_version: '{{ item.api_version }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.namespace | default(omit) }}'
    name: '{{ item.name }}'
  loop:
    - {key: proxygroup/cloudlab-ingress, api_version: tailscale.com/v1alpha1, kind: ProxyGroup, name: cloudlab-ingress}
    - {key: proxygroup/cloudlab-api, api_version: tailscale.com/v1alpha1, kind: ProxyGroup, name: cloudlab-api}
    - {key: service/cloudlab-tailnet, api_version: v1, kind: Service, namespace: cloudlab-gateway-private, name: cloudlab-tailnet}
    - {key: secret/operator-oauth, api_version: v1, kind: Secret, namespace: tailscale, name: operator-oauth}
    - {key: secret/cloudflared-runtime, api_version: v1, kind: Secret, namespace: cloudlab-connectors, name: cloudflared-runtime}
  register: access_native_objects
  no_log: true

- name: Require every retained object to exist exactly once
  ansible.builtin.assert:
    that: item.resources | length == 1
    quiet: true
  loop: '{{ access_native_objects.results }}'
  no_log: true

- name: Initialize the retained identity comparison
  ansible.builtin.set_fact:
    access_native_identities: {}
    access_native_record_completion: "{{ access_native_state.phase != 'configured' }}"
  no_log: true

- name: Select only public Kubernetes object identities
  ansible.builtin.set_fact:
    access_native_identities: '{{ access_native_identities | combine({item.item.key: item.resources[0].metadata.uid}) }}'
  loop: '{{ access_native_objects.results }}'
  no_log: true

- name: Refuse replaced retained access objects
  ansible.builtin.assert:
    that: access_native_state.identities | default(access_native_identities) == access_native_identities
    fail_msg: Retained access object identities changed; explicit recovery required.
    quiet: true
  no_log: true

- name: Record completed initial access configuration without changing retained state
  when: access_native_record_completion
  no_log: true
  block:
    - name: Select the completed retained access state
      ansible.builtin.set_fact:
        access_native_state: '{{ access_native_state | combine({"phase": "configured", "identities": access_native_identities}) }}'
    - name: Atomically record completed access configuration
      ansible.builtin.copy:
        dest: '{{ access_state_path }}'
        content: '{{ access_native_state | to_json(sort_keys=true) }}'
        owner: root
        group: root
        mode: '0600'
