---
- name: Configure the independent host DNS owner
  ansible.builtin.import_tasks: dns_host.yml

- name: Publish the private split DNS domain and scoped DNS grants
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/access/files/dns_tailnet.py]
    stdin: >-
      {{ (hostvars[groups['k3s_servers'][0]].access_dns_inputs.stdout | from_json)
         | combine({'nameservers': [hostvars['cloudlab'].access_dns_tailnet.stdout | trim,
                                   hostvars['cloudlab-worker'].access_dns_tailnet.stdout | trim]}) | to_json }}
  delegate_to: localhost
  become: false
  run_once: true
  register: access_split_dns
  changed_when: (access_split_dns.stdout | from_json).changed
  no_log: true

- name: Reconcile only custom cluster DNS forwarding after both host resolvers pass
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/connectivity/dns_application.py]
    stdin: '{{ hostvars[groups["k3s_servers"][0]].gitops_payload.stdout }}'
  delegate_to: '{{ groups["k3s_servers"][0] }}'
  run_once: true
  register: access_cluster_dns
  changed_when: access_cluster_dns.rc == 0 and (access_cluster_dns.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require the declared cluster DNS forwarding owner
  ansible.builtin.assert:
    that: access_cluster_dns.rc == 0
    fail_msg: Cluster DNS forwarding did not converge; existing cluster DNS retained.

- name: Reconcile Access protection before public tunnel routes and DNS
  ansible.builtin.command: python /workspace/ansible/playbooks/access/files/external.py
  delegate_to: localhost
  become: false
  run_once: true
  register: access_external_result
  changed_when: access_external_result.rc == 0 and (access_external_result.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require identity-preserving external convergence
  ansible.builtin.assert:
    that: access_external_result.rc == 0
    fail_msg: External access did not converge; retain credentials and the private ownership checkpoint.
