---
- name: Require the existing K3s custom forwarding interface
  ansible.builtin.assert:
    that: "'import /etc/coredns/custom/*.server' in access_dns_core.data.Corefile | default('')"
    fail_msg: Cluster DNS does not expose the expected custom forwarding interface.
    quiet: true

- name: Refuse adoption of another cluster DNS owner
  ansible.builtin.assert:
    that:
      - access_dns_application | length > 0 or access_dns_custom | length == 0
      - not access_dns_application or access_dns_application.metadata.labels['cloudlab.io/owner'] | default('') == 'cloudlab-private-dns-bootstrap'
      - not access_dns_application or not access_dns_application.metadata.finalizers | default([])
      - not access_dns_application or not access_dns_application.metadata.ownerReferences | default([])
    fail_msg: Private DNS Application ownership conflict; existing DNS retained.
    quiet: true

- name: Require retained DNS identities before any write
  ansible.builtin.assert:
    that:
      - access_dns_application.metadata.uid == access_dns_retained['application.argoproj.io']
      - access_dns_custom.metadata.uid == access_dns_retained.configmap
    fail_msg: Private DNS identities changed or disappeared; explicit recovery required.
    quiet: true
  when: access_dns_retained | length > 0
