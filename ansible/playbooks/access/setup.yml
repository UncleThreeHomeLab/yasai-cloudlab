---
- name: Reconcile the bounded access Application
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  handlers:
    - name: Load K3s service handler
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/k3s/handlers/main.yml
  pre_tasks:
    - name: Validate the published GitOps source
      ansible.builtin.command:
        argv: [python, /workspace/ansible/playbooks/argocd/files/render.py]
      delegate_to: localhost
      become: false
      register: gitops_payload
      changed_when: false
      no_log: true
  tasks:
    - name: Configure bounded access ownership
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/access/tasks/main.yml

- name: Configure independent private resolvers on both hosts
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    wireguard_peer_address: "{{ hostvars[wireguard_peer_host]['wireguard_address'] }}"
    wireguard_peer_endpoint: "{{ hostvars[wireguard_peer_host]['wireguard_public_endpoint'] }}"
  handlers:
    - name: Load host firewall handler
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/network/handlers/firewall-main.yml
  tasks:
    - name: Configure host firewall through its owner
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/network/tasks/firewall-main.yml
    - name: Configure private DNS
      ansible.builtin.import_tasks: /workspace/ansible/playbooks/access/tasks/dns.yml
