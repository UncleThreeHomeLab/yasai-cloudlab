---
- name: Attest accepted native access ownership before retiring the old writer
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refresh authenticated native access observation inputs
      ansible.builtin.import_tasks: tasks/source.yml
      vars:
        access_public_payload: '{{ gitops_payload.stdout | from_json }}'
    - name: Verify the handoff without replaying access configuration
      ansible.builtin.command:
        argv: [python3, /var/lib/cloudlab/connectivity/native.py]
        stdin: '{{ {"native": (access_native_payload.stdout | from_json).native, "public": access_runtime_payload} | to_json }}'
      register: access_native_handoff
      changed_when: false
      no_log: true
    - name: Keep the native handoff result for scoped runtime retirement
      ansible.builtin.set_fact:
        access_native_handoff_verified: '{{ access_native_handoff.rc == 0 and (access_native_payload.stdout | from_json).native is not none }}'
        access_runtime_retirement_deferred: '{{ (access_native_payload.stdout | from_json).native is none }}'

- name: Remove only obsolete access writer files on all managed nodes
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    access_runtime_directories: [/var/lib/cloudlab/connectivity, /opt/cloudlab/playbooks/access/files]
    access_retired_writer_sha256: b3df74907830ec9a625bcdd406d7f2e5b0b5e2985ba5dbc000c772a21aa833e2
  tasks:
    - name: Inspect exact runtime ancestors and cache directories without redirects
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: >-
        {{ ['/var', '/var/lib', '/var/lib/cloudlab', '/opt', '/opt/cloudlab',
             '/opt/cloudlab/playbooks', '/opt/cloudlab/playbooks/access']
           + access_runtime_directories
           + (access_runtime_directories | map('regex_replace', '$', '/__pycache__') | list) }}
      register: access_runtime_ancestors
    - name: Reject redirected or foreign runtime directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.uid == 0
        quiet: true
      loop: '{{ access_runtime_ancestors.results }}'
      when: item.stat.exists
    - name: Find only the obsolete module cache under its exact owners
      ansible.builtin.find:
        paths: '{{ access_runtime_directories | map("regex_replace", "$", "/__pycache__") | list }}'
        patterns: [configuration.cpython-*.pyc]
        recurse: false
        file_type: any
      register: access_obsolete_caches
    - name: Inspect exact obsolete writer files
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        checksum_algorithm: sha256
      loop: >-
        {{ (access_runtime_directories | map('regex_replace', '$', '/configuration.py') | list)
           + (access_obsolete_caches.files | map(attribute='path') | list) }}
      register: access_obsolete_files
    - name: Require native handoff before removing any existing writer or cache
      ansible.builtin.assert:
        that:
          - hostvars[groups['k3s_servers'][0]].access_native_handoff_verified | default(false) | bool
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.uid == 0
          - not item.item.endswith('/configuration.py') or item.stat.checksum == access_retired_writer_sha256
        fail_msg: Access writer retirement requires an attested native handoff and unchanged owned files.
        quiet: true
      loop: '{{ access_obsolete_files.results }}'
      when:
        - item.stat.exists
        - not (hostvars[groups['k3s_servers'][0]].access_runtime_retirement_deferred | default(false) | bool)
    - name: Retire the replaced executable and its bytecode while retaining all ownership and data
      ansible.builtin.file:
        path: '{{ item.item }}'
        state: absent
      loop: '{{ access_obsolete_files.results }}'
      when:
        - item.stat.exists
        - hostvars[groups['k3s_servers'][0]].access_native_handoff_verified | default(false) | bool
    - name: Report deferred retirement until the initial private binding exists
      ansible.builtin.debug:
        msg: Access runtime retirement deferred; initial access seed is retained until private source binding.
      when: hostvars[groups['k3s_servers'][0]].access_runtime_retirement_deferred | default(false) | bool
