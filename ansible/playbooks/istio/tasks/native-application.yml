---
- name: Wait for a previous gateway operation before declaring the retained Application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-gateways
  register: mesh_previous_operation
  until:
    - mesh_previous_operation.resources | length == 0 or not mesh_previous_operation.resources[0].operation | default({})
  retries: 60
  delay: 5
  no_log: true

- name: Declare only the retained gateway Application with its existing field manager
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: '{{ mesh_native_owner }}'
      force_conflicts: false
    definition: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/application.yml.j2') | from_yaml }}"
  no_log: true

- name: Read the native Application identity after declaration
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-gateways
  register: mesh_declared_application
  no_log: true

- name: Require the previously retained Application UID
  ansible.builtin.assert:
    that:
      - >-
        not mesh_native_state.application_uid | default('') or
        mesh_declared_application.resources[0].metadata.uid == mesh_native_state.application_uid
    quiet: true
  no_log: true

- name: Select whether the Application UID needs a durable record
  ansible.builtin.set_fact:
    mesh_record_application_uid: '{{ mesh_native_state.application_uid | default("") != mesh_declared_application.resources[0].metadata.uid }}'
  no_log: true

- name: Record the retained Application UID before waiting for controllers
  when: mesh_record_application_uid
  no_log: true
  block:
    - name: Select the retained Application UID
      ansible.builtin.set_fact:
        mesh_native_state: '{{ mesh_native_state | combine({"application_uid": mesh_declared_application.resources[0].metadata.uid}) }}'
    - name: Atomically record the Application identity
      ansible.builtin.copy:
        dest: '{{ mesh_native_state_path }}'
        content: '{{ mesh_native_state | to_json(sort_keys=true) }}'
        owner: root
        group: root
        mode: '0600'

- name: Require exact gateway Application convergence
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-gateways
  register: mesh_native_ready
  until:
    - mesh_native_ready.resources | length == 1
    - mesh_native_ready.resources[0].metadata.uid == mesh_native_state.application_uid
    - mesh_native_ready.resources[0].status.sync.status | default('') == 'Synced'
    - mesh_native_ready.resources[0].status.sync.revision | default('') == mesh_native_source.revision
    - mesh_native_ready.resources[0].status.sync.comparedTo.source == mesh_native_ready.resources[0].spec.source
    - mesh_native_ready.resources[0].status.health.status | default('') == 'Healthy'
    - not mesh_native_ready.resources[0].operation | default({})
    - mesh_native_ready.resources[0].status.operationState.phase | default('Succeeded') == 'Succeeded'
    - >-
      mesh_native_ready.resources[0].status.conditions | default([])
      | selectattr('type', 'search', 'Error$') | list | length == 0
  retries: 180
  delay: 5
  no_log: true
