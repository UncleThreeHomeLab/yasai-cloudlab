---
- name: Render pinned mesh ownership declarations
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/istio/files/chart.py, payload]
  delegate_to: localhost
  become: false
  register: mesh_payload
  changed_when: false
  no_log: true
- name: Inspect the existing root private binding
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, application.argoproj.io, cloudlab-public-root, -n, argocd, -o, json]
  register: mesh_root_source
  changed_when: false
  no_log: true
- name: Read authenticated shared gateway declarations after binding
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/istio/files/inputs.py]
    stdin: '{{ {"root": mesh_root_source.stdout | from_json, "public": mesh_public_payload} | to_json }}'
  delegate_to: localhost
  become: false
  register: mesh_native_payload
  changed_when: false
  no_log: true
- name: Keep authenticated mesh observation inputs transient
  ansible.builtin.set_fact:
    mesh_runtime_payload: '{{ mesh_public_payload | combine(mesh_payload.stdout | from_json) | combine(mesh_native_payload.stdout | from_json) }}'
  no_log: true
