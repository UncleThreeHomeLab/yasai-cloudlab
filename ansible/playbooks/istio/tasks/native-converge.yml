---
- name: Resolve the published mesh source without Python resource generation
  ansible.builtin.import_tasks: /workspace/ansible/playbooks/argocd/tasks/source.yml

- name: Read the committed native chart inventory
  ansible.builtin.import_tasks: native-inventory.yml

- name: Allocate temporary native transport inputs outside persistent lab state
  ansible.builtin.tempfile:
    state: file
    path: /run
    prefix: cloudlab-mesh-inputs.
    suffix: .json
  register: mesh_native_inputs_file
  changed_when: false
  no_log: true

- name: Pass the committed native inventory through a private temporary file
  no_log: true
  block:
    - name: Copy only source identity and public chart declarations to the native transport file
      ansible.builtin.copy:
        dest: '{{ mesh_native_inputs_file.path }}'
        content: '{{ {"mesh_native_source": gitops_source, "mesh_native_inventory": mesh_native_inventory} | to_json }}'
        mode: '0600'
      changed_when: false
    - name: Converge the native gateway owner under its existing ownership lock
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --nonblock
          - /var/lib/cloudlab/mesh/ownership.lock
          - /usr/bin/ansible-playbook
          - -i
          - localhost,
          - /opt/cloudlab/playbooks/istio/native.yml
      environment:
        ANSIBLE_CONFIG: '{{ host_ansible_config }}'
        ANSIBLE_COLLECTIONS_PATH: '{{ host_ansible_collections }}'
        ANSIBLE_NOCOLOR: '1'
        MESH_NATIVE_INPUTS_FILE: '{{ mesh_native_inputs_file.path }}'
      register: mesh_native_applied
      changed_when: mesh_native_applied.stdout is search('changed=[1-9][0-9]*')
  always:
    - name: Remove native transport inputs after success or failure
      ansible.builtin.file:
        path: '{{ mesh_native_inputs_file.path }}'
        state: absent
      changed_when: false

- name: Inspect the superseded mesh writer after native convergence
  ansible.builtin.stat:
    path: /var/lib/cloudlab/mesh/configuration.py
    follow: false
    checksum_algorithm: sha256
  register: mesh_old_writer

- name: Require the recognized non-data writer before retirement
  ansible.builtin.assert:
    that:
      - mesh_old_writer.stat.isreg | default(false)
      - not mesh_old_writer.stat.islnk | default(false)
      - mesh_old_writer.stat.uid == 0
      - mesh_old_writer.stat.mode == '0600'
      - mesh_old_writer.stat.checksum == mesh_configuration_retired_sha256
    fail_msg: Superseded mesh executable differs from reviewed bytes; preserve it for inspection.
    quiet: true
  when: mesh_old_writer.stat.exists

- name: Retire the recognized mesh writer after native convergence
  ansible.builtin.file:
    path: /var/lib/cloudlab/mesh/configuration.py
    state: absent
  when: mesh_old_writer.stat.exists
