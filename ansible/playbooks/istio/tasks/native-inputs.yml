---
- name: Require exact source and the complete pinned mesh inventory
  ansible.builtin.assert:
    that:
      - mesh_native_source.repository is match('^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[.]git$')
      - mesh_native_source.branch is match('^[A-Za-z0-9][A-Za-z0-9/_-]*$')
      - mesh_native_source.revision is match('^[a-f0-9]{40}$')
      - mesh_native_inventory.mesh_objects.keys() | sort | list == ['base', 'cni', 'istiod', 'ztunnel']
      - mesh_native_inventory.gateway_api | length == 10
    quiet: true
  no_log: true

- name: Read both ready gateway certificate interfaces
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: 'cloudlab-gateway-{{ item }}'
    name: cloudlab-gateway
  loop: [public, private]
  register: mesh_certificates
  no_log: true

- name: Require current ready evidence from both certificate owners
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - >-
        item.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
        | map(attribute='observedGeneration', default=item.resources[0].metadata.generation)
        | unique | list == [item.resources[0].metadata.generation]
    quiet: true
  loop: '{{ mesh_certificates.results }}'
  no_log: true

- name: Require the canonical existing public wildcard
  ansible.builtin.assert:
    that:
      - mesh_certificates.results[0].resources[0].spec.dnsNames | length == 1
      - mesh_certificates.results[0].resources[0].spec.dnsNames[0].startswith('*.')
    quiet: true
  no_log: true

- name: Select the private gateway zone from the existing certificate owner
  ansible.builtin.set_fact:
    mesh_native_zone: '{{ mesh_certificates.results[0].resources[0].spec.dnsNames[0][2:] }}'
    mesh_native_crd_ids: {}
    mesh_native_component_ids: {}
    mesh_observed_gateways: {}
  no_log: true

- name: Require the exact corresponding private wildcard and issuer
  ansible.builtin.assert:
    that:
      - >-
        mesh_certificates.results[1].resources[0].spec.dnsNames ==
        ['*.internal.' ~ mesh_native_zone, 'login.' ~ mesh_native_zone]
    quiet: true
  no_log: true
