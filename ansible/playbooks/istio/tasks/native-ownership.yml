---
- name: Require a canonical mesh state directory
  ansible.builtin.command:
    argv: [/usr/bin/realpath, --canonicalize-existing, '{{ mesh_native_state_dir }}']
  register: mesh_canonical_dir
  changed_when: false
  failed_when: mesh_canonical_dir.rc != 0 or mesh_canonical_dir.stdout != mesh_native_state_dir

- name: Inspect the retained mesh checkpoint without following links
  ansible.builtin.stat:
    path: '{{ mesh_native_state_path }}'
    follow: false
  register: mesh_native_checkpoint

- name: Require a private root-owned regular checkpoint
  ansible.builtin.assert:
    that:
      - mesh_native_checkpoint.stat.isreg | default(false)
      - not mesh_native_checkpoint.stat.islnk | default(false)
      - mesh_native_checkpoint.stat.uid == 0
      - mesh_native_checkpoint.stat.mode == '0600'
    quiet: true
  when: mesh_native_checkpoint.stat.exists

- name: Read retained mesh ownership
  ansible.builtin.slurp:
    src: '{{ mesh_native_state_path }}'
  register: mesh_checkpoint_bytes
  when: mesh_native_checkpoint.stat.exists
  no_log: true

- name: Select retained ownership or exact initial preparation
  ansible.builtin.set_fact:
    mesh_native_state: >-
      {{ (mesh_checkpoint_bytes.content | b64decode | from_json) if mesh_native_checkpoint.stat.exists
         else {'phase': 'preparing', 'gateway_api': mesh_native_crd_ids, 'zone_hash': mesh_native_zone | hash('sha256')} }}
  no_log: true

- name: Read the current gateway Application before any write
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-gateways
  register: mesh_existing_application
  no_log: true

- name: Select retained Application identity and the initial checkpoint phase
  ansible.builtin.set_fact:
    mesh_native_current: '{{ mesh_existing_application.resources | first | default({}) }}'
    mesh_initial_phase: '{{ mesh_native_state.phase }}'
  no_log: true

- name: Read the retained workload CA without exporting any credential
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: istio-system
    name: istio-ca-secret
  register: mesh_ca_secret
  no_log: true

- name: Require the existing workload CA credential fields
  ansible.builtin.assert:
    that:
      - mesh_ca_secret.resources | length == 1
      - "'ca-cert.pem' in mesh_ca_secret.resources[0].data"
      - "'ca-key.pem' in mesh_ca_secret.resources[0].data"
    quiet: true
  no_log: true

- name: Retain only the workload CA identity and its existing hash format
  ansible.builtin.set_fact:
    mesh_native_ca:
      uid: '{{ mesh_ca_secret.resources[0].metadata.uid }}'
      content: '{{ mesh_ca_secret.resources[0].data | to_json(sort_keys=true) | hash("sha256") }}'
  no_log: true

- name: Check retained ownership and trust boundaries before writing
  ansible.builtin.import_tasks: native-owner-check.yml
  no_log: true

- name: Refuse existing gateways without an initial ownership checkpoint
  when: not mesh_native_checkpoint.stat.exists
  no_log: true
  block:
    - name: Inspect both protected initial gateway resources
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        namespace: 'cloudlab-gateway-{{ item }}'
        name: cloudlab
      loop: [public, private]
      register: mesh_initial_gateways
    - name: Require both gateways absent before first creation
      ansible.builtin.assert:
        that: item.resources | length == 0
        fail_msg: Existing gateway lacks its retained ownership checkpoint; adoption refused.
        quiet: true
      loop: '{{ mesh_initial_gateways.results }}'

- name: Select whether initial component and trust bindings need a durable record
  ansible.builtin.set_fact:
    mesh_record_prerequisites: >-
      {{ not mesh_native_checkpoint.stat.exists or 'components' not in mesh_native_state
         or 'workload_ca' not in mesh_native_state }}
  no_log: true

- name: Bind initial component and trust identities before Application creation
  when: mesh_record_prerequisites
  no_log: true
  block:
    - name: Select retained component and CA bindings
      ansible.builtin.set_fact:
        mesh_native_state: >-
          {{ mesh_native_state | combine({'components': mesh_native_component_ids, 'workload_ca': mesh_native_ca}) }}
    - name: Atomically record retained prerequisites before gateway creation
      ansible.builtin.copy:
        dest: '{{ mesh_native_state_path }}'
        content: '{{ mesh_native_state | to_json(sort_keys=true) }}'
        owner: root
        group: root
        mode: '0600'
