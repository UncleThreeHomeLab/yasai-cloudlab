---
- name: Read the committed chart lock for the selected mesh component
  ansible.builtin.set_fact:
    mesh_component_lock: >-
      {{ lookup('ansible.builtin.file', '/workspace/platform/connectivity/istio/'
         ~ mesh_inventory_component ~ '/artifact.lock.json') | from_json }}

- name: Require the pinned chart path, namespace and Helm implementation
  ansible.builtin.assert:
    that:
      - mesh_component_lock.archive is match('^charts/[a-zA-Z0-9_.-]+[.]tgz$')
      - mesh_component_lock.namespace == 'istio-system'
      - mesh_helm_version.stdout | trim == mesh_component_lock.helm_version
    quiet: true

- name: Inspect the reviewed upstream and packaged chart bytes
  ansible.builtin.stat:
    path: '/workspace/platform/connectivity/istio/{{ mesh_inventory_component }}/{{ item.path }}'
    checksum_algorithm: sha256
  loop:
    - {path: upstream.tgz, checksum: '{{ mesh_component_lock.upstream_sha256 }}'}
    - {path: '{{ mesh_component_lock.archive }}', checksum: '{{ mesh_component_lock.sha256 }}'}
  delegate_to: localhost
  become: false
  register: mesh_component_archives

- name: Require both reviewed artifact checksums
  ansible.builtin.assert:
    that: item.stat.checksum == item.item.checksum
    quiet: true
  loop: '{{ mesh_component_archives.results }}'

- name: Read the committed declarations directly through native Helm
  ansible.builtin.command:
    argv:
      - helm
      - template
      - '{{ mesh_inventory_component }}'
      - '/workspace/platform/connectivity/istio/{{ mesh_inventory_component }}'
      - --namespace
      - '{{ mesh_component_lock.namespace }}'
      - --kube-version
      - '{{ mesh_component_lock.kube_version }}'
      - --include-crds
      - --values
      - '/workspace/platform/connectivity/istio/{{ mesh_inventory_component }}/values.json'
  delegate_to: localhost
  become: false
  register: mesh_component_rendered
  changed_when: false
  timeout: 90
  no_log: true

- name: Select the native chart declarations for identity verification
  ansible.builtin.set_fact:
    mesh_native_inventory: >-
      {{ mesh_native_inventory | combine({'mesh_objects': mesh_native_inventory.mesh_objects
         | combine({mesh_inventory_component: mesh_component_rendered.stdout | from_yaml_all | select('truthy') | list})}) }}
  no_log: true
