---
- name: Converge native mesh gateways under the retained ownership lock
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    mesh_native_owner: cloudlab-gateways-bootstrap
    mesh_native_state_dir: /var/lib/cloudlab/mesh
    mesh_native_state_path: '{{ mesh_native_state_dir }}/ownership.json'
    mesh_native_transport: >-
      {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MESH_NATIVE_INPUTS_FILE')) | from_json }}
    mesh_native_source: '{{ mesh_native_transport.mesh_native_source }}'
    mesh_native_inventory: '{{ mesh_native_transport.mesh_native_inventory }}'
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Validate the reviewed native inventory and retained private zone
      ansible.builtin.import_tasks: tasks/native-inputs.yml
    - name: Compare retained Gateway API contracts without modifying their owner
      ansible.builtin.include_tasks: tasks/native-gateway-api.yml
      loop: '{{ mesh_native_inventory.gateway_api }}'
      loop_control:
        loop_var: mesh_expected_crd
        label: '{{ mesh_expected_crd.metadata.name }}'
    - name: Inspect the sole Argo ownership of each existing mesh component
      ansible.builtin.include_tasks: tasks/native-component.yml
      loop: '{{ mesh_native_inventory.mesh_objects | dict2items }}'
      loop_control:
        loop_var: mesh_expected_component
        label: '{{ mesh_expected_component.key }}'
    - name: Validate and bind retained mesh ownership before configuration
      ansible.builtin.import_tasks: tasks/native-ownership.yml
    - name: Read existing Argo routing through its current consumer interface
      ansible.builtin.import_tasks: tasks/native-argo.yml
    - name: Declare only the retained gateway Application
      ansible.builtin.import_tasks: tasks/native-application.yml
    - name: Validate and bind generated gateway identities in order
      ansible.builtin.include_tasks: tasks/native-gateway.yml
      loop: [public, private]
      loop_control:
        loop_var: mesh_gateway_exposure
    - name: Record accepted mesh ownership after both gateways pass
      ansible.builtin.import_tasks: tasks/native-acceptance.yml
