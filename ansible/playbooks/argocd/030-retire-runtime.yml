---
- name: Retire replaced private registration executables on every managed node
  hosts: k3s_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Inspect old executable directories without following redirects
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: [/opt, /opt/cloudlab, /opt/cloudlab/gitops, /opt/cloudlab/playbooks, /opt/cloudlab/playbooks/argocd, /opt/cloudlab/playbooks/argocd/files]
      register: gitops_private_directories
    - name: Reject redirected or foreign executable directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.uid == 0
        quiet: true
      loop: '{{ gitops_private_directories.results }}'
      when: item.stat.exists
    - name: Check local legacy registration checkpoints before removing the old writer
      ansible.builtin.command:
        argv: [python3, '-', check]
        stdin: '{{ lookup("file", "/workspace/ansible/playbooks/argocd/files/private_retire.py") }}'
      register: gitops_private_runtime_guard
      changed_when: false
    - name: Inspect exact replaced executable paths
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - /opt/cloudlab/gitops/private_bootstrap.py
        - /opt/cloudlab/playbooks/argocd/files/private_bootstrap.py
      register: gitops_private_executables
    - name: Reject foreign executable replacements
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.uid == 0
          - item.stat.mode == '0600'
        quiet: true
      loop: '{{ gitops_private_executables.results }}'
      when: item.stat.exists
    - name: Remove replaced private registration writer executables
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /opt/cloudlab/gitops/private_bootstrap.py
        - /opt/cloudlab/playbooks/argocd/files/private_bootstrap.py
