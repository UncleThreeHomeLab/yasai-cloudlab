---
- name: Retire one explicitly selected legacy private registration without deleting workloads
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require an explicit legacy registration selector
      ansible.builtin.assert:
        that:
          - gitops_private_retire_name is defined
          - gitops_private_retire_name is string
          - gitops_private_retire_name is match('^[a-z]([a-z0-9-]{0,28}[a-z0-9])?$')
        fail_msg: Supply gitops_private_retire_name for one accepted legacy registration.
    - name: Retire only the checkpointed registration through the committed upgrade interface
      ansible.builtin.command:
        argv: [python3, /opt/cloudlab/gitops/private_retire.py]
        stdin: '{{ {"name": gitops_private_retire_name} | to_json }}'
      register: gitops_private_retirement
      changed_when: (gitops_private_retirement.stdout | from_json).changed
      no_log: true
