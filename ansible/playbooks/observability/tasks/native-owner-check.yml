---
- name: Refuse foreign telemetry Application ownership or scope
  ansible.builtin.assert:
    that:
      - telemetry_current.metadata.labels['cloudlab.io/owner'] | default('') == telemetry_policy.owner
      - not telemetry_current.metadata.ownerReferences | default([])
      - not telemetry_current.metadata.finalizers | default([])
      - telemetry_current.spec.project == 'cloudlab-observability'
      - >-
        telemetry_current.spec.destination ==
        {'server': 'https://kubernetes.default.svc', 'namespace': telemetry_policy.namespace}
      - telemetry_current.spec.source.repoURL == telemetry_source.repository
      - telemetry_current.spec.source.path == telemetry_application_path
    fail_msg: Telemetry Application has another owner or scope; adoption refused.
    quiet: true
  when: telemetry_current | length > 0
