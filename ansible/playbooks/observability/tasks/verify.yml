---
- name: Read native retained telemetry interfaces
  ansible.builtin.import_tasks: verification-inputs.yml

- name: Resolve committed telemetry behavior and retention inputs
  ansible.builtin.command: python -m playbooks.observability.files.payload
  args:
    chdir: /workspace
    stdin: '{{ telemetry_verification_inputs | to_json }}'
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: telemetry_verification_payload

- name: Verify actual telemetry storage and a correlated service request
  ansible.builtin.command: python3 /opt/cloudlab/playbooks/observability/files/verify.py
  args: {stdin: '{{ telemetry_verification_payload.stdout }}'}
  changed_when: false
  no_log: true
  register: telemetry_verified

- name: Report only the sanitized telemetry behavior result
  ansible.builtin.debug:
    msg: '{{ telemetry_verified.stdout | from_json }}'
