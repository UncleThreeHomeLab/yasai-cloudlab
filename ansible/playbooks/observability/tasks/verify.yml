---
- name: Create the private observability verification directory
  ansible.builtin.file:
    path: /var/lib/cloudlab/observability
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Sync the observability verification implementation before running it
  ansible.builtin.copy:
    src: '/workspace/ansible/playbooks/observability/files/{{ item }}'
    dest: '/var/lib/cloudlab/observability/{{ item }}'
    owner: root
    group: root
    mode: '0600'
  loop: [kube.py, native.py, verify.py]

- name: Refresh authenticated observability observation inputs
  ansible.builtin.import_tasks: source.yml
  vars:
    observability_public_payload: '{{ gitops_verification_payload.stdout | from_json }}'
- name: Verify native telemetry desired state
  ansible.builtin.command:
    argv: [python3, /var/lib/cloudlab/observability/verify.py]
    stdin: '{{ observability_runtime_payload | to_json }}'
  register: observability_verified
  changed_when: false
  failed_when: false
  no_log: true
- name: Require observability verification to pass
  ansible.builtin.assert:
    that: observability_verified.rc == 0
    fail_msg: Observability verification failed; private diagnostics withheld.
- name: Report sanitized observability acceptance
  ansible.builtin.debug:
    msg: '{{ observability_verified.stdout | from_json }}'
