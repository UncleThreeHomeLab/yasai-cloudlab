---
- name: Resolve the published source through native Git
  ansible.builtin.import_tasks: /workspace/ansible/playbooks/argocd/tasks/source.yml

- name: Read only current telemetry prerequisites
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
  no_log: true
  block:
    - name: Select current source and committed policy
      ansible.builtin.set_fact:
        telemetry_source: '{{ gitops_source }}'
        telemetry_policy: "{{ lookup('ansible.builtin.file', '/workspace/platform/observability/policy.json') | from_json }}"
    - name: Read native retained interfaces and ownership boundaries
      ansible.builtin.import_tasks: native-inputs.yml
    - name: Select read-only verifier inputs from the native declarations
      ansible.builtin.set_fact:
        telemetry_verification_inputs:
          source: '{{ telemetry_source }}'
          metadata:
            loginHost: '{{ telemetry_login_host }}'
            grafanaHost: '{{ telemetry_grafana_host }}'
            kialiHost: '{{ telemetry_kiali_host }}'
          kiali_values: >-
            {{ lookup('ansible.builtin.template', '/workspace/ansible/playbooks/observability/templates/kiali-values.yml.j2')
               | from_yaml }}
