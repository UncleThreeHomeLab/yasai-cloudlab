---
- name: Wait for all retained telemetry ExternalSecrets to be ready
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    namespace: '{{ telemetry_policy.namespace }}'
  register: telemetry_external_secrets
  until:
    - >-
      telemetry_external_secrets.resources | selectattr('metadata.name', 'in', telemetry_policy.secrets)
      | list | length == telemetry_policy.secrets | length
    - >-
      telemetry_external_secrets.resources | selectattr('metadata.name', 'in', telemetry_policy.secrets)
      | selectattr('status.conditions', 'defined') | map(attribute='status.conditions') | flatten
      | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
      | list | length == telemetry_policy.secrets | length
  retries: 60
  delay: 5
  no_log: true
