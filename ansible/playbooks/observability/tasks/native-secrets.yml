---
- name: Wait for all retained telemetry ExternalSecrets to be ready
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    namespace: '{{ telemetry_policy.namespace }}'
    name: '{{ item }}'
  loop: '{{ telemetry_policy.secrets }}'
  register: telemetry_external_secrets
  until:
    - telemetry_external_secrets.resources | length == 1
    - >-
      telemetry_external_secrets.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
      | list | length == 1
    - >-
      telemetry_external_secrets.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
      | map(attribute='observedGeneration', default=telemetry_external_secrets.resources[0].metadata.generation)
      | unique | list == [telemetry_external_secrets.resources[0].metadata.generation]
  retries: 60
  delay: 5
  no_log: true
