---
- name: Select the focused telemetry Application
  ansible.builtin.set_fact:
    telemetry_application_name: "{{ 'cloudlab-observability' if telemetry_component == 'configuration' else 'cloudlab-' ~ telemetry_component }}"
    telemetry_application_path: "{{ 'platform/observability' ~ ('' if telemetry_component == 'configuration' else '/' ~ telemetry_component) }}"

- name: Inspect retained telemetry Application identity
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: '{{ telemetry_application_name }}'
  register: telemetry_existing
  no_log: true

- name: Select retained Application
  ansible.builtin.set_fact:
    telemetry_current: '{{ telemetry_existing.resources | first | default({}) }}'
  no_log: true

- name: Check ownership before any Application write
  ansible.builtin.import_tasks: native-owner-check.yml
  no_log: true

- name: Declare only the retained telemetry Application
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: '{{ telemetry_policy.owner }}'
      force_conflicts: false
    definition: "{{ lookup('ansible.builtin.template', telemetry_template_dir ~ '/application.yml.j2') | from_yaml }}"
  no_log: true

- name: Wait for the exact source without competing with Argo
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: '{{ telemetry_application_name }}'
  register: telemetry_ready
  until:
    - telemetry_ready.resources | length == 1
    - telemetry_ready.resources[0].status.sync.status | default('') == 'Synced'
    - telemetry_ready.resources[0].status.sync.revision | default('') == telemetry_source.revision
    - telemetry_ready.resources[0].status.operationState.phase | default('') == 'Succeeded'
    - not telemetry_ready.resources[0].operation | default({})
    - >-
      telemetry_ready.resources[0].status.conditions | default([])
      | selectattr('type', 'search', 'Error$') | list | length == 0
    - telemetry_ready.resources[0].status.sync.comparedTo.source == telemetry_ready.resources[0].spec.source
    - telemetry_component == 'configuration' or telemetry_ready.resources[0].status.health.status | default('') == 'Healthy'
    - not telemetry_current or telemetry_ready.resources[0].metadata.uid == telemetry_current.metadata.uid
  retries: 180
  delay: 5
  no_log: true
