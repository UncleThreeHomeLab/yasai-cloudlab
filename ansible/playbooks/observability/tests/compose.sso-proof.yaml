services:
  pki:
    extends:
      file: ../../keycloak/tests/compose.identity-proof.yaml
      service: pki
  database:
    extends:
      file: ../../keycloak/tests/compose.identity-proof.yaml
      service: database
    mem_limit: 512m
    cpus: 1
    tmpfs:
    - /tmp:uid=26,gid=26,mode=1777,size=256m
    logging:
      driver: none
  server:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command:
    - start
    - --http-enabled=false
    - --hostname=https://localhost:8443
    - --hostname-strict=true
    - --hostname-admin=https://admin.fixture.test
    - --proxy-headers=xforwarded
    - --proxy-trusted-addresses=127.0.0.1
    - --https-certificate-file=/fixture/tls.crt
    - --https-certificate-key-file=/fixture/tls.key
    - --db=postgres
    - --db-url=jdbc:postgresql://database:5432/postgres
    - --db-username=postgres
    - --db-password=fixture-unused
    - --health-enabled=true
    - --log-level=WARN
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: fixture-only-isolated-admin
    depends_on:
      database:
        condition: service_healthy
      pki:
        condition: service_completed_successfully
    volumes:
    - identity_fixture:/fixture:ro
    networks:
      fixture:
        aliases:
        - admin.fixture.test
    mem_limit: 1536m
    cpus: 1
    logging:
      driver: none
  setup:
    build: ../../../runner
    entrypoint:
    - python
    - -m
    - playbooks.observability.tests.sso_proof
    working_dir: /workspace
    volumes:
    - ../../../..:/workspace:ro
    - identity_fixture:/fixture
    depends_on:
      server:
        condition: service_started
    network_mode: service:server
    mem_limit: 256m
    cpus: 0.5
  grafana:
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    user: 1000:1000
    command:
    - --config=/fixture/grafana.ini
    environment:
      SSL_CERT_FILE: /fixture/ca.crt
      GF_LOG_LEVEL: error
    volumes:
    - identity_fixture:/fixture:ro
    tmpfs:
    - /var/lib/grafana:uid=1000,gid=1000,mode=0700,size=64m
    - /tmp:mode=1777,size=32m
    read_only: true
    depends_on:
      setup:
        condition: service_completed_successfully
    network_mode: service:server
    mem_limit: 384m
    cpus: 0.25
    logging:
      driver: none
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  browser:
    build: ../../keycloak/tests/browser
    entrypoint:
    - node
    - /proof/grafana.mjs
    environment:
      NODE_EXTRA_CA_CERTS: /fixture/ca.crt
    user: 1000:1000
    read_only: true
    volumes:
    - ./browser/grafana.mjs:/proof/grafana.mjs:ro
    - identity_fixture:/fixture:ro
    tmpfs:
    - /tmp:uid=1000,gid=1000,mode=1777,size=128m
    depends_on:
      grafana:
        condition: service_started
    network_mode: service:server
    mem_limit: 768m
    cpus: 1
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
networks:
  fixture:
    internal: true
volumes:
  identity_fixture: null
