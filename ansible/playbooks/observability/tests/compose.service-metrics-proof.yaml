x-runner: &runner
  image: cloudlab-service-metrics-fixture:local
  build:
    context: ../../../runner
    additional_contexts:
      ci-source: ../../../../platform/delivery/ci
  entrypoint: [python, -m, playbooks.observability.tests.service_metrics_proof]
  working_dir: /workspace
  environment: {PYTHONPATH: '/workspace/ansible:/workspace', PYTHONDONTWRITEBYTECODE: '1'}
  volumes: ['../../../..:/workspace:ro', 'fixture:/fixture']
  mem_limit: 384m
  cpus: 0.5
services:
  prepare:
    <<: *runner
    command: [prepare]
    network_mode: none
    volumes: ['../../../..:/workspace:ro', 'fixture:/fixture', 'state:/alertmanager-state']
  receiver:
    <<: *runner
    user: '65534:65534'
    entrypoint: [python, -m, playbooks.observability.tests.notification_fixture]
    depends_on: {prepare: {condition: service_completed_successfully}}
    networks:
      fixture:
        aliases: [smtp.fixture.invalid, incident-receiver.cloudlab-app-incident-receiver.svc]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command: [--config.file=/fixture/alertmanager.yaml, --storage.path=/alertmanager, --cluster.listen-address=]
    depends_on: {prepare: {condition: service_completed_successfully}}
    volumes: ['fixture:/fixture:ro', 'fixture:/etc/alertmanager:ro', 'state:/alertmanager']
    networks: [fixture]
    read_only: true
    mem_limit: 128m
    cpus: 0.2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  exporter:
    <<: *runner
    command: [exporter]
    networks: [fixture]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  promtool:
    image: quay.io/prometheus/prometheus:v3.15.0-distroless@sha256:b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    entrypoint: [/bin/promtool]
    command: [check, rules, /fixture/rules.yaml]
    volumes: ['fixture:/fixture:ro']
    depends_on: {prepare: {condition: service_completed_successfully}}
    network_mode: none
    read_only: true
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.0-distroless@sha256:b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    command: [--config.file=/fixture/prometheus.yaml, --storage.tsdb.path=/tmp/prometheus, --storage.tsdb.retention.time=1h, --storage.tsdb.retention.size=64MB, --web.enable-lifecycle]
    volumes: ['fixture:/fixture:ro']
    tmpfs: ['/tmp:mode=1777,size=128m']
    depends_on: {prepare: {condition: service_completed_successfully}, exporter: {condition: service_started}, promtool: {condition: service_completed_successfully}}
    networks: [fixture]
    read_only: true
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  grafana:
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    depends_on: {prepare: {condition: service_completed_successfully}}
    environment:
      GF_SECURITY_ADMIN_USER: fixture-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /fixture/grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_LOG_LEVEL: error
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL: ''
      GF_PLUGINS_PREINSTALL_SYNC: ''
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: 'true'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_PATHS_CONFIG: /fixture/grafana.ini
      GF_PATHS_PROVISIONING: /fixture/grafana-provisioning
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_ALERTING_ENABLED: 'false'
    volumes: ['fixture:/fixture:ro']
    tmpfs: ['/var/lib/grafana:uid=472,gid=472,size=64m', '/tmp:mode=1777,size=32m']
    read_only: true
    networks: [fixture]
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proof:
    <<: *runner
    user: '65534:65534'
    command: [verify]
    networks: [fixture]
    depends_on: {prometheus: {condition: service_started}, grafana: {condition: service_started}, alertmanager: {condition: service_started}}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  fixture:
    internal: true
    ipam:
      config: [{subnet: '${SERVICE_METRICS_PROOF_SUBNET:-10.245.235.0/24}'}]
volumes:
  fixture:
  state:
