---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "obs-storage-{{ .Values.operationId }}-loki",
    "namespace": "obs-storage-{{ .Values.operationId }}",
    "labels": {
      "helm.sh/chart": "loki-7.3.0",
      "app.kubernetes.io/name": "loki",
      "app.kubernetes.io/instance": "cloudlab-loki",
      "app.kubernetes.io/version": "3.6.11",
      "app.kubernetes.io/component": "single-binary",
      "app.kubernetes.io/part-of": "memberlist",
      "cloudlab.io/owner": "observability-lifecycle-proof",
      "cloudlab.io/storage-proof": "{{ .Values.operationId }}"
    }
  },
  "spec": {
    "replicas": {{ ternary 1 0 (eq .Values.phase "running") }},
    "podManagementPolicy": "Parallel",
    "updateStrategy": {
      "rollingUpdate": {
        "partition": 0
      }
    },
    "serviceName": "obs-storage-{{ .Values.operationId }}-loki-headless",
    "revisionHistoryLimit": 10,
    "persistentVolumeClaimRetentionPolicy": {
      "whenDeleted": "Retain",
      "whenScaled": "Retain"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "loki",
        "app.kubernetes.io/instance": "cloudlab-loki",
        "app.kubernetes.io/component": "single-binary"
      }
    },
    "template": {
      "metadata": {
        "annotations": {
          "checksum/config": "{{ get (include "storage.config.loki" . | fromJson) "data" | toJson | sha256sum }}",
          "storage/size": "1Gi",
          "kubectl.kubernetes.io/default-container": "loki"
        },
        "labels": {
          "app.kubernetes.io/name": "loki",
          "app.kubernetes.io/instance": "cloudlab-loki",
          "app.kubernetes.io/component": "single-binary",
          "app.kubernetes.io/part-of": "memberlist",
          "cloudlab.io/owner": "observability-lifecycle-proof",
          "cloudlab.io/storage-proof": "{{ .Values.operationId }}"
        }
      },
      "spec": {
        "serviceAccountName": "obs-storage-{{ .Values.operationId }}-loki",
        "automountServiceAccountToken": false,
        "enableServiceLinks": true,
        "securityContext": {
          "fsGroup": 10001,
          "fsGroupChangePolicy": "OnRootMismatch",
          "runAsGroup": 10001,
          "runAsNonRoot": true,
          "runAsUser": 10001
        },
        "terminationGracePeriodSeconds": 30,
        "containers": [
          {
            "name": "loki",
            "image": "docker.io/grafana/loki@sha256:2483b71b28b15dee230f85512cae2b20c4b5f6e98a6eabe686cbccfa5ea3ba4a",
            "imagePullPolicy": "IfNotPresent",
            "args": [
              "-config.file=/etc/loki/config/config.yaml",
              "-target=all"
            ],
            "ports": [
              {
                "name": "http-metrics",
                "containerPort": 3100,
                "protocol": "TCP"
              },
              {
                "name": "grpc",
                "containerPort": 9095,
                "protocol": "TCP"
              },
              {
                "name": "http-memberlist",
                "containerPort": 7946,
                "protocol": "TCP"
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true
            },
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/ready",
                "port": "http-metrics"
              },
              "initialDelaySeconds": 15,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "config",
                "mountPath": "/etc/loki/config"
              },
              {
                "name": "runtime-config",
                "mountPath": "/etc/loki/runtime-config"
              },
              {
                "name": "storage",
                "mountPath": "/var/loki"
              }
            ],
            "resources": {
              "limits": {
                "cpu": "400m",
                "memory": "768Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            }
          }
        ],
        "affinity": {
          "podAntiAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": [
              {
                "labelSelector": {
                  "matchLabels": {
                    "app.kubernetes.io/component": "single-binary",
                    "app.kubernetes.io/instance": "cloudlab-loki",
                    "app.kubernetes.io/name": "loki"
                  }
                },
                "topologyKey": "kubernetes.io/hostname"
              }
            ]
          }
        },
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "config",
            "configMap": {
              "name": "obs-storage-{{ .Values.operationId }}-loki-config",
              "items": [
                {
                  "key": "config.yaml",
                  "path": "config.yaml"
                }
              ]
            }
          },
          {
            "name": "runtime-config",
            "configMap": {
              "name": "obs-storage-{{ .Values.operationId }}-loki-runtime"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "apiVersion": "v1",
        "kind": "PersistentVolumeClaim",
        "metadata": {
          "name": "storage",
          "labels": {
            "cloudlab.io/owner": "observability-lifecycle-proof",
            "cloudlab.io/storage-proof": "{{ .Values.operationId }}"
          }
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "storageClassName": "cloudlab-telemetry",
          "resources": {
            "requests": {
              "storage": "1Gi"
            }
          }
        }
      }
    ]
  }
}

