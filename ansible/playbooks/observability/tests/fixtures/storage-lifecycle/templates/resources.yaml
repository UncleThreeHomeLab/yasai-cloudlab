    "active-alerts.json": "{\n  \"uid\": \"active-alerts\",\n  \"title\": \"Active alerts\",\n  \"editable\": false,\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"platform\",\n    \"alerts\"\n  ],\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"text\",\n      \"title\": \"Observed alerts\",\n      \"gridPos\": {\n        \"h\": 3,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"Pending and firing alerts observed by Prometheus. Empty rows mean no active observed alerts; they do not prove health or rule coverage. Missing HTTP series and low traffic require investigation. Workload readiness describes readiness only.\"\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Pending and firing\",\n      \"type\": \"table\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"metrics\"\n      },\n      \"gridPos\": {\n        \"h\": 15,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 3\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"ALERTS{alertstate=~\\\"pending|firing\\\"}\",\n          \"instant\": true,\n          \"format\": \"table\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      }\n    }\n  ]\n}\n",
    "nodes.json": "{\n  \"uid\": \"cloudlab-nodes\",\n  \"title\": \"Nodes\",\n  \"description\": \"Basic host capacity and performance. Disk space covers the root filesystem. Network traffic covers physical Ethernet interfaces.\",\n  \"schemaVersion\": 41,\n  \"version\": 2,\n  \"editable\": false,\n  \"tags\": [\n    \"cloudlab\"\n  ],\n  \"timezone\": \"browser\",\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"instance\",\n        \"label\": \"Node\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"metrics\"\n        },\n        \"query\": \"label_values(node_uname_info, instance)\",\n        \"refresh\": 1,\n        \"includeAll\": true,\n        \"allValue\": \".*\",\n        \"multi\": true,\n        \"sort\": 1,\n        \"current\": {\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        }\n      }\n    ]\n  },\n  \"links\": [\n    {\n      \"type\": \"link\",\n      \"title\": \"Releases\",\n      \"url\": \"/d/cloudlab-rollouts\",\n      \"keepTime\": true\n    },\n    {\n      \"type\": \"dashboards\",\n      \"tags\": [\n        \"cloudlab\"\n      ],\n      \"title\": \"CloudLab dashboards\",\n      \"asDropdown\": true,\n      \"includeVars\": true,\n      \"keepTime\": true\n    }\n  ],\n  \"panels\": [\n    {\n      \"id\": 2,\n      \"title\": \"CPU utilisation\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"metrics\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"noValue\": \"UNKNOWN\",\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"min\": 0,\n          \"max\": 1\n   