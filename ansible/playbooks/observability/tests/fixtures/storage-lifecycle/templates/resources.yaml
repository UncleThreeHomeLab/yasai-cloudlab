            "ports": [
              {
                "name": "grafana",
                "containerPort": 3000,
                "protocol": "TCP"
              },
              {
                "name": "gossip-tcp",
                "containerPort": 9094,
                "protocol": "TCP"
              },
              {
                "name": "gossip-udp",
                "containerPort": 9094,
                "protocol": "UDP"
              },
              {
                "name": "profiling",
                "containerPort": 6060,
                "protocol": "TCP"
              }
            ],
            "env": [
              {
                "name": "POD_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              },
              {
                "name": "GF_SECURITY_ADMIN_USER",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "obs-storage-{{ .Values.operationId }}-grafana-emergency",
                    "key": "username"
                  }
                }
              },
              {
                "name": "GF_SECURITY_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "obs-storage-{{ .Values.operationId }}-grafana-emergency",
                    "key": "password"
                  }
                }
              },
              {
                "name": "GF_PATHS_DATA",
                "value": "/var/lib/grafana/"
              },
              {
                "name": "GF_PATHS_LOGS",
                "value": "/var/log/grafana"
              },
              {
                "name": "GF_PATHS_PLUGINS",
                "value": "/var/lib/grafana/plugins"
              },
              {
                "name": "GF_PATHS_PROVISIONING",
                "value": "/etc/grafana/provisioning"
              },
              {
                "name": "GF_UNIFIED_STORAGE_INDEX_PATH",
                "value": "/var/lib/grafana-search/bleve"
              },
              {
                "name": "GOMEMLIMIT",
                "value": "691MiB"
              }
            ],
            "livenessProbe": {
              "failureThreshold": 10,
              "httpGet": {
                "path": "/api/health",
                "port": "grafana"
              },
              "initialDelaySeconds": 60,
              "timeoutSeconds": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "grafana"
              }
            },
            "resources": {
              "limits": {
                "cpu": "250m",
                "memory": "768Mi"
              },
              "requests": {
                "cpu": "20m",
                "memory": "512Mi"
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "config",
            "configMap": {
              "name": "obs-storage-{{ .Values.operationId }}-grafana-config"
            }
          },
          {
            "name": "dashboards-cloudlab",
            "configMap": {
              "name": "obs-storage-{{ .Values.operationId }}-grafana-dashboards"
            }
          },
          {
            "name": "storage",
            "persistentVolumeClaim": {
              "claimName": "obs-storage-{{ .Values.operationId }}-grafana"
            }
          },
          {
            "name": "search",
            "emptyDir": {}
          },
          {
            "name": "grafana-oidc",
            "secret": {
              "secretName": "obs-storage-{{ .Values.operationId }}-grafana-oidc",
              "defaultMode": null
            }
          },
          {
            "name": "grafana-emergency",
            "secret": {
              "secretName": "obs-storage-{{ .Values.operationId }}-grafana-emergency",
              "defaultMode": null
            }
          }
        ]
      }
    }
  }
}

