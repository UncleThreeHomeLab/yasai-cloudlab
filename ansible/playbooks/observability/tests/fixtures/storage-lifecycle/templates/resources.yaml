        "app.kubernetes.io/instance": "cloudlab-tempo"
      }
    },
    "serviceName": "obs-storage-{{ .Values.operationId }}-tempo-headless",
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "tempo",
          "app.kubernetes.io/instance": "cloudlab-tempo",
          "cloudlab.io/owner": "observability-lifecycle-proof",
