        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": []\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      }\n    },\n    {\n      \"id\": 11,\n      \"title\": \"Disk mean I/O latency\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"metrics\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 14,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"noValue\": \"UNKNOWN\",\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"(sum by(instance) (rate(node_disk_read_time_seconds_total{instance=~\\\"$instance\\\",device=~\\\"sd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+\\\"}[$__rate_interval])) + sum by(instance) (rate(node_disk_write_time_seconds_total{instance=~\\\"$instance\\\",device=~\\\"sd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+\\\"}[$__rate_interval]))) / ((sum by(instance) (rate(node_disk_reads_completed_total{instance=~\\\"$instance\\\",device=~\\\"sd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+\\\"}[$__rate_interval])) + sum by(instance) (rate(node_disk_writes_completed_total{instance=~\\\"$instance\\\",device=~\\\"sd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+\\\"}[$__rate_interval]))) > 0)\",\n          \"legendFormat\": \"{{ "{{" }}instance}}\",\n          \"range\": true,\n          \"instant\": false\n        }\n      ],\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": []\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      }\n    },\n    {\n      \"id\": 12,\n      \"title\": \"Network receive / transmit\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"metrics\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 14,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Bps\",\n          \"noValue\": \"UNKNOWN\",\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"rate(node_network_receive_bytes_total{instance=~\\\"$instance\\\",device=~\\\"eth.*|en.*\\\"}[$__rate_interval])\",\n          \"legendFormat\": \"{{ "{{" }}instance}} {{ "{{" }}device}} receive\",\n          \"range\": true,\n          \"instant\": false\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"rate(node_network_transmit_bytes_total{instance=~\\\"$instance\\\",device=~\\\"eth.*|en.*\\\"}[$__rate_interval])\",\n          \"legendFormat\": \"{{ "{{" }}instance}} {{ "{{" }}device}} transmit\",\n          \"range\": true\n        }\n      ],\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": []\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      }\n    }\n  ]\n}\n",
    "releases.json": "{\n  \"uid\": \"cloudlab-rollouts\",\n  \"title\": \"Releases\",\n  \"description\": \"Live stable/canary routing, measured requests and current revision information. UNKNOWN means missing telemetry. No traffic means valid counters recorded zero requests.\",\n  \"schemaVersion\": 41,\n  \"version\": 1,\n  \"editable\": false,\n  \"tags\": [\n    \"cloudlab\",\n    \"releases\"\n  ],\n  \"timezone\": \"browser\",\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"namespace\",\n        \"label\": \"Namespace\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"metrics\"\n        },\n        \"query\": \"label_values(cloudlab_rollout_info, namespace)\",\n        \"refresh\": 1,\n        \"multi\": false,\n        \"includeAll\": false,\n        \"sort\": 1,\n        \"current\": {\n          \"text\": \"cloudlab-app-notes\",\n          \"value\": \"cloudlab-app-notes\"\n        }\n      },\n      {\n        \"name\": \"rollout\",\n        \"label\": \"Service\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"metrics\"\n        },\n        \"query\": \"label_values(cloudlab_rollout_info{namespace=~\\\"$namespace\\\"}, rollout)\",\n        \"refresh\": 1,\n        \"multi\": false,\n        \"includeAll\": false,\n        \"sort\": 1,\n        \"current\": {\n          \"text\": \"notes-web\",\n          \"value\": \"notes-web\"\n        }\n      },\n      {\n        \"name\": \"traffic\",\n        \"label\": \"Traffic\",\n        \"type\": \"custom\",\n        \"query\": \"user,release\",\n        \"includeAll\": true,\n        \"allValue\": \"user|release\",\n        \"multi\": true,\n        \"current\": {\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        },\n        \"description\"