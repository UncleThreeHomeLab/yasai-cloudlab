# Standalone disposable cluster; no host ports or lab credentials.
# Build the runner with compose.lifecycle-proof.yaml first, using this same project.
# Inspect exact project labels before `down --volumes`; never prune global resources.
services:
  cluster:
    image: rancher/k3s:v1.36.5-k3s1@sha256:057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
    privileged: true
    cpus: 4
    mem_limit: 8g
    command: [server, '--disable=traefik,servicelb,local-storage,metrics-server', --tls-san=cluster,
              --node-ip=10.245.237.2, --advertise-address=10.245.237.2,
              --flannel-iface=eth0,
              --write-kubeconfig=/fixture/kubeconfig, --write-kubeconfig-mode=600]
    tmpfs: [/run, /var/lib/rancher/k3s]
    volumes: [credentials:/fixture]
    networks:
      fixture: {ipv4_address: 10.245.237.2, priority: 100}
      image_downloads: {ipv4_address: 10.245.238.2, priority: 0}
    labels: {cloudlab.io/purpose: observability-lifecycle-proof}
  proof:
    image: ${COMPOSE_PROJECT_NAME:?Use a unique obs-lifecycle- project}-runner:local
    entrypoint: [python, -m, playbooks.observability.tests.lifecycle_controller_proof]
    working_dir: /workspace/ansible
    environment:
      FIXTURE_PROJECT: ${COMPOSE_PROJECT_NAME}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../../../../:/workspace:ro
      - credentials:/fixture:ro
    depends_on: [cluster]
    networks:
      fixture: {ipv4_address: 10.245.237.3}
    labels: {cloudlab.io/purpose: observability-lifecycle-proof}
volumes:
  credentials:
    labels: {cloudlab.io/purpose: observability-lifecycle-proof}
networks:
  fixture:
    internal: true
    labels: {cloudlab.io/purpose: observability-lifecycle-proof}
    ipam:
      config: [{subnet: 10.245.237.0/24}]
  image_downloads:
    labels: {cloudlab.io/purpose: observability-lifecycle-image-downloads}
    ipam:
      config: [{subnet: 10.245.238.0/24}]
