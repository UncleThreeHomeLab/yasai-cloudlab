---
- name: Qualify only the explicitly named synthetic Alertmanager checkpoint
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    checkpoint_cleanup: false
    checkpoint_directory: '/var/lib/cloudlab/proofs/observability-checkpoint-{{ checkpoint_operation }}'
  tasks:
    - name: Require an exact synthetic operation identity
      ansible.builtin.assert:
        that:
          - checkpoint_operation is defined
          - checkpoint_operation is string
          - checkpoint_operation is match('^[a-f0-9]{16}$')
          - checkpoint_cleanup is boolean
          - checkpoint_directory == '/var/lib/cloudlab/proofs/observability-checkpoint-' ~ checkpoint_operation
          - ansible_play_hosts_all == ['cloudlab']
        quiet: true

    - name: Prepare pinned synthetic declarations in the existing local runner
      ansible.builtin.command:
        argv: [python, -m, playbooks.observability.tests.alertmanager_checkpoint_proof, --prepare]
      environment:
        PYTHONPATH: /workspace/ansible:/workspace
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
      register: checkpoint_input
      when: not checkpoint_cleanup

    - name: Validate host authority before any proof copy or directory mutation
      ansible.builtin.command:
        argv:
          - python3
          - '-'
          - --host-preflight
          - --directory
          - '{{ checkpoint_directory }}'
          - --operation
          - '{{ checkpoint_operation }}'
          - --driver-hash
          - '{{ lookup("ansible.builtin.file", "/workspace/ansible/playbooks/observability/tests/alertmanager_checkpoint_proof.py", rstrip=false) | hash("sha256") }}'
          - --host-mode
          - '{{ "cleanup" if checkpoint_cleanup else "fresh" }}'
        stdin: '{{ lookup("ansible.builtin.file", "/workspace/ansible/playbooks/observability/tests/alertmanager_checkpoint_proof.py", rstrip=false) }}'
        stdin_add_newline: false
      changed_when: not checkpoint_cleanup
      no_log: true

    - name: Copy the reviewed test driver without installing a runtime writer
      ansible.builtin.copy:
        src: /workspace/ansible/playbooks/observability/tests/alertmanager_checkpoint_proof.py
        dest: '{{ checkpoint_directory }}/proof.py'
        mode: '0600'
        force: false
      when: not checkpoint_cleanup

    - name: Copy pinned synthetic inputs
      ansible.builtin.copy:
        content: '{{ checkpoint_input.stdout }}'
        dest: '{{ checkpoint_directory }}/input.json'
        mode: '0600'
        force: false
      no_log: true
      when: not checkpoint_cleanup

    - name: Run the bounded synthetic operation or its exact receipted cleanup
      ansible.builtin.command:
        argv:
          - python3
          - '{{ checkpoint_directory }}/proof.py'
          - '{{ "--cleanup" if checkpoint_cleanup else "--run" }}'
          - --operation
          - '{{ checkpoint_operation }}'
          - --directory
          - '{{ checkpoint_directory }}/state'
          - --input
          - '{{ checkpoint_directory }}/input.json'
      async: 1800
      poll: 5
      no_log: true
      register: checkpoint_result

    - name: Report only synthetic qualification flags
      ansible.builtin.debug:
        msg: '{{ checkpoint_result.stdout | from_json }}'
