---
- name: Require explicit upgrade scope
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refuse unspecified upgrade before mutation
      ansible.builtin.fail:
        msg: >-
          Review pinned artifacts in Git, then use setup and prove for supported
          convergence, or a named component transition with independent recovery.
          Distribution upgrades, arbitrary version overrides and generic rollback
          are unsupported. No mutation performed.
