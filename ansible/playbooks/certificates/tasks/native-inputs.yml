---
- name: Require exact published source inputs
  ansible.builtin.assert:
    that:
      - certificates_source.repository is match('^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[.]git$')
      - certificates_source.branch is match('^[A-Za-z0-9][A-Za-z0-9/_-]*$')
      - certificates_source.revision is match('^[a-f0-9]{40}$')
    quiet: true
  no_log: true

- name: Require the retained cert-manager operator at the published revision
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-cert-manager
  register: certificates_operator
  until:
    - certificates_operator.resources | length == 1
    - certificates_operator.resources[0].status.sync.status | default('') == 'Synced'
    - certificates_operator.resources[0].status.sync.revision | default('') == certificates_source.revision
    - certificates_operator.resources[0].status.health.status | default('') == 'Healthy'
    - not certificates_operator.resources[0].operation | default({})
    - certificates_operator.resources[0].status.operationState.phase | default('Succeeded') == 'Succeeded'
    - >-
      certificates_operator.resources[0].status.conditions | default([])
      | selectattr('type', 'search', 'Error$') | list | length == 0
  retries: 180
  delay: 5
  no_log: true

- name: Wait for ready DNS credential delivery
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    namespace: cert-manager
    name: cloudlab-dns01
  register: certificates_dns_external
  until:
    - certificates_dns_external.resources | length == 1
    - >-
      certificates_dns_external.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
      | map(attribute='observedGeneration', default=certificates_dns_external.resources[0].metadata.generation)
      | unique | list == [certificates_dns_external.resources[0].metadata.generation]
  retries: 60
  delay: 5
  no_log: true

- name: Read the DNS credential only inside the trusted host
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: cert-manager
    name: cloudlab-dns01
  register: certificates_dns_secret
  no_log: true

- name: Require the exact current ESO owner and fields
  ansible.builtin.assert:
    that:
      - certificates_dns_secret.resources | length == 1
      - >-
        certificates_dns_secret.resources[0].metadata.ownerReferences | default([])
        | selectattr('kind', 'equalto', 'ExternalSecret')
        | selectattr('uid', 'equalto', certificates_dns_external.resources[0].metadata.uid) | list | length == 1
      - certificates_dns_secret.resources[0].data.API_TOKEN | b64decode | trim | length > 0
      - certificates_dns_secret.resources[0].data.API_TOKEN | b64decode | trim is not search('[\r\n]')
      - certificates_dns_secret.resources[0].data.ZONE_ID | b64decode | trim is match('^[a-f0-9]{32}$')
    quiet: true
  no_log: true

- name: Read only the designated active Cloudflare zone without redirects
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/zones/{{ certificates_dns_secret.resources[0].data.ZONE_ID | b64decode | trim }}'
    headers:
      Authorization: 'Bearer {{ certificates_dns_secret.resources[0].data.API_TOKEN | b64decode | trim }}'
      Accept: application/json
    method: GET
    status_code: 200
    follow_redirects: none
    unredirected_headers: [Authorization]
    validate_certs: true
    use_netrc: false
    use_proxy: false
    return_content: true
    timeout: 30
  register: certificates_zone_response
  no_log: true

- name: Require the current active zone identity and canonical name
  ansible.builtin.assert:
    that:
      - certificates_zone_response.json.success
      - certificates_zone_response.json.result.id == certificates_dns_secret.resources[0].data.ZONE_ID | b64decode | trim
      - certificates_zone_response.json.result.status == 'active'
      - certificates_zone_response.json.result.name | length <= 253
      - >-
        certificates_zone_response.json.result.name is
        match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$')
    quiet: true
  no_log: true

- name: Select the canonical zone without persisting its API credential
  ansible.builtin.set_fact:
    certificates_zone: '{{ certificates_zone_response.json.result.name }}'
  no_log: true
