---
- name: Inspect the existing root private binding without creating an initial dependency
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, application.argoproj.io, cloudlab-public-root, -n, argocd, -o, json]
  register: certificates_root_source
  changed_when: false
  no_log: true
- name: Read authenticated certificate values only after the private binding exists
  ansible.builtin.command:
    argv: [python, /workspace/ansible/playbooks/certificates/files/inputs.py]
    stdin: '{{ {"root": certificates_root_source.stdout | from_json, "public": certificates_public_payload} | to_json }}'
  delegate_to: localhost
  become: false
  register: certificates_native_payload
  changed_when: false
  no_log: true
- name: Keep certificate observation inputs transient and private
  ansible.builtin.set_fact:
    certificates_runtime_payload: '{{ certificates_public_payload | combine(certificates_native_payload.stdout | from_json) }}'
  no_log: true
