---
- name: Record staging intent before first certificate creation
  ansible.builtin.copy:
    dest: '{{ certificates_state_path }}'
    content: '{{ certificates_state | to_json(sort_keys=true) }}'
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Declare staging without enabling production issuance
  ansible.builtin.import_tasks: native-application.yml
  vars:
    certificates_production: false

- name: Require issued staging certificate and its controller-owned Secret
  ansible.builtin.import_tasks: native-certificate.yml
  vars:
    certificates_requested: {key: staging, name: cloudlab-staging, namespace: cert-manager}

- name: Record successful staging before production can start
  no_log: true
  block:
    - name: Select the completed staging identity and next phase
      ansible.builtin.set_fact:
        certificates_state: '{{ certificates_state | combine({"staging": certificates_observed.staging, "phase": "production"}) }}'
    - name: Atomically record staging completion
      ansible.builtin.copy:
        dest: '{{ certificates_state_path }}'
        content: '{{ certificates_state | to_json(sort_keys=true) }}'
        owner: root
        group: root
        mode: '0600'
