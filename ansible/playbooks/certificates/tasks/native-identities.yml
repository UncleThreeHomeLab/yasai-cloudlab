---
- name: Read all retained certificate and TLS Secret identities
  ansible.builtin.include_tasks: native-certificate.yml
  loop:
    - {key: staging, name: cloudlab-staging, namespace: cert-manager}
    - {key: public, name: cloudlab-gateway, namespace: cloudlab-gateway-public}
    - {key: private, name: cloudlab-gateway, namespace: cloudlab-gateway-private}
  loop_control:
    loop_var: certificates_requested

- name: Require the recorded staging identity before acceptance
  ansible.builtin.assert:
    that: certificates_observed.staging == certificates_state.staging
    fail_msg: Staging certificate or TLS Secret identity changed.
    quiet: true
  no_log: true

- name: Read the retained ACME account Secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: cert-manager
    name: 'cloudlab-acme-{{ item }}'
  loop: [staging, production]
  register: certificates_account_secrets
  no_log: true

- name: Require both retained account credentials to exist
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].data | default({}) | length > 0
    quiet: true
  loop: '{{ certificates_account_secrets.results }}'
  no_log: true

- name: Select retained gateway identities and an empty account comparison
  ansible.builtin.set_fact:
    certificates_gateways:
      public: '{{ certificates_observed.public }}'
      private: '{{ certificates_observed.private }}'
    certificates_accounts: {}
    certificates_record_acceptance: "{{ certificates_state.phase != 'accepted' }}"
  no_log: true

- name: Compare account identities and credential hashes without exporting keys
  ansible.builtin.set_fact:
    certificates_accounts: >-
      {{ certificates_accounts | combine({item.item: {'uid': item.resources[0].metadata.uid,
         'content': item.resources[0].data | to_json(sort_keys=true) | hash('sha256')}}) }}
  loop: '{{ certificates_account_secrets.results }}'
  no_log: true

- name: Refuse replaced account credentials or gateway identities
  ansible.builtin.assert:
    that:
      - certificates_state.accounts | default(certificates_accounts) == certificates_accounts
      - certificates_state.identities | default(certificates_gateways) == certificates_gateways
    fail_msg: Certificate account credential or gateway identity changed; preserve issued credentials and review recovery.
    quiet: true
  no_log: true

- name: Record accepted issuance only after all retained identities pass
  when: certificates_record_acceptance
  no_log: true
  block:
    - name: Select accepted certificate ownership
      ansible.builtin.set_fact:
        certificates_state: >-
          {{ certificates_state | combine({'phase': 'accepted', 'identities': certificates_gateways,
             'accounts': certificates_accounts}) }}
    - name: Atomically record accepted certificate ownership
      ansible.builtin.copy:
        dest: '{{ certificates_state_path }}'
        content: '{{ certificates_state | to_json(sort_keys=true) }}'
        owner: root
        group: root
        mode: '0600'
