---
- name: Wait for any previous certificate Application operation to complete
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-certificates
  register: certificates_previous_operation
  until:
    - >-
      certificates_previous_operation.resources | length == 0 or
      not certificates_previous_operation.resources[0].operation | default({})
  retries: 60
  delay: 5
  no_log: true

- name: Declare only the retained certificate Application
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: '{{ certificates_owner }}'
      force_conflicts: false
    definition: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/application.yml.j2') | from_yaml }}"
  no_log: true

- name: Read the declared Application identity
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-certificates
  register: certificates_declared
  no_log: true

- name: Require any previously retained Application identity
  ansible.builtin.assert:
    that:
      - >-
        not certificates_state.application_uid | default('') or
        certificates_declared.resources[0].metadata.uid == certificates_state.application_uid
    quiet: true
  no_log: true

- name: Select whether the Application UID needs a durable record
  ansible.builtin.set_fact:
    certificates_record_uid: '{{ certificates_state.application_uid | default("") != certificates_declared.resources[0].metadata.uid }}'
  no_log: true

- name: Retain the Application UID before controller convergence
  when: certificates_record_uid
  no_log: true
  block:
    - name: Select the retained Application identity
      ansible.builtin.set_fact:
        certificates_state: '{{ certificates_state | combine({"application_uid": certificates_declared.resources[0].metadata.uid}) }}'
    - name: Atomically record the retained Application identity
      ansible.builtin.copy:
        dest: '{{ certificates_state_path }}'
        content: '{{ certificates_state | to_json(sort_keys=true) }}'
        owner: root
        group: root
        mode: '0600'

- name: Select the current identity for any following issuance stage
  ansible.builtin.set_fact:
    certificates_current: '{{ certificates_declared.resources[0] }}'
  no_log: true

- name: Require exact published certificate convergence
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cloudlab-certificates
  register: certificates_application_ready
  until:
    - certificates_application_ready.resources | length == 1
    - certificates_application_ready.resources[0].metadata.uid == certificates_state.application_uid
    - certificates_application_ready.resources[0].status.sync.status | default('') == 'Synced'
    - certificates_application_ready.resources[0].status.sync.revision | default('') == certificates_source.revision
    - certificates_application_ready.resources[0].status.sync.comparedTo.source == certificates_application_ready.resources[0].spec.source
    - certificates_application_ready.resources[0].status.health.status | default('') == 'Healthy'
    - not certificates_application_ready.resources[0].operation | default({})
    - certificates_application_ready.resources[0].status.operationState.phase | default('Succeeded') == 'Succeeded'
    - >-
      certificates_application_ready.resources[0].status.conditions | default([])
      | selectattr('type', 'search', 'Error$') | list | length == 0
  retries: 180
  delay: 5
  no_log: true
