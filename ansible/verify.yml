---
- name: Verify each node and its encrypted transport
  hosts: k3s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    wireguard_peer_address: "{{ hostvars[wireguard_peer_host]['wireguard_address'] }}"
  tasks:
    - name: Derive the node identity
      ansible.builtin.include_role:
        name: host
        tasks_from: identity
    - name: Verify independent host access
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: verify
      when: tailscale_enabled | bool
    - name: Verify each component on its host
      ansible.builtin.include_role:
        name: "{{ component_role }}"
        tasks_from: verify
      loop: [wireguard, firewall, k3s, longhorn_host]
      loop_control:
        loop_var: component_role

- name: Verify cluster readiness and cross-component behavior
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify Kubernetes readiness
      ansible.builtin.include_role:
        name: k3s
        tasks_from: verify_cluster
    - name: Run disposable integration checks
      ansible.builtin.include_role:
        name: cluster_checks
    - name: Verify External Secrets and CloudLab vault access
      ansible.builtin.include_role:
        name: external_secrets
        tasks_from: verify
    - name: Accept the Longhorn owner after disposable restore checks
      ansible.builtin.include_role:
        name: longhorn
        tasks_from: verify
      when: longhorn_gitops_enabled | bool
    - name: Verify consistent local capture without cloud writes
      ansible.builtin.include_role:
        name: recovery
        tasks_from: verify
    - name: Verify B2 credential migration after successful backup restoration
      ansible.builtin.include_role:
        name: longhorn_backup
        tasks_from: verify
      when: longhorn_backup_enabled | bool
    - name: Observe foundation controllers without restarts or rollouts for sixty seconds
      ansible.builtin.command:
        argv: [python3, '-']
        stdin: "{{ lookup('file', '../verification/integration/controller_stability.py') }}"
      register: controller_stability
      changed_when: false
      no_log: true
    - name: Report only the sanitized controller stability result
      ansible.builtin.debug:
        msg: '{{ controller_stability.stdout | from_json }}'
    - name: Verify public GitOps convergence and authorization
      ansible.builtin.include_role:
        name: gitops
        tasks_from: verify
