---
- name: Verify each node and its encrypted transport
  hosts: k3s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    wireguard_peer_address: "{{ hostvars[wireguard_peer_host]['wireguard_address'] }}"
  tasks:
    - name: Derive the node identity
      ansible.builtin.include_role:
        name: host
        tasks_from: identity
    - name: Verify synchronized host clocks
      ansible.builtin.include_role:
        name: host
        tasks_from: clock
    - name: Verify independent host access
      ansible.builtin.include_role:
        name: tailscale
        tasks_from: verify
      when: tailscale_enabled | bool
    - name: Verify each component on its host
      ansible.builtin.include_role:
        name: "{{ component_role }}"
        tasks_from: verify
      loop: [wireguard, firewall, k3s, longhorn_host]
      loop_control:
        loop_var: component_role

- name: Verify cluster readiness and cross-component behavior
  hosts: k3s_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify Kubernetes readiness
      ansible.builtin.include_role:
        name: k3s
        tasks_from: verify_cluster
    - name: Run disposable integration checks
      ansible.builtin.include_role:
        name: cluster_checks
    - name: Verify External Secrets and CloudLab vault access
      ansible.builtin.include_role:
        name: external_secrets
        tasks_from: verify
    - name: Accept the Longhorn owner after disposable restore checks
      ansible.builtin.include_role:
        name: longhorn
        tasks_from: verify
      when: longhorn_gitops_enabled | bool
    - name: Verify consistent local capture without cloud writes
      ansible.builtin.include_role:
        name: recovery
        tasks_from: verify
    - name: Verify B2 credential migration after successful backup restoration
      ansible.builtin.include_role:
        name: longhorn_backup
        tasks_from: verify
      when: longhorn_backup_enabled | bool
    - name: Observe foundation controllers without restarts or rollouts for sixty seconds
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '-', 'kube-system', 'external-secrets', 'longhorn-system']
             + (['cert-manager'] if certificates_enabled | bool else [])
             + (['istio-system', 'cloudlab-gateway-public', 'cloudlab-gateway-private'] if mesh_enabled | bool else [])
             + (['cloudlab-observability'] if observability_enabled | bool else [])
             + (['cloudlab-harbor'] if harbor_enabled | bool else []) }}
        stdin: "{{ lookup('file', '../verification/integration/controller_stability.py') }}"
      register: controller_stability
      changed_when: false
      no_log: true
    - name: Report only the sanitized controller stability result
      ansible.builtin.debug:
        msg: '{{ controller_stability.stdout | from_json }}'
    - name: Verify public GitOps convergence and authorization
      ansible.builtin.include_role:
        name: gitops
        tasks_from: verify
    - name: Verify application data and coordinated local recovery
      ansible.builtin.include_role:
        name: application_data
        tasks_from: verify
      when: data_enabled | bool

    - name: Verify configured application services and their authorization boundaries
      ansible.builtin.include_role:
        name: services
        tasks_from: verify
      when: services_enabled | bool

    - name: Verify telemetry ownership, local storage and correlated service signals
      ansible.builtin.include_role:
        name: observability
        tasks_from: verify
      when: observability_enabled | bool

    - name: Verify private registry ownership and current isolated recovery
      ansible.builtin.include_role:
        name: harbor
        tasks_from: verify
        apply: {tags: [harbor]}
      tags: [harbor]
      when: harbor_enabled | bool

- name: Verify Harbor from both node host networks
  hosts: k3s_cluster
  tags: [harbor]
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Resolve published Harbor host verification inputs
      ansible.builtin.command: python -m automation.harbor.payload
      args: {chdir: /workspace}
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      no_log: true
      register: harbor_host_payload
      when: harbor_enabled | bool

    - name: Check each host resolver and HTTPS registry challenge
      ansible.builtin.command:
        argv: [python3, -c, "{{ lookup('file', '../automation/harbor/host_verify.py') }}"]
        stdin: '{{ harbor_host_payload.stdout }}'
      register: harbor_host_verified
      changed_when: false
      no_log: true
      when: harbor_enabled | bool

    - name: Report sanitized node registry reachability
      ansible.builtin.debug:
        msg: '{{ harbor_host_verified.stdout | from_json }}'
      when: harbor_enabled | bool
