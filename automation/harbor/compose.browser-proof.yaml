name: cloudlab-harbor-browser-fixture
services:
  proof:
    platform: linux/amd64
    build: ../runner
    entrypoint: [python, -m, automation.harbor.browser_proof]
    working_dir: /workspace
    volumes:
      - ../:/workspace/automation:ro
      - ../../platform/harbor:/workspace/platform/harbor:ro
    tmpfs:
      - /fixture:mode=0700,size=256m,exec
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
