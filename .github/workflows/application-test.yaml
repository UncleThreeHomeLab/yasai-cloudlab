name: Application tests
"on":
  workflow_call:
    inputs:
      application: {required: true, type: string}
permissions: {contents: read}
concurrency:
  group: test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ format('cloudlab-{0}', inputs.application) }}
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - name: Check out the eligible application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run the application's container tests with rootless BuildKit
        shell: bash
        run: |
          set -euo pipefail
          buildctl --addr tcp://127.0.0.1:1234 build \
            --frontend dockerfile.v0 \
            --local context=. --local dockerfile=. \
            --opt target=test --opt platform=linux/amd64
