name: Application tests
"on":
  workflow_call:
    inputs:
      application: {required: true, type: string}
permissions: {contents: read, pull-requests: read}
concurrency:
  group: test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ format('cloudlab-{0}', inputs.application) }}
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: Check out the eligible application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run the application's direct tests offline
        shell: bash
        run: cloudlab-test --source . -- sh deploy/testing/run_tests.sh
