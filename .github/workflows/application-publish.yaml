name: Application publishing
"on":
  workflow_call:
    inputs:
      application: {required: true, type: string}
permissions: {contents: read, pull-requests: read, id-token: write}
concurrency:
  group: publish-${{ github.repository }}-${{ inputs.application }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ format('cloudlab-{0}-publish', inputs.application) }}
    timeout-minutes: 25
    permissions: {contents: read, pull-requests: read, id-token: write}
    steps:
      - name: Read the approved publishing revision
        id: platform
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          import json, os, re
          from pathlib import Path
          identity = json.loads(Path('/run/cloudlab-publisher/config/config.json').read_text())['workflow_identity']
          revision = identity.removeprefix('https://github.com/UncleThreeHomeLab/yasai-cloudlab/.github/workflows/application-publish.yaml@')
          if not re.fullmatch('[a-f0-9]{40}', revision):
              raise SystemExit('Invalid approved publishing revision')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PY
      - name: Check out the reviewed publishing implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: UncleThreeHomeLab/yasai-cloudlab
          ref: ${{ steps.platform.outputs.revision }}
          path: platform
          persist-credentials: false
      - name: Check out the eligible application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: application
          persist-credentials: false
      - name: Build scan sign and propose the application digest
        shell: bash
        run: python3 -I -S platform/ansible/playbooks/ci/files/publisher.py
