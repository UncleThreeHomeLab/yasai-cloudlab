---
- name: Test cross-node services in a disposable namespace
  block:
    - name: Create a unique verification namespace
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, create, -f, '-', '-o', json]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Namespace',
              'metadata': {'generateName': 'cloudlab-verify-'}} | to_json }}
      register: smoke_namespace_created
      changed_when: true

    - name: Save the namespace owned by this verification
      ansible.builtin.set_fact:
        smoke_namespace: "{{ (smoke_namespace_created.stdout | from_json).metadata.name }}"

    - name: Create one HTTP test pod on each node
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, create, '-n', "{{ smoke_namespace }}", '-f', '-']
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Pod',
              'metadata': {'name': item, 'labels': {'app': item}},
              'spec': {'nodeName': hostvars[item]['lab_node_name'],
                'restartPolicy': 'Never', 'activeDeadlineSeconds': 300,
                'containers': [{'name': 'http', 'image': smoke_image,
                  'command': ['sh', '-ec', 'mkdir -p /www; echo ' ~ item ~ ' > /www/index.html; exec httpd -f -p 8080 -h /www'],
                  'readinessProbe': {'httpGet': {'path': '/', 'port': 8080}, 'periodSeconds': 2},
                  'resources': {'requests': {'cpu': '10m', 'memory': '16Mi'},
                                'limits': {'cpu': '100m', 'memory': '32Mi'}}}]}}
             | to_json }}
      loop: "{{ groups['k3s_cluster'] }}"
      changed_when: true

    - name: Create a ClusterIP service for each node's test pod
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, create, '-n', "{{ smoke_namespace }}", '-f', '-']
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Service',
              'metadata': {'name': item},
              'spec': {'selector': {'app': item},
                       'ports': [{'port': 80, 'targetPort': 8080}]}} | to_json }}
      loop: "{{ groups['k3s_cluster'] }}"
      changed_when: true

    - name: Wait for both test pods
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, wait, pods, '--all', '-n', "{{ smoke_namespace }}", '--for=condition=Ready', '--timeout=180s']
      changed_when: false

    - name: Prove DNS and HTTP work from each node to the other node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - exec
          - -n
          - "{{ smoke_namespace }}"
          - "{{ item }}"
          - --
          - sh
          - -ec
          - "nslookup kubernetes.default.svc.cluster.local >/dev/null; wget -qO- -T 10 http://{{ hostvars[item]['wireguard_peer_host'] }}"
      loop: "{{ groups['k3s_cluster'] }}"
      register: smoke_http
      until: smoke_http.rc == 0
      retries: 5
      delay: 3
      changed_when: false
      failed_when: smoke_http.rc != 0 or smoke_http.stdout | trim != hostvars[item]['wireguard_peer_host']
  always:
    - name: Show the test pod state for diagnostics
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, get, pods, '-n', "{{ smoke_namespace }}"]
      register: smoke_pod_state
      when: smoke_namespace is defined
      changed_when: false
      failed_when: false

    - name: Show verification workload results
      ansible.builtin.debug:
        msg: "{{ smoke_pod_state.stdout_lines | default([]) }}"

    - name: Delete only this run's verification namespace and workloads
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, delete, namespace, "{{ smoke_namespace }}", '--ignore-not-found=true', '--wait=true', '--timeout=90s']
      when: smoke_namespace is defined
      changed_when: true
