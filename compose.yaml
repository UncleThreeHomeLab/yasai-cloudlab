services:
  lab:
    platform: linux/amd64
    build:
      context: ./automation/runner
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: ssh_known_hosts
        target: /state
      - type: volume
        source: recovery_outputs
        target: /recovery
    command: [apply]

  infra:
    profiles: [infra]
    platform: linux/amd64
    build:
      context: ./automation/runner
    entrypoint: [python, -m, automation.infra.command]
    working_dir: /workspace
    volumes:
      - type: bind
        source: ./automation
        target: /workspace/automation
        read_only: true
      - type: bind
        source: ./infra
        target: /workspace/infra
        read_only: true
      - type: bind
        source: ./.git
        target: /workspace/.git
        read_only: true
      - type: bind
        source: ./compose.yaml
        target: /workspace/compose.yaml
        read_only: true
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-./.infra-private}
        target: /inputs
        read_only: true
      - type: volume
        source: infra_work
        target: /infra-work
    command: [check, cloudflare]

volumes:
  infra_work:
  ssh_known_hosts:
  recovery_outputs:
