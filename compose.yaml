services:
  ci-controller-image:
    profiles: [ci]
    platform: linux/amd64
    image: yasai-cloudlab-ci-controller:local
    build:
      context: ./platform/delivery/ci
      target: controller
      additional_contexts:
        cloudlab-bootstrap: ./ansible/runner

  ci-builder-image:
    profiles: [ci]
    platform: linux/amd64
    image: yasai-cloudlab-ci-builder:local
    build:
      context: ./platform/delivery/ci
      target: builder
      additional_contexts:
        cloudlab-bootstrap: ./ansible/runner

  ci-bootstrap:
    profiles: [ci]
    extends: {service: infra-harbor}
    entrypoint: [python, -m, playbooks.ci.files.bootstrap]
    working_dir: /workspace
    command: []

  ci-qualify:
    profiles: [ci]
    extends: {service: infra-harbor}
    entrypoint: [python, /opt/runner/run.py, ci-bootstrap-check]
    command: []

  ci-signing:
    profiles: [ci]
    extends: {service: infra-harbor}
    entrypoint: [python, -m, playbooks.ci.files.signing]
    command: []

  ci-runner-image:
    profiles: [ci]
    platform: linux/amd64
    image: yasai-cloudlab-ci-runner:local
    build:
      context: ./platform/delivery/ci
      target: runner
      additional_contexts:
        cloudlab-bootstrap: ./ansible/runner

  lab:
    platform: linux/amd64
    build: &lab-build
      context: ./ansible/runner
      additional_contexts:
        ci-source: ./platform/delivery/ci
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: ssh_known_hosts
        target: /state
      - type: volume
        source: recovery_outputs
        target: /recovery
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/cloudflare
        target: /inputs/cloudflare
        read_only: true
      - type: volume
        source: infra_work
        target: /infra-work
    command: [setup]

  infra:
    profiles: [infra]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, /opt/runner/run.py, infra]
    working_dir: /workspace/ansible
    volumes:
      - type: bind
        source: ./ansible
        target: /workspace/ansible
        read_only: true
      - type: bind
        source: ./infra
        target: /workspace/infra
        read_only: true
      - type: bind
        source: ./charts/service
        target: /workspace/charts/service
        read_only: true
      - type: bind
        source: ./.git
        target: /workspace/.git
        read_only: true
      - type: bind
        source: ./.gitignore
        target: /workspace/.gitignore
        read_only: true
      - type: bind
        source: ./.gitattributes
        target: /workspace/.gitattributes
        read_only: true
      - type: bind
        source: ./compose.yaml
        target: /workspace/compose.yaml
        read_only: true
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/cloudflare
        target: /inputs/cloudflare
        read_only: true
      - type: volume
        source: infra_work
        target: /infra-work
    command: [check, cloudflare]

  infra-github:
    profiles: [infra]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, /opt/runner/run.py, infra]
    working_dir: /workspace/ansible
    volumes:
      - type: bind
        source: ./ansible
        target: /workspace/ansible
        read_only: true
      - type: bind
        source: ./infra
        target: /workspace/infra
        read_only: true
      - type: bind
        source: ./.git
        target: /workspace/.git
        read_only: true
      - type: bind
        source: ./.gitignore
        target: /workspace/.gitignore
        read_only: true
      - type: bind
        source: ./.gitattributes
        target: /workspace/.gitattributes
        read_only: true
      - type: bind
        source: ./compose.yaml
        target: /workspace/compose.yaml
        read_only: true
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/github
        target: /inputs/github
        read_only: true
      - type: volume
        source: github_infra_work
        target: /infra-work
    command: [check, github]

  infra-harbor:
    profiles: [infra]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, /opt/runner/run.py, infra-harbor]
    working_dir: /workspace/ansible
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: ssh_known_hosts
        target: /state
        read_only: true
      - type: volume
        source: harbor_infra_work
        target: /infra-work
    command: [check]

  service:
    profiles: [services]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, -m, playbooks.services.files.command]
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./docs/local
        target: /workspace/docs/local
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/cloudflare
        target: /inputs/cloudflare
      - type: volume
        source: infra_work
        target: /infra-work
      - type: volume
        source: ssh_known_hosts
        target: /state
      - type: volume
        source: recovery_outputs
        target: /recovery
    command: [check]

volumes:
  harbor_infra_work:
  infra_work:
  github_infra_work:
  ssh_known_hosts:
  recovery_outputs:
