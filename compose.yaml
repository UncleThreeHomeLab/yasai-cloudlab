services:
  ci-controller-image:
    profiles: [ci]
    platform: linux/amd64
    image: yasai-cloudlab-ci-controller:local
    build:
      context: ./platform/delivery/ci
      target: controller
      additional_contexts:
        cloudlab-bootstrap: ./ansible/runner

  ci-builder-image:
    profiles: [ci]
    platform: linux/amd64
    image: yasai-cloudlab-ci-builder:local
    build:
      context: ./platform/delivery/ci
      target: builder
      additional_contexts:
        cloudlab-bootstrap: ./ansible/runner

  ci-runner-image:
    profiles: [ci]
    platform: linux/amd64
    image: yasai-cloudlab-ci-runner:local
    build:
      context: ./platform/delivery/ci
      target: runner
      additional_contexts:
        cloudlab-bootstrap: ./ansible/runner

  lab:
    platform: linux/amd64
    build: &lab-build
      context: ./ansible/runner
      additional_contexts:
        ci-source: ./platform/delivery/ci
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: ssh_known_hosts
        target: /state
      - type: volume
        source: recovery_outputs
        target: /recovery
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/cloudflare
        target: /inputs/cloudflare
        read_only: true
      - type: volume
        source: infra_work
        target: /infra-work
    command: [setup]

  connectivity:
    profiles: [connectivity]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, -m, playbooks.access.files.reconcile]
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/cloudflare
        target: /inputs/cloudflare
        read_only: true
      - type: volume
        source: infra_work
        target: /infra-work
      - type: volume
        source: ssh_known_hosts
        target: /state
        read_only: true
    command: [loop]

  infra-github:
    profiles: [infra]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, /workspace/infra/github-workflows/reconcile.py]
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/github
        target: /inputs/github
        read_only: true
      - type: volume
        source: github_infra_work
        target: /infra-work
    environment:
      GOVERNANCE_INTERVAL: ${GOVERNANCE_INTERVAL:-300}
    command: [loop]

  infra-harbor:
    profiles: [infra]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, /workspace/infra/harbor/reconcile.py]
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ${INFRA_PRIVATE_DIR:-../yasai-cloudlab-infra-inputs}/harbor
        target: /inputs/harbor
        read_only: true
      - type: volume
        source: ssh_known_hosts
        target: /state
        read_only: true
      - type: volume
        source: harbor_infra_work
        target: /infra-work
    environment:
      HARBOR_INTERVAL: ${HARBOR_INTERVAL:-300}
    command: [loop]

  credential-reconciler:
    profiles: [credentials]
    platform: linux/amd64
    build: *lab-build
    entrypoint: [python, -m, playbooks.secrets.files.reconcile]
    working_dir: /workspace/ansible
    restart: unless-stopped
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ${PRIVATE_CONFIG_DIR:-../cloudlab-config}
        target: /private-config
        read_only: true
      - type: volume
        source: reconciler_state
        target: /reconciler-state
    environment:
      PRIVATE_CONFIG_DIR: /private-config
      CLOUDLAB_STATE_DIR: /reconciler-state
    command: [--interval, '600']

volumes:
  harbor_infra_work:
  infra_work:
  github_infra_work:
  ssh_known_hosts:
  recovery_outputs:
  reconciler_state:
