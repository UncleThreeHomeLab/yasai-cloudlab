repository: https://github.com/UncleThreeHomeLab/yasai-cloudlab.git
revision: main
namespace: argocd
publicNamespace: cloudlab-public
externalSecrets:
  # Enable only after bounded bootstrap has recorded its writer-release receipt.
  enabled: true
  # Publish false before `lab eso-recover`; restore true to resume Argo ownership.
  reconcile: true
longhorn:
  # Enable only after the attached-volume handoff records writer release.
  enabled: true
  reconcile: true
longhornBackup:
  enabled: false
  reconcile: true
