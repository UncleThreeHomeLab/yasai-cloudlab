{{- $installation := .Values.identity.application }}
{{- $supported := list "526891f62eb9b9a50a0ffaf6ef020269d09e7746" "a0a42ac02b0d351a4c56cf40e88f697f3537f19a" "7b05e2139f94a84f4c4f92734ba8ad45a8a7f4a5" }}
{{- if or (not (kindIs "string" $installation.installationRevision)) (not (has $installation.installationRevision $supported)) (not (kindIs "slice" $installation.supportedInstallationRevisions)) }}{{ fail "Unsupported identity installation revision" }}{{ end }}
{{- if or (ne (len $installation.supportedInstallationRevisions) 3) (not (has (index $supported 0) $installation.supportedInstallationRevisions)) (not (has (index $supported 1) $installation.supportedInstallationRevisions)) (not (has (index $supported 2) $installation.supportedInstallationRevisions)) }}{{ fail "Unsupported identity installation revisions" }}{{ end }}
{{- if and .Values.identity.enabled .Values.identity.application.enabled (hasKey .Values.identity "argo") }}
{{- if or (not .Values.externalSecrets.enabled) (not .Values.externalSecrets.reconcile) }}{{ fail "Native identity installation requires External Secrets" }}{{ end }}
{{- $target := .Values.identity.argo }}
{{- if not (kindIs "map" $target) }}{{ fail "Native identity installation requires its immutable accepted binding" }}{{ end }}
{{- if or (ne (len $target) 2) (not (kindIs "string" $target.valuesRepository)) (not (kindIs "string" $target.valuesRevision)) }}{{ fail "Native identity installation requires its immutable accepted binding" }}{{ end }}
{{- if or (not (regexMatch "^[a-f0-9]{40}$" $target.valuesRevision)) (not (regexMatch "^https://github[.]com/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+[.]git$" $target.valuesRepository)) (eq (lower $target.valuesRepository) (lower .Values.repository)) }}{{ fail "Native identity installation requires its immutable accepted binding" }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-identity-installation-source
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-identity-installation-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-identity
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - merge:
        mergeKeys: [installationRevision]
        generators:
          - list:
              elements:
                - installationRevision: 526891f62eb9b9a50a0ffaf6ef020269d09e7746
          - git:
              repoURL: {{ .Values.identity.argo.valuesRepository | quote }}
              revision: {{ .Values.identity.argo.valuesRevision | quote }}
              files: [{path: identity/keycloak-values.yaml}]
  syncPolicy: {applicationsSync: create-update, preserveResourcesOnDeletion: true}
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/sources/0/helm/valuesObject/maintenance
        - /spec/sources/0/helm/valuesObject/operation
        - /spec/sources/0/helm/valuesObject/bootstrapAdminEnabled
        - /spec/sources/0/helm/valuesObject/retiredEmergencyItem
  template:
    metadata:
      name: cloudlab-identity
      namespace: argocd
      labels: {cloudlab.io/owner: cloudlab-identity-bootstrap}
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      project: cloudlab-identity
{{- $catalogPath := include "cloudlab.serviceCatalogPath" . }}
      sources:
        - repoURL: https://github.com/UncleThreeHomeLab/yasai-cloudlab.git
          targetRevision: {{ $installation.installationRevision | quote }}
          path: platform/identity/keycloak
          helm:
            releaseName: cloudlab-identity
            valueFiles:
              - {{ printf "$identityValues/%s" $catalogPath | quote }}
              - $identityValues/platform/access/policy.yaml
              # databaseCA rides its generator file verbatim; quoted slots would fold the PEM newlines.
              - $identityValues/identity/keycloak-values.yaml
              - $publicValues/services/exposures.yaml
            valuesObject:
              enabled: true
              operatorEnabled: false
              serverEnabled: true
              reconciliationEnabled: true
              bootstrapMode: false
              primaryAdminEnabled: false
              privateStateEnabled: true
              bootstrapAdminEnabled: false
              maintenance: false
              telemetryEnabled: {{ .Values.observability.enabled }}
              loginHost: '{{ "{{ .loginHost }}" }}'
              adminHost: '{{ "{{ .adminHost }}" }}'
              database: '{{ "{{ .database }}" }}'
              databaseRole: '{{ "{{ .databaseRole }}" }}'
              databaseHost: '{{ "{{ .databaseHost }}" }}'
              databasePort: '{{ "{{ .databasePort }}" }}'
              trustedProxyAddresses: '{{ "{{ join \",\" .trustedProxyAddresses }}" }}'
              retiredEmergencyItem: '{{ "{{ .retiredEmergencyItem }}" }}'
        - repoURL: {{ $target.valuesRepository | quote }}
          targetRevision: {{ $target.valuesRevision | quote }}
          ref: identityValues
        - repoURL: {{ .Values.repository | quote }}
          targetRevision: {{ $installation.installationRevision | quote }}
          ref: publicValues
      destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-identity}
      syncPolicy:
        automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
        syncOptions: [FailOnSharedResource=true, ClientSideApplyMigration=false, RespectIgnoreDifferences=true]
        retry: {limit: 5, backoff: {duration: 30s, factor: 2, maxDuration: 2m}}
  templatePatch: |
{{ .Files.Get "keycloak-values.tmpl" | indent 4 }}
{{- end }}
