{{- if (.Values.ci | default dict).enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-ci, namespace: argocd}
spec:
  description: Trusted repository runner controllers and bounded ephemeral builds.
  sourceRepos: [{{ .Values.repository | quote }}]
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: cloudlab-ci-system}
    - {server: 'https://kubernetes.default.svc', namespace: cloudlab-ci-private}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    {{- range $kind := list "ConfigMap" "Secret" "ServiceAccount" "ResourceQuota" "LimitRange" }}
    - {group: '', kind: {{ $kind }}}
    {{- end }}
    - {group: apps, kind: Deployment}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    {{- range $kind := list "AutoscalingRunnerSet" "AutoscalingListener" "EphemeralRunnerSet" "EphemeralRunner" }}
    - {group: actions.github.com, kind: {{ $kind }}}
    {{- end }}
{{- end }}
