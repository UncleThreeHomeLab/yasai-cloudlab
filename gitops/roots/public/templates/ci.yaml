{{- if (.Values.ci | default dict).enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-ci, namespace: argocd}
spec:
  description: Trusted repository runner controllers and bounded ephemeral builds.
  sourceRepos:
    - {{ .Values.repository | quote }}
    {{- if .Values.identity.argo }}
    - {{ .Values.identity.argo.valuesRepository | quote }}
    {{- end }}
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: argocd}
    - {server: 'https://kubernetes.default.svc', namespace: cloudlab-ci-system}
    - {server: 'https://kubernetes.default.svc', namespace: cloudlab-ci-private}
    - {server: 'https://kubernetes.default.svc', namespace: 'cloudlab-ci-public-*'}
    - {server: 'https://kubernetes.default.svc', namespace: 'cloudlab-ci-private-*'}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    {{- range $kind := list "ConfigMap" "Secret" "ServiceAccount" "ResourceQuota" "LimitRange" }}
    - {group: '', kind: {{ $kind }}}
    {{- end }}
    - {group: apps, kind: Deployment}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: argoproj.io, kind: ApplicationSet}
    {{- range $kind := list "AutoscalingRunnerSet" "AutoscalingListener" "EphemeralRunnerSet" "EphemeralRunner" }}
    - {group: actions.github.com, kind: {{ $kind }}}
    {{- end }}
{{- if .Values.identity.argo }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-ci-source
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-ci-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-ci
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
{{- range $component := list "controller" "pool" }}
{{- if or (eq $component "controller") $.Values.ci.poolEnabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-ci-{{ $component }}
  namespace: argocd
  labels: {cloudlab.io/owner: ci-platform}
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - git:
        repoURL: {{ $.Values.identity.argo.valuesRepository | quote }}
        revision: main
        files: [{path: platform/ci/config.json}]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: cloudlab-ci-{{ $component }}
      labels: {cloudlab.io/owner: ci-platform}
    spec:
      project: cloudlab-ci
      sources:
        - repoURL: {{ $.Values.repository | quote }}
          targetRevision: {{ $.Values.revision | quote }}
          path: platform/delivery/ci/{{ $component }}
          helm:
            releaseName: cloudlab-ci-{{ $component }}
            valueFiles: [values.json, '$values/platform/ci/config.json']
            parameters:
              {{- if eq $component "controller" }}
              - name: applicationCapacity
                value: {{ $.Values.ci.applicationCapacity | default 2 | quote }}
              - name: arc.image.repository
                value: '{{ "{{ index (splitList \"@\" .images.controller) 0 }}" }}'
              - name: arc.image.tag
                value: '{{ "0.15.0@{{ index (splitList \"@\" .images.controller) 1 }}" }}'
              {{- else }}
              - name: arc.template.spec.containers[0].image
                value: '{{ "{{ .images.runner }}" }}'
              - name: arc.template.spec.initContainers[0].image
                value: '{{ "{{ .images.builder }}" }}'
              {{- end }}
        - repoURL: {{ $.Values.identity.argo.valuesRepository | quote }}
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ if eq $component "controller" }}cloudlab-ci-system{{ else }}cloudlab-ci-private{{ end }}
      syncPolicy:
        automated: {prune: false, selfHeal: true, allowEmpty: false}
        syncOptions: [FailOnSharedResource=true, ServerSideApply=true, ClientSideApplyMigration=false]
{{- end }}
{{- end }}
{{- range $component := list "controller" "runner" "publisher" }}
{{- $pool := ne $component "controller" }}
{{- $publishPool := eq $component "publisher" }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-ci-application-{{ $component }}
  namespace: argocd
  labels: {cloudlab.io/owner: ci-platform}
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ $.Values.identity.argo.valuesRepository | quote }}
              revision: main
              files: [{path: 'platform/ci/applications/*.yaml'}]
          - git:
              repoURL: {{ $.Values.identity.argo.valuesRepository | quote }}
              revision: main
              pathParamPrefix: platform
              files: [{path: 'platform/ci/config.json'}]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'cloudlab-ci-{{ "{{ .application }}" }}-{{ $component }}'
      labels: {cloudlab.io/owner: ci-platform}
      # Registration removal deletes the Application, and this finalizer then
      # deletes its owned pool resources. Bounded: the controller app owns only
      # its watched per-app namespace, pool apps own only namespaced per-app
      # resources, and no PVs or shared data are in scope. A transient source
      # failure cannot trigger this path: generator errors fail closed and keep
      # existing Applications; only a reviewed registration removal converges
      # to deletion.
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: cloudlab-ci
      sources:
        - repoURL: {{ $.Values.repository | quote }}
          targetRevision: {{ $.Values.revision | quote }}
          path: platform/delivery/ci/{{ if eq $component "controller" }}controller{{ else }}pool{{ end }}
          helm:
            releaseName: 'cloudlab-ci-{{ "{{ .application }}" }}-{{ $component }}'
            skipCrds: true
            # Publisher pools layer a publisher overlay over values.json:
            # --set cannot extend lists (it replaces them with sparse nils),
            # so the publisher volumes and mounts live in a value file. The
            # chart pins every entry; keep the files in sync. Manual promotion
            # uses the overlay without the release App mount.
            valueFiles: [values.json{{ if $publishPool }}, '{{ "{{ if and (hasKey . \"publishing\") (hasKey .publishing \"releaseMode\") (eq .publishing.releaseMode \"manual\") }}" }}values-publisher-manual.json{{ "{{ else }}" }}values-publisher.json{{ "{{ end }}" }}'{{ end }}]
            values: |
              component: {{ $component }}
              registration:
                application: '{{ "{{ .application }}" }}'
                source: {{ "{{ .source | toJson }}" }}
                ci: {{ "{{ .ci | toJson }}" }}
                {{ "{{ if hasKey . \"testing\" }}" }}testing: {{ "{{ .testing | toJson }}" }}{{ "{{ end }}" }}
                {{ "{{ if hasKey . \"publishing\" }}" }}publishing: {{ "{{ .publishing | toJson }}" }}{{ "{{ end }}" }}
              images: {{ "{{ .images | toJson }}" }}
              {{- if eq $component "controller" }}
              network: {{ "{{ .network | toJson }}" }}
              manageSystemNamespace: false
              {{- else }}
              arc:
                enabled: {{ if $publishPool }}{{ "{{ and (hasKey .ci.jobs \"publish\") .ci.jobs.publish }}" }}{{ else }}{{ "{{ or .ci.jobs.test (and (hasKey .ci.jobs \"publish\") .ci.jobs.publish) }}" }}{{ end }}
              {{- end }}
            parameters:
              {{- if eq $component "controller" }}
              - name: arc.fullnameOverride
                value: 'cloudlab-{{ "{{ .application }}" }}-controller'
                forceString: true
              - name: arc.serviceAccount.name
                value: 'cloudlab-{{ "{{ .application }}" }}-controller'
                forceString: true
              - name: arc.image.repository
                value: '{{ "{{ index (splitList \"@\" .images.controller) 0 }}" }}'
                forceString: true
              - name: arc.image.tag
                value: '0.15.0@{{ "{{ index (splitList \"@\" .images.controller) 1 }}" }}'
                forceString: true
              - name: arc.flags.watchSingleNamespace
                value: 'cloudlab-ci-{{ "{{ .source.visibility }}" }}-{{ "{{ .application }}" }}'
                forceString: true
              {{- else }}
              - name: arc.controllerServiceAccount.name
                value: 'cloudlab-{{ "{{ .application }}" }}-controller'
                forceString: true
              - name: arc.githubConfigUrl
                value: 'https://github.com/{{ "{{ .source.repository }}" }}'
                forceString: true
              - name: arc.githubConfigSecret
                value: '{{ "{{ if eq .source.visibility \"public\" }}" }}github-arc-public{{ "{{ else }}" }}github-arc{{ "{{ end }}" }}'
                forceString: true
              - name: arc.runnerScaleSetName
                value: 'cloudlab-{{ "{{ .application }}" }}{{ if $publishPool }}-publish{{ end }}'
                forceString: true
              - name: arc.template.spec.containers[0].image
                value: '{{ "{{ .images.runner }}" }}'
                forceString: true
              - name: arc.template.spec.initContainers[0].image
                value: '{{ "{{ .images.builder }}" }}'
                forceString: true
              {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ if eq $component "controller" }}cloudlab-ci-system{{ else }}'cloudlab-ci-{{ "{{ .source.visibility }}" }}-{{ "{{ .application }}" }}'{{ end }}
      syncPolicy:
        automated: {prune: {{ $pool }}, selfHeal: true, allowEmpty: {{ $pool }}}
        syncOptions: [FailOnSharedResource=true, ServerSideApply=true, ClientSideApplyMigration=false]
{{- end }}
{{- end }}
{{- end }}
