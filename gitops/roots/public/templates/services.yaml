{{- define "cloudlab.serviceCatalogPath" -}}
{{- $catalogPath := "services/catalog.json" }}
{{- if hasKey .Values.services "catalogPath" }}{{ $catalogPath = .Values.services.catalogPath }}{{ end }}
{{- if or (not (kindIs "string" $catalogPath)) (gt (len $catalogPath) 128) (not (regexMatch "^services/catalog(-[a-z0-9]+(-[a-z0-9]+)*)?[.](json|yaml)$" $catalogPath)) }}
{{- fail "Service catalog path must be a bounded catalog JSON or YAML file directly under services" }}
{{- end }}
{{- $catalogPath -}}
{{- end }}
{{- if .Values.services.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-services
  namespace: argocd
spec:
  description: Administrator-controlled service namespaces and bounded workload sources.
  sourceRepos:
    - {{ .Values.repository | quote }}
    {{- if .Values.identity.argo }}
    - {{ .Values.identity.argo.valuesRepository | quote }}
    {{- end }}
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: argocd}
    - {server: 'https://kubernetes.default.svc', namespace: 'cloudlab-app-*'}
    - {server: 'https://kubernetes.default.svc', namespace: cloudlab-policy}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: policies.kyverno.io, kind: ValidatingPolicy}
  namespaceResourceWhitelist:
    - {group: '', kind: ResourceQuota}
    - {group: '', kind: ConfigMap}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: security.istio.io, kind: AuthorizationPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: kyverno.io, kind: Policy}
    - {group: argoproj.io, kind: AppProject}
    - {group: argoproj.io, kind: ApplicationSet}
{{- end }}

{{- $servicesAcceptance := .Values.services.acceptanceCommitment }}
{{- if and (hasKey .Values.services "acceptanceCommitment") (not (kindIs "string" $servicesAcceptance)) }}
{{- fail "Service source acceptance commitment must be an empty string or SHA-256" }}
{{- end }}
{{- if and $servicesAcceptance (not (regexMatch "^[a-f0-9]{64}$" $servicesAcceptance)) }}
{{- fail "Service source acceptance commitment must be an empty string or SHA-256" }}
{{- end }}
{{- if and .Values.services.enabled (hasKey .Values.identity "argo") }}
{{- $catalogPath := include "cloudlab.serviceCatalogPath" . }}
{{- if not (regexMatch "^[a-f0-9]{40}$" (.Values.services.revision | default "")) }}
{{- fail "Service catalog requires its reviewed immutable platform revision" }}
{{- end }}
{{- if not (regexMatch "^[a-f0-9]{64}$" ($servicesAcceptance | default "")) }}
{{- fail "Enabled bound service catalog requires a reviewed acceptance commitment" }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-services
  namespace: argocd
  labels: {cloudlab.io/owner: service-platform}
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - merge:
        mergeKeys: [consumer]
        generators:
          - list:
              elements: [{consumer: services}]
          - git:
              repoURL: {{ .Values.identity.argo.valuesRepository | quote }}
              revision: main
              files: [{path: platform/acceptance/services.yaml}]
  syncPolicy: {applicationsSync: create-update, preserveResourcesOnDeletion: true}
  template:
    metadata:
      name: cloudlab-services
      labels: {cloudlab.io/owner: service-platform}
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
        argocd.argoproj.io/tracking-id: cloudlab-public-root:argoproj.io/Application:argocd/cloudlab-services
    spec:
{{- $gate := .Files.Get "consumer-source-acceptance.tmpl" | replace "@@VERSION@@" ("cloudlab-consumer-source-acceptance/v1" | toJson) | replace "@@CONSUMER@@" ("services" | toJson) | replace "@@PRIVATE_REPOSITORY@@" (.Values.identity.argo.valuesRepository | toJson) | replace "@@COMMITMENT@@" ($servicesAcceptance | toJson) | replace "@@PATHS_LF@@" ((printf "%s\nidentity/argo-values.yaml\nplatform/access/policy.yaml" $catalogPath) | toJson) | trim }}
{{- $spec := dict "project" "cloudlab-services" "sources" (list
  (dict "repoURL" .Values.repository "targetRevision" .Values.services.revision "path" "platform/delivery/services" "helm" (dict "valueFiles" (list (printf "$values/%s" $catalogPath) "$values/identity/argo-values.yaml" "$values/platform/access/policy.yaml" "$exposures/services/exposures.yaml") "valuesObject" (dict "repository" .Values.repository "revision" .Values.services.revision "telemetry" .Values.observability.enabled)))
  (dict "repoURL" .Values.identity.argo.valuesRepository "targetRevision" $gate "ref" "values")
  (dict "repoURL" .Values.repository "targetRevision" .Values.services.revision "ref" "exposures"))
  "destination" (dict "server" "https://kubernetes.default.svc" "namespace" "argocd")
  "syncPolicy" (dict "automated" (dict "enabled" true "prune" false "selfHeal" true "allowEmpty" false)
    "syncOptions" (list "FailOnSharedResource=true" "ClientSideApplyMigration=false")) }}
{{ toYaml $spec | indent 6 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-services-source
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-services-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-services
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
{{- end }}
