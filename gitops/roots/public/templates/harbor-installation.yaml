{{- if and .Values.harbor.enabled .Values.harbor.installation.enabled (hasKey .Values.identity "argo") }}
{{- if or (not .Values.externalSecrets.enabled) (not .Values.externalSecrets.reconcile) }}{{ fail "Native Harbor installation requires External Secrets" }}{{ end }}
{{- $target := .Values.identity.argo }}
{{- if not (kindIs "map" $target) }}{{ fail "Native Harbor installation requires its immutable accepted binding" }}{{ end }}
{{- if or (ne (len $target) 2) (not (kindIs "string" $target.valuesRepository)) (not (kindIs "string" $target.valuesRevision)) }}{{ fail "Native Harbor installation requires its immutable accepted binding" }}{{ end }}
{{- if or (not (regexMatch "^[a-f0-9]{40}$" $target.valuesRevision)) (not (regexMatch "^https://github[.]com/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+[.]git$" $target.valuesRepository)) (eq (lower $target.valuesRepository) (lower .Values.repository)) }}{{ fail "Native Harbor installation requires its immutable accepted binding" }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-harbor-installation-source
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-harbor-installation-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-harbor
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]

{{- range $configuration := list false true }}
{{- $name := ternary "cloudlab-harbor-configuration" "cloudlab-harbor" $configuration }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - merge:
        mergeKeys: [installationRevision]
        generators:
          - list:
              elements:
                - installationRevision: d3d639cf80e8cfecebeb756d666a24db92a6bb74
          - git:
              repoURL: {{ $.Values.identity.argo.valuesRepository | quote }}
              revision: {{ $.Values.identity.argo.valuesRevision | quote }}
              files: [{path: platform/harbor.yaml}]
  syncPolicy: {applicationsSync: create-update, preserveResourcesOnDeletion: true}
  ignoreApplicationDifferences:
    - jsonPointers:
      {{- if $configuration }}
        - /spec/source/helm/valuesObject/maintenance
      {{- else }}
        {{- range $component := list "nginx" "portal" "core" "jobservice" "registry" }}
        - /spec/source/helm/valuesObject/harbor/{{ $component }}/replicas
        {{- end }}
        - /spec/source/helm/valuesObject/harbor/database/internal/replicas
        - /spec/source/helm/valuesObject/harbor/redis/internal/replicas
      {{- end }}
  template:
    metadata:
      name: {{ $name }}
      namespace: argocd
      labels: {cloudlab.io/owner: harbor-platform}
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      project: cloudlab-harbor
      source:
        repoURL: {{ $.Values.repository | quote }}
        targetRevision: d3d639cf80e8cfecebeb756d666a24db92a6bb74
        path: {{ ternary "platform/harbor" "platform/harbor/server" $configuration }}
        helm:
          releaseName: cloudlab-harbor
          {{- if not $configuration }}
          valueFiles: [values.json]
          {{- end }}
      destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-harbor}
      syncPolicy:
        automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
        syncOptions: [FailOnSharedResource=true, ServerSideApply=true, DisableClientSideApplyMigration=true]
        retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 1m}}
  templatePatch: |
{{ $.Files.Get "harbor-values.tmpl" | replace "__CONFIGURATION__" (toString $configuration) | indent 4 }}
{{- end }}
{{- end }}
