{{- $permissions := .Values.permissions -}}
{{- if or (not (kindIs "map" $permissions)) (not (kindIs "bool" $permissions.enabled)) -}}
{{- fail "Permissions require a YAML boolean enabled setting" -}}
{{- end -}}
{{- $acceptance := $permissions.acceptanceCommitment -}}
{{- if or (not (kindIs "string" $acceptance)) (and $acceptance (not (regexMatch "^[a-f0-9]{64}$" $acceptance))) -}}
{{- fail "Permissions acceptance commitment must be an empty string or SHA-256" -}}
{{- end -}}
{{- if $permissions.enabled -}}
{{- if or (not (eq .Values.admission.enabled true)) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) (not (regexMatch "^[a-f0-9]{40}$" ($permissions.revision | default ""))) -}}
{{- fail "Permissions require admission, External Secrets and an immutable public revision" -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" $acceptance) -}}
{{- fail "Enabled permissions require a reviewed acceptance commitment" -}}
{{- end -}}
{{- if hasKey .Values.identity "argo" -}}
{{- $private := .Values.identity.argo.valuesRepository -}}
{{- $gate := .Files.Get "consumer-source-acceptance.tmpl" | replace "@@VERSION@@" ("cloudlab-consumer-source-acceptance/v1" | toJson) | replace "@@CONSUMER@@" ("permissions" | toJson) | replace "@@PRIVATE_REPOSITORY@@" ($private | toJson) | replace "@@COMMITMENT@@" ($acceptance | toJson) | replace "@@PATHS_LF@@" ("platform/permissions.yaml" | toJson) | trim -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-permissions-profiles, namespace: {{ .Values.namespace }}}
spec:
  sourceRepos: [{{ .Values.repository | quote }}]
  destinations: [{server: 'https://kubernetes.default.svc', namespace: {{ .Values.namespace }}}]
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: [{group: '', kind: ConfigMap}]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-permissions-profiles
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  project: cloudlab-permissions-profiles
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ $permissions.revision | quote }}
    path: platform/connectivity/permissions
    helm:
      releaseName: cloudlab-permissions-profiles
      valuesObject:
        mode: profiles
        context: {repository: {{ .Values.repository | quote }}, revision: {{ $permissions.revision | quote }}, commitment: {{ $acceptance | quote }}, namespace: {{ .Values.namespace }}}
  destination: {server: 'https://kubernetes.default.svc', namespace: {{ .Values.namespace }}}
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, ClientSideApplyMigration=false]
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-permissions, namespace: {{ .Values.namespace }}}
spec:
  sourceRepos: [{{ .Values.repository | quote }}, {{ $private | quote }}]
  destinations: [{server: 'https://kubernetes.default.svc', namespace: '*'}]
  clusterResourceWhitelist:
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-permissions-source
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-permissions-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ $private | quote }}
        project: cloudlab-permissions
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-permissions
  namespace: {{ .Values.namespace }}
  labels: {cloudlab.io/owner: permissions-platform}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ $private | quote }}
              revision: main
              files: [{path: platform/acceptance/permissions.yaml}]
          - git:
              repoURL: {{ $private | quote }}
              revision: {{ $gate | quote }}
              pathParamPrefix: permissionInput
              files: [{path: platform/permissions.yaml}]
  syncPolicy: {applicationsSync: create-update, preserveResourcesOnDeletion: true}
  template:
    metadata:
      name: cloudlab-permissions
      namespace: {{ .Values.namespace }}
      labels: {cloudlab.io/owner: permissions-platform}
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
        argocd.argoproj.io/tracking-id: {{ printf "cloudlab-public-root:argoproj.io/Application:%s/cloudlab-permissions" .Values.namespace | quote }}
        cloudlab.io/permission-input-version: cloudlab-permissions-input/v2
        cloudlab.io/permission-revision: '{{ "{{ .revision }}" }}'
        cloudlab.io/permission-commitment: {{ $acceptance | quote }}
        cloudlab.io/permission-public-revision: {{ $permissions.revision | quote }}
    spec:
{{- $spec := dict "project" "cloudlab-permissions" "source"
  (dict "repoURL" .Values.repository "targetRevision" $permissions.revision "path" "platform/connectivity/permissions" "helm" (dict "releaseName" "cloudlab-permissions"))
  "destination" (dict "server" "https://kubernetes.default.svc" "namespace" .Values.namespace)
  "syncPolicy" (dict "automated" (dict "enabled" true "prune" true "selfHeal" true "allowEmpty" false)
    "syncOptions" (list "FailOnSharedResource=true" "ClientSideApplyMigration=false" "PrunePropagationPolicy=background")
    "retry" (dict "limit" 5 "backoff" (dict "duration" "5s" "factor" 2 "maxDuration" "1m"))) }}
{{ toYaml $spec | indent 6 }}
  templatePatch: |
    spec:
      source:
        helm:
          valuesObject:
            permissions: {{ "{{ .permissions | toJson }}" }}
{{- end }}
{{- end }}
