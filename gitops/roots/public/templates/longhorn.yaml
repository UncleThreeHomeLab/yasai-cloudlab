{{- if .Values.longhorn.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-longhorn
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Longhorn operator and opt-in storage policy; no volume or credential ownership.
  sourceRepos: [{{ .Values.repository | quote }}]
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: longhorn-system}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: scheduling.k8s.io, kind: PriorityClass}
  namespaceResourceWhitelist:
    - {group: '', kind: Service}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: ConfigMap}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: DaemonSet}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: longhorn.io, kind: Setting}
    - {group: networking.k8s.io, kind: NetworkPolicy}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-longhorn
  namespace: {{ .Values.namespace }}
spec:
  project: cloudlab-longhorn
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/storage/longhorn
    helm:
      releaseName: longhorn
      valueFiles: [values.json]
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      enabled: {{ .Values.longhorn.reconcile }}
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - FailOnSharedResource=true
      - DisableClientSideApplyMigration=true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
