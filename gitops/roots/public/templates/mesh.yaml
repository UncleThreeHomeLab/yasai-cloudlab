{{- $configuration := .Values.mesh.configuration }}
{{- if or (not (kindIs "map" $configuration)) (not (kindIs "bool" $configuration.enabled)) }}
{{- fail "Gateway configuration requires a YAML boolean enabled setting" }}
{{- end }}
{{- $native := and .Values.mesh.enabled $configuration.enabled (hasKey .Values.identity "argo") }}
{{- if $native }}
{{- if or (not (regexMatch "^[a-f0-9]{40}$" ($configuration.revision | default ""))) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) }}
{{- fail "Native gateway configuration requires its reviewed immutable revision and External Secrets" }}
{{- end }}
{{- end }}
{{- if .Values.mesh.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-istio-base
  namespace: argocd
spec:
  sourceRepos:
  - {{ .Values.repository | quote }}
  destinations:
  - server: https://kubernetes.default.svc
    namespace: istio-system
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: security.istio.io
    kind: PeerAuthentication

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: cloudlab-istio-base
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jqPathExpressions:
        - .webhooks[]?.failurePolicy
        - .webhooks[]?.clientConfig.caBundle
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/connectivity/istio/base
    helm:
      releaseName: base
      valueFiles:
      - values.json
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - FailOnSharedResource=true
    - DisableClientSideApplyMigration=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-istio-istiod
  namespace: argocd
spec:
  sourceRepos:
