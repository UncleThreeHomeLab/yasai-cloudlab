---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-gateways
  namespace: argocd
spec:
  sourceRepos:
  - {{ .Values.repository | quote }}
  {{- if $native }}
  - {{ .Values.identity.argo.valuesRepository | quote }}
  {{- end }}
  destinations:
  - server: https://kubernetes.default.svc
    namespace: cloudlab-gateway-public
  - server: https://kubernetes.default.svc
    namespace: cloudlab-gateway-private
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: gateway.networking.k8s.io
    kind: Gateway
  {{- if .Values.identity.argo }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  {{- end }}

{{- if $native }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-gateways-source
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-gateways-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-gateways
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-gateways
  namespace: {{ .Values.namespace }}
  labels: {cloudlab.io/owner: mesh-platform}
  annotations: {argocd.argoproj.io/skip-reconcile: 'false'}
spec:
  project: cloudlab-gateways
  source: null
  sources:
    - repoURL: {{ .Values.repository | quote }}
      targetRevision: {{ $configuration.revision | quote }}
      path: platform/connectivity/gateways
      helm:
        releaseName: cloudlab-gateways
        valueFiles: [values.json, '$values/platform/certificates.yaml', '$identity/identity/argo-values.yaml']
        valuesObject: {sharedInputs: true}
    - {repoURL: {{ .Values.identity.argo.valuesRepository | quote }}, targetRevision: main, ref: values}
    - {repoURL: {{ .Values.identity.argo.valuesRepository | quote }}, targetRevision: {{ .Values.identity.argo.valuesRevision | quote }}, ref: identity}
  destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-gateway-public}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
{{- end }}
