{{- if .Values.mesh.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-gateways
  namespace: argocd
spec:
  sourceRepos:
  - {{ .Values.repository | quote }}
  destinations:
  - server: https://kubernetes.default.svc
    namespace: cloudlab-gateway-public
  - server: https://kubernetes.default.svc
    namespace: cloudlab-gateway-private
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: gateway.networking.k8s.io
    kind: Gateway
  {{- if .Values.identity.argo }}
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  {{- end }}

{{- end }}
