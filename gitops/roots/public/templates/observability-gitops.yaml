{{- $configuration := .Values.observability.configuration }}
{{- if or (not (kindIs "map" $configuration)) (not (kindIs "bool" $configuration.enabled)) }}
{{- fail "Observability configuration requires a YAML boolean enabled setting" }}
{{- end }}
{{- $acceptance := $configuration.acceptanceCommitment }}
{{- if and (hasKey $configuration "acceptanceCommitment") (not (kindIs "string" $acceptance)) }}
{{- fail "Observability acceptance commitment must be an empty string or SHA-256" }}
{{- end }}
{{- if and $acceptance (not (regexMatch "^[a-f0-9]{64}$" $acceptance)) }}
{{- fail "Observability acceptance commitment must be an empty string or SHA-256" }}
{{- end }}
{{- if and $configuration.enabled (hasKey .Values.identity "argo") }}
{{- $catalogPath := .Values.services.catalogPath | default "services/catalog.json" }}
{{- if or (not (kindIs "string" $catalogPath)) (gt (len $catalogPath) 128) (not (regexMatch "^services/catalog(-[a-z0-9]+(-[a-z0-9]+)*)?[.](json|yaml)$" $catalogPath)) }}
{{- fail "Observability catalog must use the approved bounded service catalog path" }}
{{- end }}
{{- if not (regexMatch "^[a-f0-9]{64}$" ($acceptance | default "")) }}
{{- fail "Enabled observability configuration requires a reviewed acceptance commitment" }}
{{- end }}
{{- if or (not (eq .Values.observability.enabled true)) (not (eq .Values.admission.enabled true)) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) (not (regexMatch "^[a-f0-9]{40}$" ($configuration.revision | default ""))) (not (regexMatch "^[a-f0-9]{40}$" (.Values.services.revision | default ""))) }}
{{- fail "Observability configuration requires admission, External Secrets and reviewed immutable platform and service revisions" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-observability-gitops
  namespace: argocd
spec:
  sourceRepos: [{{ .Values.repository | quote }}, {{ .Values.identity.argo.valuesRepository | quote }}]
  destinations: [{server: 'https://kubernetes.default.svc', namespace: argocd}]
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: [{group: argoproj.io, kind: Application}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-observability-gitops-source
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-observability-gitops-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-observability-gitops
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-observability-gitops
  namespace: argocd
  labels: {cloudlab.io/owner: observability-platform}
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - merge:
        mergeKeys: [consumer]
        generators:
          - list:
              elements: [{consumer: observability}]
          - git:
              repoURL: {{ .Values.identity.argo.valuesRepository | quote }}
              revision: main
              files: [{path: platform/acceptance/observability.yaml}]
  syncPolicy: {applicationsSync: create-update, preserveResourcesOnDeletion: true}
  template:
    metadata:
      name: cloudlab-observability-gitops
      labels: {cloudlab.io/owner: observability-platform}
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
        argocd.argoproj.io/tracking-id: cloudlab-public-root:argoproj.io/Application:argocd/cloudlab-observability-gitops
        argocd.argoproj.io/skip-reconcile: {{ $configuration.paused | quote }}
    spec:
{{- $gate := .Files.Get "consumer-source-acceptance.tmpl" | replace "@@VERSION@@" ("cloudlab-consumer-source-acceptance/v1" | toJson) | replace "@@CONSUMER@@" ("observability" | toJson) | replace "@@PRIVATE_REPOSITORY@@" (.Values.identity.argo.valuesRepository | toJson) | replace "@@COMMITMENT@@" ($acceptance | toJson) | replace "@@PATHS_LF@@" ((printf "%s\nplatform/observability.yaml" $catalogPath) | toJson) | trim }}
{{- $spec := dict "project" "cloudlab-observability-gitops" "sources" (list
  (dict "repoURL" .Values.repository "targetRevision" $configuration.revision "path" "platform/observability/gitops" "helm" (dict "releaseName" "cloudlab-observability-gitops" "valueFiles" (list (printf "$values/%s" $catalogPath) "$values/platform/observability.yaml") "valuesObject" (dict "nativeSource" (dict "repository" .Values.repository "revision" $configuration.revision "valuesRepository" .Values.identity.argo.valuesRepository))))
  (dict "repoURL" .Values.identity.argo.valuesRepository "targetRevision" $gate "ref" "values"))
  "destination" (dict "server" "https://kubernetes.default.svc" "namespace" "argocd")
  "syncPolicy" (dict "automated" (dict "enabled" (not $configuration.paused) "prune" false "selfHeal" (not $configuration.paused) "allowEmpty" false)
    "syncOptions" (list "FailOnSharedResource=true" "DisableClientSideApplyMigration=true")) }}
{{ toYaml $spec | indent 6 }}
{{- end }}
