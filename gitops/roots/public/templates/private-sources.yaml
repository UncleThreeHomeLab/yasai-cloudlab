{{- if not (kindIs "bool" .Values.privateSources.enabled) }}
{{- fail "privateSources.enabled must be a YAML boolean" }}
{{- end }}
{{- $acceptance := .Values.privateSources.acceptanceCommitment }}
{{- if and (hasKey .Values.privateSources "acceptanceCommitment") (not (kindIs "string" $acceptance)) }}
{{- fail "Private source acceptance commitment must be an empty string or SHA-256" }}
{{- end }}
{{- if and $acceptance (not (regexMatch "^[a-f0-9]{64}$" $acceptance)) }}
{{- fail "Private source acceptance commitment must be an empty string or SHA-256" }}
{{- end }}
{{- if and .Values.privateSources.enabled (hasKey .Values.identity "argo") }}
{{- if not (regexMatch "^[a-f0-9]{64}$" ($acceptance | default "")) }}
{{- fail "Enabled bound private sources require a reviewed acceptance commitment" }}
{{- end }}
{{- if or (not (eq .Values.admission.enabled true)) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) (not (regexMatch "^[a-f0-9]{40}$" (.Values.privateSources.revision | default ""))) }}
{{- fail "Private source catalog requires admission, External Secrets and its reviewed immutable platform revision" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-private-sources, namespace: argocd, labels: {cloudlab.io/owner: private-source-platform}}
spec:
  description: Fixed private source registry and isolated workload declarations.
  sourceRepos: [{{ .Values.repository | quote }}, {{ .Values.identity.argo.valuesRepository | quote }}]
  destinations: [{server: 'https://kubernetes.default.svc', namespace: argocd}]
  clusterResourceWhitelist: [{group: '', kind: Namespace}]
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: Application}
    - {group: argoproj.io, kind: AppProject}
    - {group: external-secrets.io, kind: ExternalSecret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-private-sources-source
  namespace: argocd
  labels: {cloudlab.io/owner: private-source-platform}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-private-sources-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository, cloudlab.io/owner: private-source-platform}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-private-sources
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudlab-private-sources
  namespace: argocd
  labels: {cloudlab.io/owner: private-source-platform}
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - merge:
        mergeKeys: [consumer]
        generators:
          - list:
              elements: [{consumer: private-sources}]
          - git:
              repoURL: {{ .Values.identity.argo.valuesRepository | quote }}
              revision: main
              files: [{path: platform/acceptance/private-sources.yaml}]
  syncPolicy: {applicationsSync: create-update, preserveResourcesOnDeletion: true}
  template:
    metadata:
      name: cloudlab-private-sources
      labels: {cloudlab.io/owner: private-source-platform}
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
        argocd.argoproj.io/tracking-id: cloudlab-public-root:argoproj.io/Application:argocd/cloudlab-private-sources
    spec:
{{- $gate := .Files.Get "private-source-acceptance.tmpl" | replace "@@PRIVATE_REPOSITORY@@" (.Values.identity.argo.valuesRepository | toJson) | replace "@@COMMITMENT@@" ($acceptance | toJson) | trim }}
{{- $spec := dict "project" "cloudlab-private-sources" "sources" (list
  (dict "repoURL" .Values.repository "targetRevision" .Values.privateSources.revision "path" "platform/delivery/private-sources" "helm" (dict "valueFiles" (list "$values/platform/sources.yaml")))
  (dict "repoURL" .Values.identity.argo.valuesRepository "targetRevision" $gate "ref" "values"))
  "destination" (dict "server" "https://kubernetes.default.svc" "namespace" "argocd")
  "syncPolicy" (dict "automated" (dict "enabled" true "prune" true "selfHeal" true "allowEmpty" true)
    "syncOptions" (list "FailOnSharedResource=true" "DisableClientSideApplyMigration=true" "PruneLast=true")) }}
{{ toYaml $spec | indent 6 }}
{{- end }}
