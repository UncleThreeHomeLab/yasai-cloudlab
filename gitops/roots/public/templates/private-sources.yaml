{{- if not (kindIs "bool" .Values.privateSources.enabled) }}
{{- fail "privateSources.enabled must be a YAML boolean" }}
{{- end }}
{{- if and .Values.privateSources.enabled (hasKey .Values.identity "argo") }}
{{- if or (not (eq .Values.admission.enabled true)) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) (not (regexMatch "^[a-f0-9]{40}$" (.Values.privateSources.revision | default ""))) }}
{{- fail "Private source catalog requires admission, External Secrets and its reviewed immutable platform revision" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-private-sources, namespace: argocd, labels: {cloudlab.io/owner: private-source-platform}}
spec:
  description: Fixed private source registry and isolated workload declarations.
  sourceRepos: [{{ .Values.repository | quote }}, {{ .Values.identity.argo.valuesRepository | quote }}]
  destinations: [{server: 'https://kubernetes.default.svc', namespace: argocd}]
  clusterResourceWhitelist: [{group: '', kind: Namespace}]
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: Application}
    - {group: argoproj.io, kind: AppProject}
    - {group: external-secrets.io, kind: ExternalSecret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-private-sources-source
  namespace: argocd
  labels: {cloudlab.io/owner: private-source-platform}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-private-sources-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository, cloudlab.io/owner: private-source-platform}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-private-sources
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-private-sources
  namespace: argocd
  labels: {cloudlab.io/owner: private-source-platform}
spec:
  project: cloudlab-private-sources
  sources:
    - repoURL: {{ .Values.repository | quote }}
      targetRevision: {{ .Values.privateSources.revision | quote }}
      path: platform/delivery/private-sources
      helm:
        valueFiles: ['$values/platform/sources.yaml']
    - {repoURL: {{ .Values.identity.argo.valuesRepository | quote }}, targetRevision: main, ref: values}
  destination: {server: 'https://kubernetes.default.svc', namespace: argocd}
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: true}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true, PruneLast=true]
{{- end }}
