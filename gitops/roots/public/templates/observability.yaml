{{- $configuration := .Values.observability.configuration }}
{{- if or (not (kindIs "map" $configuration)) (not (kindIs "bool" $configuration.enabled)) }}
{{- fail "Observability configuration requires a YAML boolean enabled setting" }}
{{- end }}
{{- range $key, $_ := $configuration }}
{{- if not (has $key (list "enabled" "revision" "valuesRevision")) }}{{ fail "Unsupported observability configuration setting" }}{{ end }}
{{- end }}
{{- if $configuration.enabled }}
{{- $binding := .Values.identity.argo | default dict }}
{{- if or (not (eq .Values.observability.enabled true)) (not (eq .Values.identity.enabled true)) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) (not (kindIs "string" $configuration.revision)) (not (regexMatch "^[a-f0-9]{40}$" ($configuration.revision | toString))) (not (kindIs "string" $configuration.valuesRevision)) (not (regexMatch "^[a-f0-9]{40}$" ($configuration.valuesRevision | toString))) (not (regexMatch "^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[.]git$" ($binding.valuesRepository | default ""))) (eq ($binding.valuesRepository | default "") .Values.repository) }}
{{- fail "Native observability requires enabled telemetry, External Secrets and reviewed immutable source bindings" }}
{{- end }}
{{- end }}
{{- if .Values.observability.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-observability
  namespace: argocd
spec:
  description: Administrator-owned private telemetry with local disposable storage.
  sourceRepos:
    - {{ .Values.repository | quote }}
    {{- if $configuration.enabled }}
    - {{ .Values.identity.argo.valuesRepository | quote }}
    {{- end }}
  destinations:
    {{- range $namespace := list "cloudlab-observability" "cloudlab-app-notes" "cloudlab-identity" "istio-system" "cloudlab-gateway-public" "cloudlab-gateway-private" }}
    - {server: 'https://kubernetes.default.svc', namespace: {{ $namespace }}}
    {{- end }}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    {{- range $kind := list "ConfigMap" "Secret" "Service" "ServiceAccount" "PersistentVolumeClaim" "ResourceQuota" }}
    - {group: '', kind: {{ $kind }}}
    {{- end }}
    {{- range $kind := list "Deployment" "StatefulSet" "DaemonSet" }}
    - {group: apps, kind: {{ $kind }}}
    {{- end }}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: security.istio.io, kind: AuthorizationPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    {{- range $kind := list "Prometheus" "Alertmanager" "PrometheusRule" "ServiceMonitor" "PodMonitor" }}
    - {group: monitoring.coreos.com, kind: {{ $kind }}}
    {{- end }}
{{- end }}
