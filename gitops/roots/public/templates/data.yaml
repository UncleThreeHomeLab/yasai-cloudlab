{{- $configuration := .Values.data.configuration }}
{{- $flags := dict "maintenance" false "hibernated" false }}
{{- range $key, $_ := $flags }}
{{- if hasKey $configuration $key }}
{{- if not (kindIs "bool" (index $configuration $key)) }}{{ fail "Data operational flags require YAML booleans" }}{{ end }}
{{- $_ := set $flags $key (index $configuration $key) }}
{{- end }}
{{- end }}
{{- if or (not (kindIs "map" $configuration)) (not (kindIs "bool" $configuration.enabled)) }}
{{- fail "Data configuration requires a YAML boolean enabled setting" }}
{{- end }}
{{- $native := and .Values.data.enabled $configuration.enabled (hasKey .Values.identity "argo") }}
{{- if $native }}
{{- if or (not (regexMatch "^[a-f0-9]{40}$" ($configuration.revision | default ""))) (not (regexMatch "^[a-f0-9]{40}$" ($configuration.seaweedfsRevision | default ""))) (not (eq .Values.externalSecrets.enabled true)) (not (eq .Values.externalSecrets.reconcile true)) }}
{{- fail "Native data requires reviewed immutable pins and External Secrets" }}
{{- end }}
{{- end }}
{{- if .Values.data.enabled }}
{{- range $name := list "cnpg" "data-configuration" "seaweedfs" }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-{{ $name }}
  namespace: argocd
spec:
  sourceRepos:
    - {{ $.Values.repository | quote }}
    {{- if and $native (eq $name "data-configuration") }}
    - {{ $.Values.identity.argo.valuesRepository | quote }}
    {{- end }}
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: {{ if eq $name "cnpg" }}cnpg-system{{ else }}cloudlab-data{{ end }}}
  clusterResourceWhitelist:
    {{- if eq $name "cnpg" }}
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    {{- else if eq $name "data-configuration" }}
    - {group: '', kind: Namespace}
    - {group: storage.k8s.io, kind: StorageClass}
    {{- else }}
    []
    {{- end }}
  namespaceResourceWhitelist:
    {{- if eq $name "cnpg" }}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: Service}
    - {group: '', kind: ConfigMap}
    - {group: apps, kind: Deployment}
    {{- else if eq $name "data-configuration" }}
    {{- if $native }}
    - {group: '', kind: ConfigMap}
    {{- end }}
    - {group: '', kind: ResourceQuota}
    - {group: postgresql.cnpg.io, kind: Cluster}
    - {group: postgresql.cnpg.io, kind: Database}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: cert-manager.io, kind: Certificate}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: gateway.networking.k8s.io, kind: BackendTLSPolicy}
    {{- else }}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: Service}
    - {group: '', kind: ConfigMap}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: cert-manager.io, kind: Issuer}
    - {group: cert-manager.io, kind: Certificate}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    {{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-cnpg
  namespace: argocd
spec:
  project: cloudlab-cnpg
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/data/cnpg
    helm: {releaseName: cloudlab-cnpg}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true, RespectIgnoreDifferences=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- if $native }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-data-configuration-source
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-data-configuration-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .Values.identity.argo.valuesRepository | quote }}
        project: cloudlab-data-configuration
        githubAppID: '{{ "{{ .APP_ID }}" }}'
        githubAppInstallationID: '{{ "{{ .INSTALLATION_ID }}" }}'
        githubAppPrivateKey: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: github-argocd}}]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-data-configuration
  namespace: {{ .Values.namespace }}
  labels: {cloudlab.io/owner: data-platform}
  annotations: {argocd.argoproj.io/skip-reconcile: 'false'}
spec:
  project: cloudlab-data-configuration
  source: null
  sources:
    - repoURL: {{ .Values.repository | quote }}
      targetRevision: {{ $configuration.revision | quote }}
      path: platform/data/configuration
      helm:
        releaseName: cloudlab-data-configuration
        valueFiles: ['$values/platform/certificates.yaml', '$values/platform/data.yaml', '$values/services/catalog.json']
        valuesObject: {{ merge (dict "sharedInputs" true) $flags | toJson }}
    - {repoURL: {{ .Values.identity.argo.valuesRepository | quote }}, targetRevision: {{ .Values.identity.argo.valuesRevision | quote }}, ref: values}
  destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-data}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-seaweedfs
  namespace: {{ .Values.namespace }}
  labels: {cloudlab.io/owner: data-platform}
  annotations: {argocd.argoproj.io/skip-reconcile: 'false'}
spec:
  project: cloudlab-seaweedfs
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ $configuration.seaweedfsRevision | quote }}
    path: platform/data/seaweedfs
    helm:
      releaseName: cloudlab-seaweedfs
      valuesObject:
        seaweedfs:
          master: {replicas: 1}
          volume: {replicas: 1}
          filer: {replicas: 1}
          s3: {replicas: 1}
  destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-data}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
{{- end }}
