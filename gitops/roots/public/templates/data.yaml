{{- if .Values.data.enabled }}
{{- range $name := list "cnpg" "data-configuration" "seaweedfs" }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-{{ $name }}
  namespace: argocd
spec:
  sourceRepos: [{{ $.Values.repository | quote }}]
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: {{ if eq $name "cnpg" }}cnpg-system{{ else }}cloudlab-data{{ end }}}
  clusterResourceWhitelist:
    {{- if eq $name "cnpg" }}
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    {{- else if eq $name "data-configuration" }}
    - {group: '', kind: Namespace}
    - {group: storage.k8s.io, kind: StorageClass}
    {{- else }}
    []
    {{- end }}
  namespaceResourceWhitelist:
    {{- if eq $name "cnpg" }}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: Service}
    - {group: '', kind: ConfigMap}
    - {group: apps, kind: Deployment}
    {{- else if eq $name "data-configuration" }}
    - {group: '', kind: ResourceQuota}
    - {group: postgresql.cnpg.io, kind: Cluster}
    - {group: postgresql.cnpg.io, kind: Database}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: cert-manager.io, kind: Certificate}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: gateway.networking.k8s.io, kind: BackendTLSPolicy}
    {{- else }}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: Service}
    - {group: '', kind: ConfigMap}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: cert-manager.io, kind: Issuer}
    - {group: cert-manager.io, kind: Certificate}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    {{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-cnpg
  namespace: argocd
spec:
  project: cloudlab-cnpg
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/data/cnpg
    helm: {releaseName: cloudlab-cnpg}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true, RespectIgnoreDifferences=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
