{{- if (.Values.rollouts | default dict).enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-rollouts, namespace: argocd}
spec:
  description: Progressive delivery controller and Gateway API plugin.
  sourceRepos: [{{ .Values.repository | quote }}]
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: argo-rollouts}
    - {server: 'https://kubernetes.default.svc', namespace: cloudlab-observability}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: ConfigMap}
    - {group: '', kind: ResourceQuota}
    - {group: apps, kind: Deployment}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: monitoring.coreos.com, kind: PodMonitor}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: cloudlab-rollouts
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/delivery/rollouts
    helm: {releaseName: argo-rollouts, skipTests: true}
  destination: {server: 'https://kubernetes.default.svc', namespace: argo-rollouts}
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 1m}
{{- end }}
