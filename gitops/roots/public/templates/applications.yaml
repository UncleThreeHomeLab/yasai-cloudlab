{{- $dataNative := and $.Values.data.enabled $.Values.data.configuration.enabled (hasKey $.Values.identity "argo") }}
{{- $oidc := .Values.identity.argo | default dict }}
{{- if hasKey .Values.identity "argo" }}
{{- if or (not (kindIs "map" .Values.identity.argo)) (not $oidc) (not .Values.identity.enabled) (not (regexMatch "^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[.]git$" $oidc.valuesRepository)) (eq $oidc.valuesRepository .Values.repository) (not (regexMatch "^[a-f0-9]{40}$" $oidc.valuesRevision)) }}
{{- fail "Argo OIDC requires enabled identity and its distinct designated private values source" }}
{{- end }}
{{- end }}
{{- range $name, $entry := dict "cloudlab-public-root" (dict "project" "cloudlab-root" "path" "gitops/roots/public") "cloudlab-argocd" (dict "project" "cloudlab-platform" "path" "platform/delivery/argocd") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  project: {{ $entry.project }}
  {{- if and (eq $name "cloudlab-argocd") $oidc }}
  sources:
    - repoURL: {{ $.Values.repository | quote }}
      targetRevision: {{ $.Values.revision | quote }}
      path: {{ $entry.path }}
      helm:
        releaseName: argocd
        valuesObject:
          identitySyncObserver: {{ $.Values.identity.enabled }}
          kialiBackendObserver: {{ $.Values.observability.enabled }}
        valueFiles: [$identity/identity/argo-values.yaml]
    - repoURL: {{ $oidc.valuesRepository | quote }}
      targetRevision: {{ $oidc.valuesRevision | quote }}
      ref: identity
  {{- else }}
  source:
    repoURL: {{ $.Values.repository | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: {{ $entry.path }}
    helm:
      releaseName: {{ if eq $name "cloudlab-argocd" }}argocd{{ else }}cloudlab-public-root{{ end }}
      {{- if eq $name "cloudlab-argocd" }}
      valuesObject:
        identitySyncObserver: {{ $.Values.identity.enabled }}
        kialiBackendObserver: {{ $.Values.observability.enabled }}
      {{- end }}
      {{- if and (eq $name "cloudlab-public-root") $oidc }}
      valuesObject:
        identity:
{{ toYaml $.Values.identity | indent 10 }}
        {{- $flags := pick $.Values.data.configuration "maintenance" "hibernated" }}
        {{- if $flags }}
        data:
          configuration:
{{ toYaml $flags | indent 12 }}
        {{- end }}
      {{- end }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.namespace }}
  {{- if and (eq $name "cloudlab-public-root") $dataNative }}
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      namespace: argocd
      name: cloudlab-public-root
      jsonPointers: [/spec/source/helm/valuesObject/data/configuration/maintenance, /spec/source/helm/valuesObject/data/configuration/hibernated]
    - group: argoproj.io
      kind: Application
      namespace: argocd
      name: cloudlab-seaweedfs
      jsonPointers: [/spec/source/helm/valuesObject/seaweedfs/master/replicas, /spec/source/helm/valuesObject/seaweedfs/volume/replicas, /spec/source/helm/valuesObject/seaweedfs/filer/replicas, /spec/source/helm/valuesObject/seaweedfs/s3/replicas]
  {{- end }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - FailOnSharedResource=true
      - DisableClientSideApplyMigration=true
      {{- if and (eq $name "cloudlab-public-root") $dataNative }}
      - RespectIgnoreDifferences=true
      {{- end }}
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
