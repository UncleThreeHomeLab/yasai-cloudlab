{{- if .Values.externalSecrets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudlab-external-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: ESO operator and store; bootstrap retains the 1Password token.
  sourceRepos: [{{ .Values.repository | quote }}]
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: external-secrets}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: external-secrets.io, kind: ClusterSecretStore}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: '', kind: Secret}
    - {group: '', kind: Service}
    - {group: '', kind: ServiceAccount}
    - {group: apps, kind: Deployment}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudlab-external-secrets
  namespace: {{ .Values.namespace }}
spec:
  project: cloudlab-external-secrets
  source:
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/secrets/external-secrets
    helm:
      releaseName: external-secrets
      valueFiles: [values.json]
      {{- if .Values.identity.enabled }}
      valuesObject:
        cloudlab:
          additionalConsumerNamespaces: [cloudlab-identity]
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      enabled: {{ .Values.externalSecrets.reconcile }}
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - FailOnSharedResource=true
      - DisableClientSideApplyMigration=true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
