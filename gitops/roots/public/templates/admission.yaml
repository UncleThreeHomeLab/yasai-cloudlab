{{- if (.Values.admission | default dict).enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: cloudlab-admission, namespace: argocd}
spec:
  description: Administrator-owned admission controllers and workload policies.
  sourceRepos: [{{ .Values.repository | quote }}]
  destinations: [{server: 'https://kubernetes.default.svc', namespace: cloudlab-policy}]
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: policies.kyverno.io, kind: ValidatingPolicy}
  namespaceResourceWhitelist:
    {{- range $kind := list "ConfigMap" "Secret" "Service" "ServiceAccount" "ResourceQuota" }}
    - {group: '', kind: {{ $kind }}}
    {{- end }}
    - {group: apps, kind: Deployment}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: networking.k8s.io, kind: NetworkPolicy}
{{- range $name, $entry := dict "cloudlab-kyverno" (dict "path" "platform/delivery/admission" "wave" "0") "cloudlab-workload-policy" (dict "path" "platform/delivery/admission/policies" "wave" "1") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $entry.wave | quote }}
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: cloudlab-admission
  source:
    repoURL: {{ $.Values.repository | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: {{ $entry.path }}
    helm:
      releaseName: {{ $name }}
      skipTests: true
      {{- if eq $name "cloudlab-kyverno" }}
      valueFiles: [values.json]
      {{- end }}
  destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-policy}
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jqPathExpressions: ['select(.aggregationRule != null) | .rules']
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: true, allowEmpty: false}
    syncOptions:
      - FailOnSharedResource=true
      - DisableClientSideApplyMigration=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 1m}
{{- end }}
{{- end }}
