apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-permissions-empty-fixture
  labels:
    cloudlab.io/verification: gitops-public-fixture
data:
  purpose: Disposable empty-grant check input for the permissions path.
  # Render the permissions chart with these zero assignments and expect zero
  # RoleBinding/ClusterRoleBinding objects. Repair = fix the source forward
  # (last-valid retained, never empty-apply); narrow = reduce scope; retire
  # with state retired and empty assignments, then binding absence plus
  # fresh denial.
  permissions.yaml: |
    state: active
    assignments: []
