{{- range $name, $scope := dict "cloudlab-workload-contract" (dict "background" true "resources" (list "pods") "operations" (list "CREATE" "UPDATE")) "cloudlab-workload-ephemeral" (dict "background" false "resources" (list "pods/ephemeralcontainers") "operations" (list "UPDATE")) }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
spec:
  validationActions: {{ toJson $.Values.validationActions }}
  failurePolicy: Fail
  evaluation:
    admission: {enabled: true}
    background: {enabled: {{ $scope.background }}}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    namespaceSelector:
      matchLabels: {cloudlab.io/owner: service-platform}
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: {{ toJson $scope.operations }}
        resources: {{ toJson $scope.resources }}
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: allContainers
      expression: >-
        variables.containers +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.allContainers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$'))
      message: Workload images must use an immutable SHA-256 digest.
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
          has(c.resources.limits.cpu) && has(c.resources.limits.memory) &&
          quantity(c.resources.requests.cpu).isGreaterThan(quantity('0')) &&
          quantity(c.resources.requests.memory).isGreaterThan(quantity('0')) &&
          quantity(c.resources.limits.cpu).isGreaterThan(quantity('0')) &&
          quantity(c.resources.limits.memory).isGreaterThan(quantity('0')))
      message: Every workload container requires positive CPU and memory requests and limits.
    - expression: >-
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: Workloads must disable automatic service account token mounting.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s, !has(s.serviceAccountToken)))
      message: Workloads must not project Kubernetes service account tokens.
{{- end }}
