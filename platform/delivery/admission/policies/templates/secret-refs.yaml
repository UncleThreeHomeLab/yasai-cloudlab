apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cloudlab-secretref-catalog
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
spec:
  validationActions: {{ toJson .Values.validationActions }}
  failurePolicy: Fail
  evaluation:
    admission: {enabled: true}
    background: {enabled: false}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  variables:
    - name: selected
      expression: request.namespace.startsWith('cloudlab-app-')
  validations:
    - expression: >-
        !variables.selected ||
        (object.spec.secretStoreRef == {'name': 'cloudlab', 'kind': 'ClusterSecretStore'} &&
         object.spec.refreshInterval == '24h' &&
         object.spec.target.name == object.metadata.name &&
         object.spec.target.creationPolicy == 'Owner' &&
         object.spec.target.deletionPolicy == 'Retain')
      message: Application ExternalSecrets require the catalog owner store, shape and retention.
    - expression: >-
        !variables.selected ||
        (has(object.spec.target.template) &&
         has(object.spec.target.template.engineVersion) &&
         object.spec.target.template.engineVersion == 'v2')
      message: Application ExternalSecrets require the guarded v2 delivery template.
    - expression: >-
        !variables.selected ||
        ((!has(object.spec.data) || size(object.spec.data) == 0) &&
         has(object.spec.dataFrom) && size(object.spec.dataFrom) == 1 &&
         object.spec.dataFrom[0].all(k, k == 'extract') &&
         has(object.spec.dataFrom[0].extract) &&
         object.spec.dataFrom[0].extract.all(k, k == 'key') &&
         has(object.spec.dataFrom[0].extract.key) &&
         object.spec.dataFrom[0].extract.key.matches('^[a-z][a-z0-9-]{0,99}$'))
      message: Application ExternalSecrets require a single whole-item vault reference.
