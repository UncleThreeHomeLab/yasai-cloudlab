apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-policy
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    cloudlab.io/owner: admission-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: cloudlab-policy}
spec:
  hard:
    pods: '5'
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    persistentvolumeclaims: '0'
    services.loadbalancers: '0'
    services.nodeports: '0'
