identitySyncObserver: false
kialiBackendObserver: false
argo-cd:
  fullnameOverride: argocd
  global:
    image:
      tag: v3.5.3@sha256:dd3f47d5a5e4da563a7a398506e892481b358a7cec50abdf320c71aa55904bfa
    networkPolicy:
      create: false
    logging:
      format: json
  crds:
    keep: true
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
  configs:
    cm:
      admin.enabled: false
      users.anonymous.enabled: false
      exec.enabled: false
      statusbadge.enabled: false
      application.resourceTrackingMethod: annotation
      timeout.reconciliation: 60s
      timeout.reconciliation.jitter: 10s
      resource.customizations.health.cert-manager.io_Certificate: &certificateHealth |
        local health = {status = "Progressing", message = "Waiting for current generation readiness"}
        if obj.metadata == nil or obj.metadata.generation == nil then
          return health
        end
        local generation = obj.metadata.generation
        local conditions = (obj.status or {}).conditions or {}
        for _, condition in ipairs(conditions) do
          if condition.observedGeneration == generation and condition.type == "Issuing" and condition.status == "True" then
            health.message = condition.message or "Current generation issuance is in progress"
            return health
          end
        end
        for _, condition in ipairs(conditions) do
          if condition.observedGeneration == generation and condition.type == "Ready" then
            if condition.status == "True" then
              health.status = "Healthy"
              health.message = condition.message or "Current generation is ready"
            elseif condition.status == "False" then
              health.status = "Degraded"
              health.message = condition.message or "Current generation is not ready"
            end
            return health
          end
        end
        return health
      resource.customizations.health.cert-manager.io_ClusterIssuer: *certificateHealth
    rbac:
      policy.default: role:no-access
      policy.csv: ''
      scopes: '[groups]'
    params:
      server.insecure: false
      server.enable.proxy.extension: false
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    extraArgs: [--policy=create-update, --enable-policy-override=false]
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  redis:
    image:
      repository: docker.io/library/redis
      tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  controller:
    env:
      - name: GOMEMLIMIT
        value: 1600MiB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  server:
    service:
      type: ClusterIP
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  redisSecretInit:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
