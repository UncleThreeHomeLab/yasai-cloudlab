{{/* Credential map: keycloak-client-secrets item -> app-namespace ExternalSecret -> OIDC login flow. */}}
{{- range .Values.catalog }}
{{- $oidc := include "cloudlab.service.identity" . | fromJson }}
{{- if and $oidc.enabled (hasKey $oidc "secretReference") }}
{{- if not (has $oidc.secretReference .approval.secretReferences) }}{{ fail "Confidential OIDC requires an administrator-approved secret reference" }}{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $oidc.secretReference }}
  namespace: {{ .approval.namespace }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $oidc.secretReference }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        client_secret: {{ printf "{{- $value := index (index (.client_secrets | fromJson) %q) %q -}}{{- if not (and (kindIs \"string\" $value) $value) -}}{{- fail \"Required OIDC client secret must be a nonempty string\" -}}{{- end -}}{{ $value }}" $oidc.realm $oidc.client | quote }}
  dataFrom:
    - extract: {key: keycloak-client-secrets}
{{- end }}
{{- end }}
