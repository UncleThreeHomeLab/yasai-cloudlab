{{- range .Values.catalog }}
{{- if eq (.approval.visibility | default "public") "private" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "service-source-%s" .approval.name }}
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ printf "service-source-%s" .approval.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ .approval.repository | quote }}
        project: {{ .approval.name | quote }}
        githubAppID: '{{ `{{ .APP_ID }}` }}'
        githubAppInstallationID: '{{ `{{ .INSTALLATION_ID }}` }}'
        githubAppPrivateKey: {{ $.Files.Get "github-app-key.tmpl" | quote }}
  dataFrom:
    - extract: {key: github-argocd}
{{- end }}
{{- end }}
