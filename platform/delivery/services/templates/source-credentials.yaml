{{- range .Values.catalog }}
{{- if or .approval.composition (eq (.approval.visibility | default "public") "private") }}
{{- $entry := . }}
{{- $projects := list .approval.name }}
{{- if .approval.composition }}{{ $projects = append $projects (printf "%s-profile" .approval.name) }}{{ end }}
{{- range $projects }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "service-source-%s" . }}
  namespace: argocd
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ printf "service-source-%s" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels: {argocd.argoproj.io/secret-type: repository}
      data:
        type: git
        url: {{ $entry.approval.repository | quote }}
        project: {{ . | quote }}
        githubAppID: '{{ `{{ .APP_ID }}` }}'
        githubAppInstallationID: '{{ `{{ .INSTALLATION_ID }}` }}'
        githubAppPrivateKey: {{ $.Files.Get "github-app-key.tmpl" | quote }}
  dataFrom:
    - extract: {key: github-argocd}
{{- end }}
{{- end }}
{{- end }}
