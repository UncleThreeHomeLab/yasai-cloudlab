{{/* Credential map: vault item -> app-namespace ExternalSecret -> application container mount. Ordinary profile only. */}}
{{- range .Values.catalog }}
{{- $a := .approval }}
{{- with $a.secretBindings }}
{{- if or (hasKey $a "composition") (ne ($a.chartPath | default "charts/service") "charts/service") }}{{ fail "Secret bindings require the ordinary service profile" }}{{- end }}
{{- range . }}
{{- if not (has .name $a.secretReferences) }}{{ fail "Secret binding destination requires administrator approval" }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ .name }}, namespace: {{ $a.namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- range $key, $field := .fields }}
        {{ $key | quote }}: {{ printf "{{- $value := index . %q -}}{{- if not $value -}}{{- fail \"Required service secret field is missing or empty\" -}}{{- end -}}{{ $value }}" $field | quote }}
        {{- end }}
  dataFrom:
    - extract: {key: {{ .item | quote }}}
{{- end }}
{{- end }}
{{- end }}
