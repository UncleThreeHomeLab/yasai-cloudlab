{{- range .Values.catalog }}
{{- $namespace := .approval.namespace }}
{{- range .dataBindings }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- range .fields }}
        {{ . }}: {{ printf "{{ .%s }}" . | quote }}
        {{- end }}
  dataFrom:
    - extract: {key: {{ .item }}}
{{- end }}
{{- end }}
