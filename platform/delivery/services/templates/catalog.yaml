{{/* Retired removal sequence: mark the entry retired (workloads stop
rendering, policies deny, data stays), verify absence, then remove the entry.
Prune order follows sync waves: workload objects first, wave -1 policies and
bindings, wave -2 namespace/quota/register last with Prune=false. PVCs,
databases, buckets and vault items always Retain; namespace and exception
register are retained until the entry itself is removed. Revocation bound:
in-flight requests complete; once the emptied Role reaches the API, new grants
fail closed; composition mounts no API credential, so no issued token outlives
the grant. */}}
{{- if hasKey .Values "argo-cd" }}
{{- $config := index .Values "argo-cd" "configs" "cm" "oidc.config" | fromYaml }}
{{- if not (hasSuffix "/realms/platform" $config.issuer) }}{{ fail "Approved platform identity issuer is required" }}{{- end }}
{{- $_ := set .Values "issuer" (replace "/realms/platform" "/realms/applications" $config.issuer) }}
{{- end }}
{{- range .Values.catalog }}
{{- $v := .definition }}
{{- if or (hasKey $v "routeOnly") (hasKey $v "routeBackends") }}{{ fail "Routing controls belong to the administrator catalog renderer" }}{{ end }}
{{- $a := .approval }}
{{- $ordinary := and (not (hasKey $a "composition")) (eq ($a.chartPath | default "charts/service") "charts/service") }}
{{- $exposureFile := dict }}
{{- $privateExposures := list }}
{{- $routeNames := list }}
{{- $retired := eq (.publication | default "ready") "retired" }}
{{- if $ordinary }}
{{- range $field := list "hostname" "access" "path" "port" "backend" }}
{{- if hasKey $v.exposure $field }}{{ fail "Ordinary service addresses come from exposure inputs, not the catalog" }}{{- end }}
{{- end }}
{{- if $v.additionalExposures }}{{ fail "Ordinary private views come from the private policy, not the catalog" }}{{- end }}
{{- $exposures := $.Values.exposures | default dict }}
{{- if hasKey $exposures $a.name }}{{ $exposureFile = index $exposures $a.name }}{{- end }}
{{- $zone := ((($.Values.tailnet | default dict).splitDNS | default dict).zone | default "") }}
{{- range ($.Values.privateDNS | default dict).services | default list }}
{{- if eq .service $a.name }}
{{- if not $zone }}{{ fail "Private exposures require the policy zone" }}{{- end }}
{{- $privateExposures = append $privateExposures (merge (dict "hostname" (printf "%s.%s" .name $zone)) .) }}
{{- end }}
{{- end }}
{{- if not $retired }}
{{- if and $exposureFile (eq $exposureFile.publication "published") (ne $v.exposure.class "public") }}{{ fail "Published public exposure requires the public class signal" }}{{- end }}
{{- if and $privateExposures (eq $v.exposure.class "none") }}{{ fail "Private exposures require an exposed class signal" }}{{- end }}
{{- end }}
{{- if $exposureFile }}
{{- if not (has $exposureFile.publication (list "published" "retired")) }}{{ fail "Public exposure publication must be published or retired" }}{{- end }}
{{- $pub := $exposureFile.exposure }}
{{- if or (ne $pub.class "public") (ne $pub.backend $v.name) (not (regexMatch "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$" $pub.hostname)) (not (regexMatch (printf "^%s\\." $a.name) $pub.hostname)) (not (regexMatch "^/[A-Za-z0-9/_-]*$" $pub.path)) (not (has (kindOf $pub.port) (list "float64" "int" "int64"))) (lt ($pub.port | toString | atoi) 1024) (gt ($pub.port | toString | atoi) 65535) }}{{ fail "Public exposure entry is invalid or mismatched" }}{{- end }}
{{- if eq $pub.access "public" }}{{ if hasKey $pub "accessPolicy" }}{{ fail "Public access takes no access policy" }}{{- end }}
{{- else if eq $pub.access "human" }}{{ if ne ($pub.accessPolicy | default "") "approved-human" }}{{ fail "Human access requires the approved human policy" }}{{- end }}
{{- else if eq $pub.access "machine" }}{{ if ne ($pub.accessPolicy | default "") "approved-machine" }}{{ fail "Machine access requires the approved machine policy" }}{{- end }}
{{- else }}{{ fail "Public access must be public, human, or machine" }}{{- end }}
{{- end }}
{{- if not $retired }}
{{- if and (eq $v.exposure.class "public") (not $exposureFile) }}{{ fail "Public class requires its public exposure entry" }}{{- end }}
{{- if and (eq $v.exposure.class "private") (not $privateExposures) }}{{ fail "Private class requires its private exposure entries" }}{{- end }}
{{- end }}
{{- $seen := list }}
{{- range $privateExposures }}
{{- if or (ne .backend $v.name) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" .name)) (not (regexMatch "^/[A-Za-z0-9/_-]*$" .path)) (not (has (kindOf .port) (list "float64" "int" "int64"))) (lt (.port | toString | atoi) 1024) (gt (.port | toString | atoi) 65535) }}{{ fail "Private exposure entry is invalid or mismatched" }}{{- end }}
{{- $seen = append $seen .name }}
{{- end }}
{{- if ne (len $seen) (len ($seen | uniq)) }}{{ fail "Private exposure names must be unique" }}{{- end }}
{{- $routeCount := len $privateExposures }}
{{- if and $exposureFile (eq ($exposureFile.publication | default "") "published") }}{{ $routeCount = add $routeCount 1 }}{{- end }}
{{- range $index := until (int $routeCount) }}
{{- $routeNames = append $routeNames (ternary $v.name (printf "%s-extra-%d" $v.name (sub $index 1)) (eq $index 0)) }}
{{- end }}
{{- end }}
{{- $_ := include "cloudlab.service.identity" . | fromJson }}
{{- $monitoring := include "cloudlab.service.monitoring" . | fromJson }}
{{- $composition := $a.composition | default dict }}
{{- with $a.composition }}
{{- range .workloads }}
{{- $podSpec := .podSpec | default dict }}
{{- $sa := $podSpec.serviceAccountName | default "" }}
{{- if or (eq $sa "") (eq $sa "default") }}{{ fail "Composition workloads require their named service account" }}{{- end }}
{{- end }}
{{- end }}
{{- if and $composition $v.rollouts.enabled }}{{ fail "Composition canaries require a separate supported contract" }}{{ end }}
{{- $storageClaims := $composition.claims | default list }}
{{- if not $composition }}
{{- if $v.persistence.enabled }}{{ $storageClaims = list (dict "name" $v.name "size" $v.persistence.size) }}{{- end }}
{{- end }}
{{- $storageBudget := dict "claims" 2 "storageGi" 4 }}
{{- if $composition }}{{ $storageBudget = dict "claims" ($composition.budget.persistentvolumeclaims | int) "storageGi" (index $composition.budget "requests.storage" | trimSuffix "Gi" | atoi) }}{{- end }}
{{- if gt (len $storageClaims) (index $storageBudget "claims") }}{{ fail "Service storage claims exceed their approved claim budget" }}{{- end }}
{{- $claimNames := list }}{{- $storageGi := 0 }}
{{- range $storageClaims }}{{ $claimNames = append $claimNames .name }}{{ $storageGi = add $storageGi (.size | trimSuffix "Gi" | atoi) }}{{- end }}
{{- if ne (len $claimNames) (len ($claimNames | uniq)) }}{{ fail "Service storage claim names must be unique" }}{{- end }}
{{- if gt $storageGi (index $storageBudget "storageGi") }}{{ fail "Service storage requests exceed their approved storage budget" }}{{- end }}
{{- $releaseService := $v.name }}
{{- if eq ($a.chartPath | default "charts/service") "apps/notes" }}{{ $releaseService = "notes-web" }}{{- end }}
{{- $namespace := printf "cloudlab-app-%s" $a.name }}
{{- $artifact := $a.artifact | default dict }}
{{- if $artifact }}
{{- if or (ne $artifact.project (printf "cloudlab-%s" ($a.visibility | default "public"))) (ne $artifact.releasePath (printf "apps/releases/%s.json" $a.name)) (not (hasSuffix (printf "/%s/%s" $artifact.project $a.name) $artifact.repository)) }}{{ fail "Artifact source must match its approved project and application" }}{{- end }}
{{- $organization := index (splitList "/" (trimPrefix "https://github.com/" $.Values.repository)) 0 }}
{{- if not (hasPrefix (printf "%s/" $organization) $artifact.sourceRepository) }}{{ fail "Artifact producer must belong to the designated organization" }}{{- end }}
{{- range $artifact.identities }}
{{- if not (or (hasPrefix (printf "%s/.github/workflows/application-publish.yaml@" (trimSuffix ".git" $.Values.repository)) .) (eq . (printf "https://github.com/%s/.github/workflows/ci.yaml@refs/heads/main" $artifact.sourceRepository))) }}{{ fail "Artifact signing identity must use the approved publishing workflow" }}{{- end }}
{{- end }}
{{- end }}
{{- if and (eq ($a.chartPath | default "charts/service") "apps/notes") (ne $a.repository $.Values.repository) }}{{ fail "Notes composition requires the administrator-owned application source" }}{{- end }}
{{- $classes := list }}
{{- if $ordinary }}
{{- if ne $v.exposure.class "none" }}{{ $classes = append $classes $v.exposure.class }}{{- end }}
{{- if $privateExposures }}{{ $classes = append $classes "private" }}{{- end }}
{{- else }}
{{- range concat (list $v.exposure) ($v.additionalExposures | default list) }}
{{- if ne .class "none" }}{{ $classes = append $classes .class }}{{- end }}
{{- end }}
{{- end }}
{{- $classes = $classes | uniq | sortAlpha }}
{{- if ne $namespace $a.namespace }}
{{- fail "Service destination must be the administrator-owned namespace" }}
{{- end }}
{{- range $v.secrets }}
{{- if not (has .name $a.secretReferences) }}{{ fail "Unapproved service credential" }}{{- end }}
{{- end }}
{{- range $a.secretBindings }}
{{- if or (hasKey $a "composition") (ne ($a.chartPath | default "charts/service") "charts/service") }}{{ fail "Secret bindings require the ordinary service profile" }}{{- end }}
{{- if not (has .name $a.secretReferences) }}{{ fail "Unapproved service credential" }}{{- end }}
{{- end }}
{{- range $v.configMaps }}
{{- if not (has .name $a.configMaps) }}{{ fail "Unapproved service configuration" }}{{- end }}
{{- end }}
{{- range $v.data }}
{{- if not (has .credentialReference $a.secretReferences) }}{{ fail "Unapproved data credential" }}{{- end }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  {{- $exceptions := $a.exceptions | default list }}
  {{- $exceptionIdentities := list }}
  {{- range $exceptions }}{{ $exceptionIdentities = append $exceptionIdentities .identity }}{{ end }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    {{- if $exceptionIdentities }}
    cloudlab.io/exception-register: {{ $exceptionIdentities | uniq | sortAlpha | join "," | quote }}
    {{- end }}
  labels:
    cloudlab.io/owner: service-platform
    {{- if $composition }}
    cloudlab.io/composition: approved
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    {{- else }}
    pod-security.kubernetes.io/enforce: restricted
    {{- end }}
    pod-security.kubernetes.io/enforce-version: v1.36
    istio.io/dataplane-mode: ambient
    cloudlab.io/service-secrets: approved
    {{- if $v.rollouts.enabled }}
    cloudlab.io/release-analysis: approved
    {{- end }}
    {{- if $classes }}
    cloudlab.io/gateway: {{ if gt (len $classes) 1 }}mixed{{ else }}{{ first $classes }}{{ end }}
    {{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: {{ $namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-2', argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  hard:
    {{- if $composition }}
    {{- range $key, $value := $composition.budget }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- else }}
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    pods: '8'
    persistentvolumeclaims: '2'
    requests.storage: 4Gi
    {{- end }}
    services.loadbalancers: '0'
    services.nodeports: '0'
{{- if $exceptions }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-exception-register
  namespace: {{ $namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-2'}
  labels: {cloudlab.io/owner: service-platform}
data:
  register.json: {{ $exceptions | toJson | quote }}
{{- end }}
{{- if not $composition }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-ingress, namespace: {{ $namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
        - ipBlock: {cidr: 'fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128'}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $namespace }}}}
    {{- range $classes }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ printf "cloudlab-gateway-%s" . }}}}
    {{- end }}
    {{- if $monitoring.metrics.enabled }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudlab-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: {{ $monitoring.metrics.port }}}, {protocol: TCP, port: 15008}]
    {{- end }}
{{- end }}
{{- if $v.rollouts.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: release-scrapes, namespace: {{ $namespace }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ $releaseService }}}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudlab-observability}}}]
      ports: [{protocol: TCP, port: 9091}, {protocol: TCP, port: 15008}]
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $a.name }}
  namespace: argocd
spec:
  sourceRepos: {{ if $composition }}{{ list $.Values.repository $a.repository $composition.chart.repository | uniq | toJson }}{{ else }}{{ list $.Values.repository $a.repository | uniq | toJson }}{{ end }}
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: {{ $namespace }}}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: '', kind: Service}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: ConfigMap}
    - {group: '', kind: PersistentVolumeClaim}
    - {group: apps, kind: Deployment}
    {{- if $composition }}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    {{- end }}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    {{- if $v.rollouts.enabled }}
    - {group: argoproj.io, kind: Rollout}
    - {group: argoproj.io, kind: AnalysisTemplate}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $a.name }}
  namespace: argocd
  labels: {cloudlab.io/owner: service-platform}
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    {{- if and $artifact (ne (.publication | default "ready") "retired") }}
    - git:
        repoURL: {{ $a.repository | quote }}
        revision: main
        files: [{path: {{ $artifact.releasePath | quote }}}]
    {{- else }}
    - list:
        elements: [{name: {{ $v.name }}}]
    {{- end }}
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: {{ if $artifact }}{{ printf "%s-%s" $a.name $v.name | quote }}{{ else }}{{ printf "%s-{{.name}}" $a.name | quote }}{{ end }}
      {{- if and $artifact (not $retired) }}
      annotations:
        {{- if $composition }}
        cloudlab.io/artifact-components: '{{ "{{ .components | toJson }}" }}'
        cloudlab.io/primary-component: '{{ "{{ .primary_component }}" }}'
        {{- end }}
        cloudlab.io/artifact-digest: '{{ "{{ .digest }}" }}'
        cloudlab.io/source-revision: '{{ "{{ .source_revision }}" }}'
        cloudlab.io/workflow-run: '{{ "{{ .workflow_run_id }}" }}'
      {{- end }}
    spec:
      project: {{ $a.name }}
      {{- $workload := deepCopy $v }}
      {{- $_ := set $workload "routeOnly" false }}
      {{- $_ := set $workload "routeBackends" dict }}
      {{- if $ordinary }}
      {{- $_ := set $workload "exposureFile" $exposureFile }}
      {{- $_ := set $workload "privateExposures" $privateExposures }}
      {{- $_ := set $workload "renderDisabled" $retired }}
      {{- $_ := set $workload "routeNames" $routeNames }}
      {{- end }}
      {{- if and $retired (not $ordinary) }}
      {{- $_ := set $workload "renderDisabled" true }}
      {{- end }}
      {{- if $artifact }}
      {{- if not $retired }}
      {{- $_ := set $workload "image" (printf "%s@{{ .digest }}" $artifact.repository) }}
      {{- end }}
      {{- $_ := set $workload "imagePullSecrets" (list (dict "name" "harbor-application-pull")) }}
      {{- $_ := set $workload "artifactPolicyHash" (printf "%s%s" (toJson $artifact) ($.Files.Get "sigstore-fulcio.crt") | sha256sum) }}
      {{- end }}
      {{- $helm := dict "valuesObject" $workload }}
      {{- if eq ($a.chartPath | default "charts/service") "apps/notes" }}
      {{- $_ := set $helm "valuesObject" (dict "definition" $workload "issuer" $.Values.issuer "telemetry" $.Values.telemetry "renderDisabled" $retired) }}
      {{- $_ := set $helm.valuesObject "web" (dict "routeOnly" false "routeBackends" dict) }}
      {{- $_ := set $helm.valuesObject "api" (dict "routeOnly" false "routeBackends" dict) }}
      {{- if $artifact }}
      {{- $_ := set $helm.valuesObject "packaged" true }}
      {{- $_ := set $helm.valuesObject "imagePullSecrets" $workload.imagePullSecrets }}
      {{- end }}
      {{- end }}
      {{- $source := dict "repoURL" $.Values.repository "targetRevision" $.Values.revision "path" ($a.chartPath | default "charts/service") "helm" $helm }}
      {{- if and $composition (not $retired) }}
      {{- $images := include "cloudlab.composition.images" (dict "composition" $composition "artifact" $artifact) | fromJson }}
      {{- if $artifact }}{{ $_ := set $images "imagePullSecrets" (list (dict "name" "harbor-application-pull")) }}{{ end }}
      {{- $_ := set $helm "valuesObject" (dict "routeOnly" true "routeBackends" $composition.backends | mergeOverwrite (deepCopy $workload)) }}
      {{- $appSource := dict "repoURL" $composition.chart.repository "targetRevision" $composition.chart.revision "path" $composition.chart.path "helm" (dict "releaseName" $a.name "valueFiles" (list (printf "$values/%s" $a.valuesPath)) "valuesObject" $images) }}
      sources:
{{ toYaml (list $source $appSource (dict "repoURL" $a.repository "targetRevision" $a.revision "ref" "values")) | indent 8 }}
      {{- else if $composition }}
      source:
{{ toYaml $source | indent 8 }}
      {{- else if eq $a.repository $.Values.repository }}
      source:
{{ toYaml $source | indent 8 }}
      {{- else }}
      {{- $_ := set $helm "valueFiles" (list (printf "$values/%s" $a.valuesPath)) }}
      sources:
{{ toYaml (list $source (dict "repoURL" $a.repository "targetRevision" $a.revision "ref" "values")) | indent 8 }}
      {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ $namespace }}
      {{- if $v.rollouts.enabled }}
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - '.spec.rules[].backendRefs[] | select(.name == "{{ $releaseService }}" or .name == "{{ $releaseService }}-canary") | .weight'
        {{- range $service := list $releaseService (printf "%s-canary" $releaseService) }}
        - group: ''
          kind: Service
          name: {{ $service }}
          jsonPointers: ['/spec/selector/rollouts-pod-template-hash']
        {{- end }}
      {{- end }}
      syncPolicy:
        automated: {prune: true, selfHeal: true, allowEmpty: false}
        syncOptions: [FailOnSharedResource=true, ClientSideApplyMigration=false{{ if $v.rollouts.enabled }}, RespectIgnoreDifferences=true{{ end }}]
{{- end }}
