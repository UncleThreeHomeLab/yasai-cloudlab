{{- if hasKey .Values "argo-cd" }}
{{- $config := index .Values "argo-cd" "configs" "cm" "oidc.config" | fromYaml }}
{{- if not (hasSuffix "/realms/platform" $config.issuer) }}{{ fail "Approved platform identity issuer is required" }}{{- end }}
{{- $_ := set .Values "issuer" (replace "/realms/platform" "/realms/applications" $config.issuer) }}
{{- end }}
{{- range .Values.catalog }}
{{- $v := .definition }}
{{- $a := .approval }}
{{- $namespace := printf "cloudlab-app-%s" $a.name }}
{{- if and (eq ($a.chartPath | default "charts/service") "apps/notes") (ne $a.repository $.Values.repository) }}{{ fail "Notes composition requires the administrator-owned application source" }}{{- end }}
{{- $classes := list }}
{{- range concat (list $v.exposure) ($v.additionalExposures | default list) }}
{{- if ne .class "none" }}{{ $classes = append $classes .class }}{{- end }}
{{- end }}
{{- $classes = $classes | uniq | sortAlpha }}
{{- if ne $namespace $a.namespace }}
{{- fail "Service destination must be the administrator-owned namespace" }}
{{- end }}
{{- range $v.secrets }}
{{- if not (has .name $a.secretReferences) }}{{ fail "Unapproved service credential" }}{{- end }}
{{- end }}
{{- range $v.configMaps }}
{{- if not (has .name $a.configMaps) }}{{ fail "Unapproved service configuration" }}{{- end }}
{{- end }}
{{- range $v.data }}
{{- if not (has .credentialReference $a.secretReferences) }}{{ fail "Unapproved data credential" }}{{- end }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
  labels:
    cloudlab.io/owner: service-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    istio.io/dataplane-mode: ambient
    cloudlab.io/service-secrets: approved
    {{- if $classes }}
    cloudlab.io/gateway: {{ if gt (len $classes) 1 }}mixed{{ else }}{{ first $classes }}{{ end }}
    {{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: {{ $namespace }}}
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    pods: '8'
    persistentvolumeclaims: '2'
    requests.storage: 4Gi
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-ingress, namespace: {{ $namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
        - ipBlock: {cidr: 'fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128'}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $namespace }}}}
    {{- range $classes }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ printf "cloudlab-gateway-%s" . }}}}
    {{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: platform-workloads, namespace: {{ $namespace }}}
spec:
  selector:
    matchLabels: {cloudlab.io/owner: {{ $v.owner | quote }}}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- if eq ($a.chartPath | default "charts/service") "apps/notes" }}
              - {{ printf "cluster.local/ns/%s/sa/notes-web" $namespace | quote }}
              - {{ printf "cluster.local/ns/%s/sa/notes-api" $namespace | quote }}
              {{- else }}
              - {{ printf "cluster.local/ns/%s/sa/%s" $namespace $v.name | quote }}
              {{- end }}
              {{- range $classes }}
              - {{ printf "cluster.local/ns/cloudlab-gateway-%s/sa/cloudlab-istio" . | quote }}
              {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $a.name }}
  namespace: argocd
spec:
  sourceRepos: {{ list $.Values.repository $a.repository | uniq | toJson }}
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: {{ $namespace }}}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: '', kind: Service}
    - {group: '', kind: ServiceAccount}
    - {group: '', kind: ConfigMap}
    - {group: '', kind: PersistentVolumeClaim}
    - {group: apps, kind: Deployment}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $a.name }}
  namespace: argocd
  labels: {cloudlab.io/owner: service-platform}
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements: {{ if eq (.publication | default "ready") "retired" }}[]{{ else }}[{name: {{ $v.name }}}]{{ end }}
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: {{ printf "%s-{{.name}}" $a.name | quote }}
    spec:
      project: {{ $a.name }}
      {{- $helm := dict "valuesObject" $v }}
      {{- if eq ($a.chartPath | default "charts/service") "apps/notes" }}
      {{- $_ := set $helm "valuesObject" (dict "definition" $v "issuer" $.Values.issuer "telemetry" $.Values.telemetry) }}
      {{- end }}
      {{- $source := dict "repoURL" $.Values.repository "targetRevision" $.Values.revision "path" ($a.chartPath | default "charts/service") "helm" $helm }}
      {{- if eq $a.repository $.Values.repository }}
      source:
{{ toYaml $source | indent 8 }}
      {{- else }}
      {{- $_ := set $helm "valueFiles" (list (printf "$values/%s" $a.valuesPath)) }}
      sources:
{{ toYaml (list $source (dict "repoURL" $a.repository "targetRevision" $a.revision "ref" "values")) | indent 8 }}
      {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ $namespace }}
      syncPolicy:
        automated: {prune: false, selfHeal: true, allowEmpty: false}
        syncOptions: [FailOnSharedResource=true, DisableClientSideApplyMigration=true]
{{- end }}
