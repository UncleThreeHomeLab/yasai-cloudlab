{{- range .Values.catalog }}
{{- $entry := . }}
{{- $a := .approval }}
{{- with $a.composition }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-deny
  namespace: {{ $a.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- if hasKey . "connections" }}
{{- $composition := . }}
{{- $accounts := dict }}
{{- range .workloads }}{{ $_ := set $accounts .name .podSpec.serviceAccountName }}{{ end }}
{{- range $destination := .workloads }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ printf "platform-peer-%s" $destination.name }}
  namespace: {{ $a.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  selector: {matchLabels: {{ $destination.selector | toJson }}}
  action: ALLOW
  {{- $incoming := list }}
  {{- range $composition.connections }}
  {{- if eq .destination $destination.name }}{{ $incoming = append $incoming . }}{{ end }}
  {{- end }}
  rules: {{ if not $incoming }}[]{{ end }}
  {{- range $incoming }}
    - from:
        - source:
            principals: [{{ printf "cluster.local/ns/%s/sa/%s" $a.namespace (index $accounts .source) | quote }}]
      to:
        - operation: {ports: {{ .ports | toStrings | toJson }}}
  {{- end }}
{{- end }}
{{- end }}
{{- range $host, $backend := .backends }}
{{- $name := $host | sha256sum | trunc 12 }}
{{- $classes := list }}
{{- range concat (list $entry.definition.exposure) ($entry.definition.additionalExposures | default list) }}
{{- if and (ne .class "none") (eq .hostname $host) }}{{ $classes = append $classes .class }}{{ end }}
{{- end }}
{{- $classes = $classes | uniq }}
{{- if $classes }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ printf "platform-ingress-%s" $name }}, namespace: {{ $a.namespace }}}
spec:
  podSelector: {matchLabels: {{ $backend.selector | toJson }}}
  policyTypes: [Ingress]
  ingress:
    {{- range $classes }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ printf "cloudlab-gateway-%s" . }}}}
      ports: [{protocol: TCP, port: {{ $backend.port }}}, {protocol: TCP, port: 15008}]
    {{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: {{ printf "platform-gateway-%s" $name }}, namespace: {{ $a.namespace }}}
spec:
  selector: {matchLabels: {{ $backend.selector | toJson }}}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range $classes }}
              - {{ printf "cluster.local/ns/cloudlab-gateway-%s/sa/cloudlab-istio" . | quote }}
              {{- end }}
      to:
        - operation: {ports: [{{ $backend.port | quote }}]}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
