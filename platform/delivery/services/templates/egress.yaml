{{- range .Values.catalog }}
{{- $a := .approval }}
{{- if and (not (hasKey $a "composition")) (eq ($a.chartPath | default "charts/service") "charts/service") }}
{{- include "services.validateEgress" $a }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-egress
  namespace: {{ $a.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  podSelector: {}
  policyTypes: [Egress]
  {{- if or (eq (.publication | default "ready") "retired") (not $a.egress) }}
  egress: []
  {{- else }}
  egress:
    {{- range $a.egress }}
    - to:
        {{- if hasKey . "ipBlock" }}
        - ipBlock: {{ .ipBlock | toJson }}
        {{- else }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .namespace | quote }}}
          podSelector: {{ .podSelector | toJson }}
        {{- end }}
      ports: {{ .ports | toJson }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
