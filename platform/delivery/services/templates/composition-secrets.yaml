{{- range .Values.catalog }}
{{- $a := .approval }}
{{- with $a.composition }}
{{- range .secrets }}
{{- if not (has .name $a.secretReferences) }}{{ fail "Composition secret destination requires administrator approval" }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ .name }}, namespace: {{ $a.namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- range $key, $field := .fields }}
        {{ $key | quote }}: {{ printf "{{- $value := index . %q -}}{{- if not $value -}}{{- fail \"Required composition secret field is missing or empty\" -}}{{- end -}}{{ $value }}" $field | quote }}
        {{- end }}
  dataFrom:
    - extract: {key: {{ .item | quote }}}
{{- end }}
{{- end }}
{{- end }}
