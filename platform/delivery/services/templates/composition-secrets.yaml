{{- range .Values.catalog }}
{{- $a := .approval }}
{{- with $a.composition }}
{{- range .secrets }}
{{- if not (has .name $a.secretReferences) }}{{ fail "Composition secret destination requires administrator approval" }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ .name }}, namespace: {{ $a.namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- $item := .item }}
    {{- range $key, $field := .fields }}
    - secretKey: {{ $key | quote }}
      remoteRef: {key: {{ $item | quote }}, property: {{ $field | quote }}}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
