# Native caches read provider objects; only Gateway API traffic resources can change.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: argo-rollouts}
rules:
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/status, rollouts/finalizers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [argoproj.io]
    resources: [analysisruns, analysisruns/status, analysisruns/finalizers, experiments, experiments/status, experiments/finalizers]
    verbs: [get, list, watch, update, patch, create, delete]
  - apiGroups: [argoproj.io]
    resources: [analysistemplates, clusteranalysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch, update, patch, create, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, update, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices, destinationrules]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: argo-rollouts}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: argo-rollouts}
subjects: [{kind: ServiceAccount, name: argo-rollouts, namespace: argo-rollouts}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: argo-rollouts-config, namespace: argo-rollouts}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch]
  # Upstream always starts this informer with an exact name field selector.
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [argo-rollouts-notification-secret]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: argo-rollouts-config, namespace: argo-rollouts}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-rollouts-config}
subjects: [{kind: ServiceAccount, name: argo-rollouts, namespace: argo-rollouts}]
