apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: argo-rollouts}
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 512Mi
    limits.cpu: '1'
    limits.memory: 1Gi
    pods: '2'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: controller-ingress, namespace: argo-rollouts}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
        - ipBlock: {cidr: 'fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128'}
      ports: [{protocol: TCP, port: 8080}]
