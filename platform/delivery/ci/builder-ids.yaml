apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-buildkit-ids
data:
  # Exclude Pod root and the caller; newuidmap then needs no SETFCAP.
  # The inner build namespace maps IDs 0..65534 within the outer 65536 IDs.
  subuid: |
    user:1:999
    user:1001:64535
  subgid: |
    user:1:999
    user:1001:64535
