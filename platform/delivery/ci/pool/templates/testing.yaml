{{- include "cloudlab.ci.pool.normalize" . -}}
{{- if .poolEnabled }}
{{- with .Values.testing }}
{{- if $.Values.publishing }}
{{- fail "Test environment inputs cannot be mounted in a publisher pool" }}
{{- end }}
{{- $volumes := dict }}
{{- range $.Values.arc.template.spec.volumes }}
{{- if hasKey $volumes .name }}{{- fail "Duplicate runner volume" }}{{- end }}
{{- $_ := set $volumes .name . }}
{{- end }}
{{- $mounts := dict }}
{{- range (index $.Values.arc.template.spec.containers 0).volumeMounts }}
{{- if hasKey $mounts .name }}{{- fail "Duplicate runner mount" }}{{- end }}
{{- $_ := set $mounts .name . }}
{{- end }}
{{- $config := dict "name" "testing" "configMap" (dict "name" "cloudlab-testing" "defaultMode" 292) }}
{{- $private := hasPrefix "cloudlab-ci-private-" $.Release.Namespace }}
{{- $project := ternary "cloudlab-private" "cloudlab-public" $private }}
{{- if not (regexMatch (printf "^[^/]+/%s/" $project) .image) }}{{ fail "Test environment must match the pool visibility" }}{{- end }}
{{- $testingVolume := get $volumes "testing" | default dict }}
{{- $testingSource := index $testingVolume "configMap" | default dict }}
{{- if ne (toJson (dict "name" (index $testingVolume "name") "configMap" (omit $testingSource "optional"))) (toJson $config) }}
{{- fail "Test inputs must use the owned configuration and existing pull-only credential" }}
{{- end }}
{{- if and (hasKey $testingSource "optional") (ne (index $testingSource "optional") true) }}
{{- fail "Test inputs must use the owned configuration and existing pull-only credential" }}
{{- end }}
{{- $testPull := get $volumes "test-pull" | default dict }}
{{- $pullSecret := index $testPull "secret" | default dict }}
{{- $pullNames := list "harbor-test-pull" "harbor-tools-pull" }}
{{- if or (ne (index $testPull "name") "test-pull")
    (not (has ($pullSecret.secretName | default "") $pullNames))
    (ne (toJson (index $pullSecret "defaultMode")) "288")
    (ne (toJson (index $pullSecret "items")) (toJson (list (dict "key" ".dockerconfigjson" "path" "config.json")))) }}
{{- fail "Test inputs must use the owned configuration and existing pull-only credential" }}
{{- end }}
{{- if and (hasKey $pullSecret "optional") (ne (index $pullSecret "optional") true) }}
{{- fail "Test inputs must use the owned configuration and existing pull-only credential" }}
{{- end }}
{{- range $name, $path := dict "testing" "/run/cloudlab-test/config" "test-pull" "/run/cloudlab-test/registry" }}
{{- if not (deepEqual (get $mounts $name) (dict "name" $name "mountPath" $path "readOnly" true)) }}
{{- fail "Test inputs require fixed read-only runner mounts" }}
{{- end }}
{{- end }}
{{- range $.Values.arc.template.spec.initContainers }}
{{- range .volumeMounts }}
{{- if has .name (list "testing" "test-pull") }}
{{- fail "The builder must not mount test configuration or pull credentials" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: {name: cloudlab-testing, namespace: {{ $.Release.Namespace }}}
data:
  config.json: {{ toJson . | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-test-pull, namespace: {{ $.Release.Namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-test-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{{ dict %q (dict %q (dict %q .username %q .password)) | toJson }}" "auths" ((splitList "/" .image) | first) "username" "password" | quote }}
  dataFrom: [{extract: {key: {{ ternary "harbor-cloudlab-private-pull" "harbor-cloudlab-public-pull" $private }}}}]
{{- end }}
{{- end }}
