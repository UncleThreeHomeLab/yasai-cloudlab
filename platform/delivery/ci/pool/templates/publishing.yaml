{{- include "cloudlab.ci.pool.normalize" . -}}
{{- if .poolEnabled }}
{{- with .Values.publishing }}
{{- $scope := .visibility }}
{{- $releaseScope := .release_visibility | default $scope }}
{{- $manual := eq (.release_mode | default "automatic") "manual" }}
{{- $project := printf "cloudlab-%s" $scope }}
{{- with .components }}
{{- if not (hasKey . $.Values.publishing.primary_component) }}{{ fail "Publishing requires an explicit component primary" }}{{- end }}
{{- range . }}
{{- range splitList "/" .dockerfile }}
{{- if has . (list "." "..") }}{{ fail "Component Dockerfiles must remain inside source" }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if or (ne $.Values.policyName "cloudlab-ci-eligibility-publish") $.Values.manageSharedResources
    (ne $.Release.Namespace (printf "cloudlab-ci-%s-%s" $scope .application))
    (ne $.Values.arc.runnerScaleSetName (printf "cloudlab-%s-publish" .application))
    (ne $.Values.arc.githubConfigUrl (printf "https://github.com/%s" .source_repository))
    (ne .project $project) }}
{{- fail "Publishing credentials require the matching application, project and separate publisher role" }}
{{- end }}
{{- range $.Values.workflowTemplates }}
{{- if or (ne .job "publish") (ne .visibility $scope) (ne .repository_id $.Values.publishing.source_repository_id)
    (ne .job_workflow_ref (trimPrefix "https://github.com/" $.Values.publishing.workflow_identity)) }}
{{- fail "Publisher policy must bind only its approved publishing workflow and repository identity" }}
{{- end }}
{{- end }}
{{- range $.Values.eligibility }}
{{- if or (ne .ref "refs/heads/main") (not (has .event_name (list "push" "workflow_dispatch")))
    (not (has .job (list "publish" "__default"))) (ne .repository_id $.Values.publishing.source_repository_id) }}
{{- fail "Exact publisher policies require explicitly approved main revisions" }}
{{- end }}
{{- end }}
{{- range $.Values.arc.template.spec.initContainers }}
{{- range .volumeMounts }}
{{- if not (has .name (list "builder-state" "builder-run" "builder-tmp" "builder-ids")) }}
{{- fail "The builder must not mount publishing credentials or runner state" }}
{{- end }}
{{- end }}
{{- end }}
{{- $volumes := $.Values.arc.template.spec.volumes }}
{{- $mounts := (index $.Values.arc.template.spec.containers 0).volumeMounts }}
{{- $wantVolumes := list "workspace" "builder-state" "builder-run" "builder-tmp" "builder-ids" "health" "eligibility" "testing" "test-pull" "publish-config" "publish-pull" "publish-push" "signer" "github" }}
{{- $wantMounts := list "workspace=/home/runner/_work" "health=/var/run/cloudlab-health" "eligibility=/etc/cloudlab-runner" "testing=/run/cloudlab-test/config" "test-pull=/run/cloudlab-test/registry" "publish-config=/run/cloudlab-publisher/config" "publish-pull=/run/cloudlab-publisher/pull" "publish-push=/run/cloudlab-publisher/push" "signer=/run/cloudlab-publisher/signer" "github=/run/cloudlab-publisher/github" }}
{{- if $manual }}
{{- $wantVolumes = list "workspace" "builder-state" "builder-run" "builder-tmp" "builder-ids" "health" "eligibility" "testing" "test-pull" "publish-config" "publish-pull" "publish-push" "signer" }}
{{- $wantMounts = list "workspace=/home/runner/_work" "health=/var/run/cloudlab-health" "eligibility=/etc/cloudlab-runner" "testing=/run/cloudlab-test/config" "test-pull=/run/cloudlab-test/registry" "publish-config=/run/cloudlab-publisher/config" "publish-pull=/run/cloudlab-publisher/pull" "publish-push=/run/cloudlab-publisher/push" "signer=/run/cloudlab-publisher/signer" }}
{{- end }}
{{- if ne (len $volumes) (len $wantVolumes) }}{{ fail "Publisher runners require their exact overlay volumes" }}{{- end }}
{{- range $i, $want := $wantVolumes }}
{{- if ne (index $volumes $i).name $want }}{{ fail "Publisher volume order changed; keep the publisher overlays in sync" }}{{- end }}
{{- end }}
{{- if or (ne (index (index $volumes 6).configMap "name") "cloudlab-ci-eligibility-publish")
    (ne (index (index $volumes 9).configMap "name") "cloudlab-publishing")
    (ne (index (index $volumes 10).secret "secretName") "cloudlab-publish-pull")
    (ne (index (index $volumes 11).secret "secretName") "cloudlab-publish-push")
    (ne (index (index $volumes 12).secret "secretName") "cloudlab-ci-signing") }}
{{- fail "Publisher runners require the publish policy, config, credentials and signer volumes" }}
{{- end }}
{{- if and (not $manual) (ne (index (index $volumes 13).secret "secretName") "cloudlab-release") }}{{ fail "Automatic publishers require the release App volume" }}{{- end }}
{{- if ne (len $mounts) (len $wantMounts) }}{{ fail "Publisher runners require their exact overlay mounts" }}{{- end }}
{{- range $i, $want := $wantMounts }}
{{- $parts := splitList "=" $want }}
{{- $mount := index $mounts $i }}
{{- if or (ne $mount.name (index $parts 0)) (ne $mount.mountPath (index $parts 1)) }}{{ fail "Publisher mount order changed; keep the publisher overlays in sync" }}{{- end }}
{{- end }}
{{- if $manual }}
{{- range $.Values.arc.template.spec.volumes }}
{{- if or (eq .name "publish-github") (and .secret (eq .secret.secretName "cloudlab-release")) }}{{ fail "Manual promotion cannot mount release App credentials" }}{{- end }}
{{- end }}
{{- range $.Values.arc.template.spec.containers }}
{{- range .volumeMounts }}
{{- if hasPrefix "/run/cloudlab-publisher/github" .mountPath }}{{ fail "Manual promotion cannot mount release App credentials" }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: {name: cloudlab-publishing, namespace: {{ $.Release.Namespace }}}
data:
  config.json: {{ toJson . | quote }}
{{- range $role := list "pull" "push" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ printf "cloudlab-publish-%s" $role }}, namespace: {{ $.Release.Namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ printf "cloudlab-publish-%s" $role }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom: [{extract: {key: {{ printf "harbor-%s-%s" $project $role }}}}]
{{- end }}
{{- if not $manual }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cloudlab-release, namespace: {{ $.Release.Namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-release
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        app_id: '{{ "{{ .APP_ID }}" }}'
        installation_id: '{{ "{{ .INSTALLATION_ID }}" }}'
        private_key: |-
{{ $.Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: {{ printf "github-release-%s" $releaseScope }}}}]
{{- end }}
{{- if eq $scope "private" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cloudlab-ci-signing, namespace: {{ $.Release.Namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target: {name: cloudlab-ci-signing, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
    - extract: {key: ci-private-signer}
    - extract: {key: ci-private-verifier}
{{- end }}
{{- end }}
{{- end }}
