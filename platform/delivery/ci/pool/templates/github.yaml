{{- if not (or (eq .Release.Namespace "cloudlab-ci-private") (regexMatch "^cloudlab-ci-(public|private)-[a-z0-9][a-z0-9-]{0,35}$" .Release.Namespace)) }}
{{- fail "Runner App credentials require an approved repository namespace" }}
{{- end }}
{{- $public := hasPrefix "cloudlab-ci-public-" .Release.Namespace }}
{{- $item := ternary "github-arc-public" "github-arc" $public }}
{{- if ne .Values.arc.githubConfigSecret $item }}
{{- fail "Runner App credentials must match the public/private namespace boundary" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ $item }}, namespace: {{ .Release.Namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $item }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        github_app_id: '{{ "{{ .APP_ID }}" }}'
        github_app_installation_id: '{{ "{{ .INSTALLATION_ID }}" }}'
        github_app_private_key: |-
{{ .Files.Get "github-app-key.tmpl" | indent 10 }}
  dataFrom: [{extract: {key: {{ $item }}}}]
