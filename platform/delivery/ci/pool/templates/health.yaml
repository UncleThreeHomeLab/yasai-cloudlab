apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudlab-ci-health, namespace: cloudlab-ci-private}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cloudlab-ci-health}
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [list]
  - nonResourceURLs: [/readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cloudlab-ci-health}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cloudlab-ci-health}
subjects:
  - {kind: ServiceAccount, name: cloudlab-ci-health, namespace: cloudlab-ci-private}
