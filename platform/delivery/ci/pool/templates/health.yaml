{{- $role := ternary "cloudlab-ci-health" (printf "%s-health" .Release.Namespace) (eq .Release.Namespace "cloudlab-ci-private") }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudlab-ci-health, namespace: {{ .Release.Namespace }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ $role }}}
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [list]
  - nonResourceURLs: [/readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ $role }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $role }}}
subjects:
  - {kind: ServiceAccount, name: cloudlab-ci-health, namespace: {{ .Release.Namespace }}}
