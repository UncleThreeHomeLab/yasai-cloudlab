{{- $repository := trimPrefix "https://github.com/" .Values.arc.githubConfigUrl }}
{{- range .Values.arc.template.spec.volumes }}
{{- if and (eq .name "eligibility") (ne .configMap.name $.Values.policyName) }}
{{- fail "Runner policy volume must reference its own role policy" }}
{{- end }}
{{- end }}
{{- range .Values.eligibility }}
{{- if or (ne .repository $repository) (not (hasPrefix (printf "%s/.github/workflows/" $repository) .workflow_ref)) (not (hasSuffix (printf "@%s" .ref) .workflow_ref)) }}
{{- fail "Runner eligibility must match its selected repository" }}
{{- end }}
{{- if and (eq .event_name "pull_request") (ne .sha .workflow_sha) }}
{{- fail "Pull request tests require their exact reviewed merge and workflow revision" }}
{{- end }}
{{- end }}
{{- $policy := dict "workflows" .Values.eligibility | toJson }}
{{- if .Values.workflowTemplates }}
{{- if .Values.eligibility }}
{{- fail "Choose exact revisions or reviewed workflow templates" }}
{{- end }}
{{- range .Values.workflowTemplates }}
{{- if or (ne .repository $repository) (ne .workflow_path ".github/workflows/ci.yaml") }}
{{- fail "Workflow templates must match the selected application repository" }}
{{- end }}
{{- if not (contains (printf "/application-%s.yaml@" .job) .job_workflow_ref) }}
{{- fail "Reusable workflow identity must match its approved role" }}
{{- end }}
{{- end }}
{{- $policy = dict "templates" .Values.workflowTemplates | toJson }}
{{- end }}
{{- if gt (len $policy) 16384 }}
{{- fail "Runner eligibility exceeds the runner's policy limit" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Values.policyName }}, namespace: {{ .Release.Namespace }}}
data:
  eligibility.json: {{ $policy | quote }}
