# Native ARC values. The builder is qualified independently before runner registration.
minRunners: 0
maxRunners: 1
template:
  spec:
    hostUsers: false
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 30
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile: {type: RuntimeDefault}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        imagePullPolicy: Always
        command: [/home/runner/run.sh]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          appArmorProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 1Gi}
          limits: {cpu: '1', memory: 2Gi, ephemeral-storage: 8Gi}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
      - name: builder
        image: docker.io/moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
        imagePullPolicy: Always
        command: [/bin/sh, -ec]
        args:
          - |
            mkdir -p /run/user/1000
            chmod 0700 /run/user/1000
            exec rootlesskit --copy-up=/etc --copy-up=/run buildkitd \
              --addr unix:///run/user/1000/buildkit/buildkitd.sock \
              --root /home/user/.local/share/buildkit/state \
              --oci-worker-snapshotter=native --oci-worker-gc-keepstorage=4096
        env:
          - {name: XDG_RUNTIME_DIR, value: /run/user/1000}
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          procMount: Unmasked
          capabilities: {drop: [ALL], add: [SETUID, SETGID]}
          seccompProfile: {type: Localhost, localhostProfile: cloudlab/buildkit.json}
          appArmorProfile: {type: Localhost, localhostProfile: cloudlab-buildkit}
        resources:
          requests: {cpu: 500m, memory: 512Mi, ephemeral-storage: 4Gi}
          limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 24Gi}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: builder-state, mountPath: /home/user/.local/share/buildkit}
          - {name: builder-run, mountPath: /run/user}
          - {name: builder-tmp, mountPath: /tmp}
          - {name: builder-ids, mountPath: /etc/subuid, subPath: subuid, readOnly: true}
          - {name: builder-ids, mountPath: /etc/subgid, subPath: subgid, readOnly: true}
    volumes:
      - {name: workspace, emptyDir: {sizeLimit: 16Gi}}
      - {name: builder-state, emptyDir: {sizeLimit: 12Gi}}
      - {name: builder-run, emptyDir: {sizeLimit: 1Gi}}
      - {name: builder-tmp, emptyDir: {sizeLimit: 3Gi}}
      - name: builder-ids
        configMap:
          name: cloudlab-buildkit-ids
