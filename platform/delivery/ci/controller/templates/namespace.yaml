{{- if .Values.manageSystemNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-ci-system
  labels:
    cloudlab.io/owner: ci-platform
    cloudlab.io/service-secrets: approved
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.arc.flags.watchSingleNamespace }}
  labels:
    cloudlab.io/owner: ci-platform
    cloudlab.io/service-secrets: approved
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
{{- if .Values.manageSystemNamespace }}
apiVersion: v1
kind: ResourceQuota
metadata: {name: controller-budget, namespace: cloudlab-ci-system}
spec:
  hard:
    pods: '8'
    limits.cpu: 1600m
    limits.memory: 2Gi
    limits.ephemeral-storage: 1Gi
    count/autoscalinglisteners.actions.github.com: '4'
---
{{- end }}
apiVersion: v1
kind: ResourceQuota
metadata: {name: runner-budget, namespace: {{ .Values.arc.flags.watchSingleNamespace }}}
spec:
  hard:
    pods: '1'
    limits.cpu: '3'
    limits.memory: 6Gi
    limits.ephemeral-storage: 32Gi
    count/autoscalingrunnersets.actions.github.com: {{ .Values.runnerPools | quote }}
    count/ephemeralrunnersets.actions.github.com: {{ mul 2 .Values.runnerPools | quote }}
    count/ephemeralrunners.actions.github.com: {{ mul 2 .Values.runnerPools | quote }}
