# Vault item: harbor-cloudlab-public-pull. Source: private catalog binding; reconciler: ESO read-only; retention: Owner/Retain, declaration removal never deletes vault items.
{{- include "cloudlab.ci.controller.normalize" . -}}
{{- $host := first (splitList "/" .Values.arc.image.repository) }}
{{- $namespaces := list .Values.arc.flags.watchSingleNamespace }}
{{- if .Values.manageSystemNamespace }}
{{- $namespaces = prepend $namespaces "cloudlab-ci-system" }}
{{- end }}
{{- range $namespace := $namespaces }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-tools-pull, namespace: {{ $namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-tools-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{{- $user := .username -}}{{- if not $user -}}{{- fail \"Required registry username is missing or empty\" -}}{{- end -}}{{- $pass := .password -}}{{- if not $pass -}}{{- fail \"Required registry password is missing or empty\" -}}{{- end -}}{{ dict \"auths\" (dict %q (dict \"username\" $user \"password\" $pass)) | toJson }}" $host | quote }}
  dataFrom: [{extract: {key: harbor-cloudlab-public-pull}}]
{{- end }}
