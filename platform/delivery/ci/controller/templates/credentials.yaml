{{- $host := first (splitList "/" .Values.arc.image.repository) }}
{{- range $namespace := list "cloudlab-ci-system" "cloudlab-ci-private" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-tools-pull, namespace: {{ $namespace }}}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-tools-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{{ dict \"auths\" (dict %q (dict \"username\" .username \"password\" .password)) | toJson }}" $host | quote }}
  dataFrom: [{extract: {key: harbor-cloudlab-public-pull}}]
{{- end }}
