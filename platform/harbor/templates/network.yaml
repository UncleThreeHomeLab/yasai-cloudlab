{{- if .Values.enabled }}
{{- if not (regexMatch "^harbor[.]internal[.][a-z0-9.-]+$" .Values.harborHost) }}{{ fail "Harbor requires its exact private hostname" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: harbor-boundary, namespace: cloudlab-harbor}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
        - ipBlock: {cidr: 'fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128'}
  egress:
    - to: [{podSelector: {}}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudlab-gateway-public}}}]
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 15008}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: private-registry-ingress, namespace: cloudlab-harbor}
spec:
  podSelector:
    matchExpressions: [{key: component, operator: In, values: [nginx, browser]}]
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudlab-gateway-private}}}]
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 4180}, {protocol: TCP, port: 15008}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: registry-gateway, namespace: cloudlab-harbor}
spec:
  selector: {matchLabels: {component: nginx}}
  action: ALLOW
  rules:
    - from: [{source: {principals: ['cluster.local/ns/cloudlab-gateway-private/sa/cloudlab-istio']}}]
      to: [{operation: {ports: ['8080']}}]
    - from: [{source: {principals: ['cluster.local/ns/cloudlab-harbor/sa/harbor-browser']}}]
      to: [{operation: {ports: ['8080']}}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: browser-gateway, namespace: cloudlab-harbor}
spec:
  selector: {matchLabels: {component: browser}}
  action: ALLOW
  rules:
    - from: [{source: {principals: ['cluster.local/ns/cloudlab-gateway-private/sa/cloudlab-istio']}}]
      to: [{operation: {ports: ['4180']}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: harbor, namespace: cloudlab-harbor}
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: cloudlab, namespace: cloudlab-gateway-private, sectionName: https}]
  hostnames: [{{ .Values.harborHost | quote }}]
  rules:
    # Machine routes cannot reuse Harbor's otherwise sliding browser sessions.
    - matches:
        - {path: {type: PathPrefix, value: /v2}}
        - {path: {type: Exact, value: /service/token}}
        - path: {type: PathPrefix, value: /api/v2.0}
          headers: [{name: Authorization, type: RegularExpression, value: '^Basic [A-Za-z0-9+/]+=*$'}]
        - path: {type: PathPrefix, value: /api/v2.0}
          headers: [{name: Authorization, type: RegularExpression, value: '^Bearer [A-Za-z0-9._~+/-]+=*$'}]
      filters: [{type: RequestHeaderModifier, requestHeaderModifier: {remove: [Cookie]}}]
      timeouts: {request: 600s, backendRequest: 600s}
      backendRefs: [{group: '', kind: Service, name: harbor, port: 80, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      timeouts: {request: 600s, backendRequest: 600s}
      backendRefs: [{group: '', kind: Service, name: harbor-browser, port: 4180, weight: 1}]
{{- end }}
