{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
{{- range $item := list "harbor-emergency" "harbor-runtime" "harbor-browser-key" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ $item }}, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target: {name: {{ $item }}, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom: [{extract: {key: {{ $item }}}}]
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-token-signing, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-token-signing
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        tls.key: '{{ "{{ .tls_key }}" }}'
        tls.crt: '{{ "{{ .tls_crt }}" }}'
  dataFrom: [{extract: {key: harbor-token-signing}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-database, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: '{{ "{{ .password }}" }}'
        POSTGRES_PASSWORD: '{{ "{{ .password }}" }}'
  dataFrom: [{extract: {key: harbor-database}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-oidc, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        configuration: >-
          {"auth_mode":"oidc_auth","oidc_name":"Keycloak","oidc_endpoint":"https://{{ .Values.loginHost }}/realms/platform","oidc_client_id":"harbor","oidc_client_secret":{{ "{{ (fromJson .client_secrets).platform.harbor | toJson }}" }},"oidc_groups_claim":"groups","oidc_admin_group":"/platform-admin","oidc_scope":"openid,profile,email","oidc_verify_cert":true,"oidc_auto_onboard":true,"oidc_user_claim":"sub","project_creation_restriction":"adminonly","self_registration":false,"token_expiration":{{ $policy.registry_token_minutes }},"session_timeout":5}
  dataFrom: [{extract: {key: keycloak-client-secrets}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-browser-oidc, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-browser-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client_secret: '{{ "{{ (fromJson .client_secrets).platform.harbor }}" }}'
  dataFrom: [{extract: {key: keycloak-client-secrets}}]
{{- end }}
