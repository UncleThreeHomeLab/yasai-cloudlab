# Vault items: harbor-emergency, harbor-runtime, harbor-browser-key, harbor-recovery-verifier, harbor-token-signing (tls.key/tls.crt), harbor-database, keycloak-client-secrets (OIDC harbor). Source: private catalog bindings; reconciler: ESO read-only; retention: Owner/Retain, declaration removal never deletes vault items.
{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
{{- range $item := list "harbor-emergency" "harbor-runtime" "harbor-browser-key" "harbor-recovery-verifier" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ $item }}, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target: {name: {{ $item }}, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom: [{extract: {key: {{ $item }}}}]
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-token-signing, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-token-signing
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        tls.key: '{{ `{{- $value := index . "tls_key" -}}{{- if not $value -}}{{- fail "Required TLS field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        tls.crt: '{{ `{{- $value := index . "tls_crt" -}}{{- if not $value -}}{{- fail "Required TLS field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
  dataFrom: [{extract: {key: harbor-token-signing}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-database, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: '{{ `{{- $value := index . "password" -}}{{- if not $value -}}{{- fail "Required application secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        POSTGRES_PASSWORD: '{{ `{{- $value := index . "password" -}}{{- if not $value -}}{{- fail "Required application secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
  dataFrom: [{extract: {key: harbor-database}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-oidc, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        configuration: >-
          {"auth_mode":"oidc_auth","oidc_name":"Keycloak","oidc_endpoint":"https://{{ .Values.loginHost }}/realms/platform","oidc_client_id":"harbor","oidc_client_secret":{{ printf "{{- $value := index (index (.client_secrets | fromJson) %q) %q -}}{{- if not (and (kindIs \"string\" $value) $value) -}}{{- fail \"Required OIDC client secret must be a nonempty string\" -}}{{- end -}}{{ $value | toJson }}" "platform" "harbor" }},"oidc_groups_claim":"groups","oidc_admin_group":"/platform-admin","oidc_scope":"openid,profile,email","oidc_verify_cert":true,"oidc_auto_onboard":true,"oidc_user_claim":"sub","project_creation_restriction":"adminonly","self_registration":false,"token_expiration":{{ $policy.registry_token_minutes }},"session_timeout":5}
  dataFrom: [{extract: {key: keycloak-client-secrets}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: harbor-browser-oidc, namespace: cloudlab-harbor}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: harbor-browser-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client_secret: {{ printf "{{- $value := index (index (.client_secrets | fromJson) %q) %q -}}{{- if not (and (kindIs \"string\" $value) $value) -}}{{- fail \"Required OIDC client secret must be a nonempty string\" -}}{{- end -}}{{ $value }}" "platform" "harbor" | quote }}
  dataFrom: [{extract: {key: keycloak-client-secrets}}]
{{- end }}
