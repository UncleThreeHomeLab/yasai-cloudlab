{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-harbor
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    cloudlab.io/owner: harbor-platform
    cloudlab.io/service-secrets: approved
    cloudlab.io/gateway: private
    istio.io/dataplane-mode: ambient
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudlab-harbor, namespace: cloudlab-harbor}
automountServiceAccountToken: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloudlab-harbor
  labels: {cloudlab.io/owner: harbor-platform}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storageclass.kubernetes.io/is-default-class: 'false'
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: '2'
  staleReplicaTimeout: '30'
  dataLocality: disabled
  fsType: ext4
  backupCompressionMethod: lz4
  # Only the coordinated registry owner may export these volumes.
  recurringJobSelector: '[{"name":"harbor-coordinated","isGroup":true}]'
{{- range $name, $size := $policy.claims_gib }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-{{ $name }}
  namespace: cloudlab-harbor
  labels: {cloudlab.io/owner: harbor-platform, cloudlab.io/recovery-component: {{ $name }}}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cloudlab-harbor
  resources: {requests: {storage: {{ printf "%dGi" ($size | int) }}}}
{{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: harbor-budget, namespace: cloudlab-harbor}
spec:
  hard:
    requests.cpu: '2'
    limits.cpu: {{ printf "%dm" ($policy.cpu_limit_millicores | int) | quote }}
    requests.memory: 4Gi
    limits.memory: {{ printf "%dMi" ($policy.memory_limit_mib | int) | quote }}
    requests.storage: {{ printf "%dGi" (add $policy.claims_gib.registry $policy.claims_gib.database $policy.claims_gib.redis) }}
    persistentvolumeclaims: '3'
    pods: '10'
{{- end }}
