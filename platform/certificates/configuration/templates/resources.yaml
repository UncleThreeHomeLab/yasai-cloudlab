{{- range $name := list "cloudlab-gateway-public" "cloudlab-gateway-private" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: '-30'}
  labels:
    cloudlab.io/gateway: {{ trimPrefix "cloudlab-gateway-" $name }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    istio-injection: disabled
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudlab-acme-production
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cloudlab-acme-production
    solvers:
      - selector:
          dnsZones: [{{ .Values.zone | quote }}]
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudlab-dns01
              key: API_TOKEN
{{- if .Values.production }}
{{- range $type := list "public" "private" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudlab-gateway
  namespace: cloudlab-gateway-{{ $type }}
  annotations: {argocd.argoproj.io/sync-wave: '10'}
spec:
  secretName: cloudlab-gateway-tls
  revisionHistoryLimit: 2
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {name: cloudlab-acme-production, kind: ClusterIssuer}
  dnsNames:
    - {{ if eq $type "public" }}{{ printf "*.%s" $.Values.zone | quote }}{{ else }}{{ printf "*.internal.%s" $.Values.zone | quote }}{{ end }}
    {{- if eq $type "private" }}
    - {{ printf "login.%s" $.Values.zone | quote }}
    {{- end }}
{{- end }}
{{- end }}
