# CloudLab/cloudlab-dns01: API_TOKEN and ZONE_ID. Limit the token to this zone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-dns01
  namespace: cert-manager
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: {{ .Values.cloudlab.store | quote }}
    kind: ClusterSecretStore
  target:
    name: cloudlab-dns01
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        API_TOKEN: '{{ `{{- $value := index . "API_TOKEN" -}}{{- if not $value -}}{{- fail "Required DNS credential field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        ZONE_ID: '{{ `{{- $value := index . "ZONE_ID" -}}{{- if not $value -}}{{- fail "Required DNS credential field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
  dataFrom:
    - extract:
        key: cloudlab-dns01
