# CloudLab/cloudlab-dns01: API_TOKEN and ZONE_ID. Limit the token to this zone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-dns01
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.cloudlab.store | quote }}
    kind: ClusterSecretStore
  target:
    name: cloudlab-dns01
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        API_TOKEN: '{{ "{{ .API_TOKEN }}" }}'
        ZONE_ID: '{{ "{{ .ZONE_ID }}" }}'
  dataFrom:
    - extract:
        key: cloudlab-dns01
