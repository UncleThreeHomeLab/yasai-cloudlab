apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.cloudlab.store | quote }}
spec:
  conditions:
    - namespaces: {{ .Values.cloudlab.consumerNamespaces | toJson }}
  provider:
    onepasswordSDK:
      vault: {{ .Values.cloudlab.vault | quote }}
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          namespace: external-secrets
          key: token
