# Vault items: grafana-emergency, kiali-signing-key, keycloak-client-secrets (OIDC grafana/kiali). Source: private catalog bindings; reconciler: ESO read-only; retention: Owner/Retain, declaration removal never deletes vault items.
{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
{{- range $entry := list (dict "name" "grafana-emergency" "fields" (list "username" "password" "secret_key")) (dict "name" "kiali-signing-key" "fields" (list "key")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
  namespace: {{ $policy.namespace }}
  {{- if $.Values.nativeLifecycle.enabled }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
  {{- end }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: {key: {{ $entry.name }}}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: {{ $policy.namespace }}
  {{- if .Values.nativeLifecycle.enabled }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
  {{- end }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client_secret: {{ printf "{{- $value := index (index (.client_secrets | fromJson) %q) %q -}}{{- if not (and (kindIs \"string\" $value) $value) -}}{{- fail \"Required OIDC client secret must be a nonempty string\" -}}{{- end -}}{{ $value }}" "platform" "grafana" | quote }}
  dataFrom:
    - extract: {key: keycloak-client-secrets}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-oidc
  namespace: {{ $policy.namespace }}
  {{- if .Values.nativeLifecycle.enabled }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
  {{- end }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: kiali
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        oidc-secret: {{ printf "{{- $value := index (index (.client_secrets | fromJson) %q) %q -}}{{- if not (and (kindIs \"string\" $value) $value) -}}{{- fail \"Required OIDC client secret must be a nonempty string\" -}}{{- end -}}{{ $value }}" "platform" "kiali" | quote }}
  dataFrom:
    - extract: {key: keycloak-client-secrets}
{{- end }}
