{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
{{- range $entry := list (dict "name" "grafana-emergency" "fields" (list "username" "password" "secret_key")) (dict "name" "kiali-signing-key" "fields" (list "key")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
  namespace: {{ $policy.namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $field := $entry.fields }}
    - secretKey: {{ $field }}
      remoteRef: {key: {{ $entry.name }}, property: {{ $field }}}
    {{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: {{ $policy.namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client_secret: '{{ "{{ (fromJson .client_secrets).platform.grafana }}" }}'
  data:
    - secretKey: client_secrets
      remoteRef: {key: keycloak-client-secrets, property: client_secrets}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-oidc
  namespace: {{ $policy.namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: kiali
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        oidc-secret: '{{ "{{ (fromJson .client_secrets).platform.kiali }}" }}'
  data:
    - secretKey: client_secrets
      remoteRef: {key: keycloak-client-secrets, property: client_secrets}
{{- end }}
