{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-alloy
  namespace: {{ $policy.namespace }}
data:
  config.alloy: |
{{ .Files.Get "config.alloy" | indent 4 }}
{{- if .Values.monitoringEnabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: notes
  namespace: {{ $policy.namespace }}
  labels: {service: notes-api}
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector: {matchNames: [cloudlab-app-notes]}
  selector:
    matchLabels: {cloudlab.io/telemetry: safe}
  podMetricsEndpoints:
    - {port: metrics, interval: 30s, scrapeTimeout: 10s}
  sampleLimit: 10000
  labelLimit: 40
  labelValueLengthLimit: 200
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  namespace: {{ $policy.namespace }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: alloy, app.kubernetes.io/instance: cloudlab-alloy}
  endpoints:
    - {port: http-metrics, interval: 30s, scrapeTimeout: 10s}
  sampleLimit: 10000
{{- end }}
{{- end }}
