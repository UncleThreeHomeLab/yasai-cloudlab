{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-alloy
  namespace: {{ $policy.namespace }}
data:
  config.alloy: |
{{ .Files.Get "config.alloy" | indent 4 }}
{{ include "observability.serviceLogs" . | indent 4 }}
{{- if not .Values.nativeLifecycle.enabled }}
{{ include "observability.baselineMonitors" . }}
{{- end }}
{{- end }}
