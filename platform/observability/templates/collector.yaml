{{- if .Values.enabled }}
{{- $policy := .Files.Get "policy.json" | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-alloy
  namespace: {{ $policy.namespace }}
data:
  config.alloy: |
{{ .Files.Get "config.alloy" | indent 4 }}
{{- if .Values.monitoringEnabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: notes
  namespace: {{ $policy.namespace }}
  labels: {service: notes-api}
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector: {matchNames: [cloudlab-app-notes]}
  selector:
    matchLabels: {cloudlab.io/telemetry: safe}
  podMetricsEndpoints:
    - {port: http-metrics, interval: 30s, scrapeTimeout: 10s}
  sampleLimit: 10000
  labelLimit: 40
  labelValueLengthLimit: 200
{{- range $monitor := list
    (dict "name" "mesh-control" "namespaces" (list "istio-system") "label" "app" "value" "istiod" "port" "http-monitoring" "path" "/metrics")
    (dict "name" "mesh-ambient" "namespaces" (list "istio-system") "label" "app" "value" "ztunnel" "port" "ztunnel-stats" "path" "/metrics")
    (dict "name" "mesh-gateways" "namespaces" (list "cloudlab-gateway-public" "cloudlab-gateway-private") "label" "gateway.networking.k8s.io/gateway-name" "value" "cloudlab" "port" "metrics" "path" "/stats/prometheus") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $monitor.name }}
  namespace: {{ $policy.namespace }}
spec:
  namespaceSelector: {matchNames: {{ $monitor.namespaces | toJson }}}
  selector:
    matchLabels: { {{ $monitor.label | quote }}: {{ $monitor.value | quote }} }
  podMetricsEndpoints:
    - {port: {{ $monitor.port | quote }}, path: {{ $monitor.path | quote }}, interval: 30s, scrapeTimeout: 10s}
  sampleLimit: 10000
  labelLimit: 40
  labelValueLengthLimit: 200
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  namespace: {{ $policy.namespace }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: alloy, app.kubernetes.io/instance: cloudlab-alloy}
  endpoints:
    - {port: http-metrics, interval: 30s, scrapeTimeout: 10s}
  sampleLimit: 10000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: native-dns
  namespace: {{ $policy.namespace }}
spec:
  namespaceSelector: {matchNames: [kube-system]}
  selector:
    matchLabels: {k8s-app: kube-dns}
  endpoints:
    - {port: metrics, interval: 30s, scrapeTimeout: 10s}
  sampleLimit: 10000
  labelLimit: 40
  labelValueLengthLimit: 200
{{- end }}
{{- end }}
