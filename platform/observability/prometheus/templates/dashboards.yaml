apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-dashboards
  namespace: {{ .Release.Namespace }}
  {{- if or .Values.serviceCatalogRevision .Values.nativeInputDigest }}
  annotations:
    {{- with .Values.serviceCatalogRevision }}
    cloudlab.io/service-catalog-revision: {{ . | quote }}
    {{- end }}
    {{- with .Values.nativeInputDigest }}
    cloudlab.io/observability-input-digest: {{ . | quote }}
    {{- end }}
  {{- end }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{- if and (eq (base $path) "active-alerts.json") $.Values.serviceDashboardLinks }}
{{- $board := $.Files.Get $path | fromJson }}
{{- $_ := set $board "links" $.Values.serviceDashboardLinks }}
{{ toPrettyJson $board | indent 4 }}
{{- else }}
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
{{- range $name, $raw := .Values.serviceDashboards | default dict }}
{{- if or (not (regexMatch "^svc-[a-z][a-z0-9-]{0,30}[.]json$" $name)) ($.Files.Get (printf "dashboards/%s" $name)) }}
{{- fail "Service dashboard filename is invalid or conflicts with public inventory" }}
{{- end }}
  {{ $name }}: |
{{ $raw | indent 4 }}
{{- end }}
