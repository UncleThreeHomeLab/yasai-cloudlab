nativeSource:
  repository: ''
  revision: ''
  valuesRepository: ''
catalog: null
observabilityInputs: {}
# Gates owned elsewhere: SMTP accounts must already exist; Alertmanager egress
# stays with the workload/network owners; webhook mesh identity and method/path
# enforcement need a qualified waypoint or application enforcement. Incident
# silences stay runtime operations; timeIntervals carry recurring maintenance.
platformNotifications:
  enabled: false
  fallbackReceiver: ''
  receivers: []
  subscriptions: []
  groupWaitSeconds: 10
  groupIntervalSeconds: 60
  repeatIntervalSeconds: 14400
  timeIntervals: []
  muteWindows: []
  inhibitRules: []
alertmanagerState:
  storageClass: cloudlab-telemetry
  sizeGiB: 1
serviceObservability: {}
