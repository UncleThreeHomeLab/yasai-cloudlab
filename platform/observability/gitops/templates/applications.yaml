{{- $source := .Values.nativeSource }}
{{- $inputs := .Values.observabilityInputs }}
{{- $digest := toJson (dict "catalog" .Values.catalog "observabilityInputs" $inputs "platformNotifications" .Values.platformNotifications "serviceObservability" .Values.serviceObservability "alertmanagerState" .Values.alertmanagerState) | sha256sum }}
{{- if eq $source.repository $source.valuesRepository }}{{ fail "Telemetry values require the distinct designated private source" }}{{ end }}
{{- $zone := trimPrefix "login." $inputs.loginHost }}
{{- if or (ne $inputs.grafanaHost (printf "grafana.internal.%s" $zone)) (ne $inputs.kialiHost (printf "kiali.internal.%s" $zone)) }}
{{- fail "Telemetry hosts must match the accepted identity zone" }}
{{- end }}
{{- $names := dict }}
{{- range .Values.catalog }}
{{- if or (ne .approval.name .definition.name) (ne .approval.namespace (printf "cloudlab-app-%s" .approval.name)) (hasKey $names .approval.name) }}
{{- fail "Telemetry catalog requires distinct approved service identities" }}
{{- end }}
{{- $_ := set $names .approval.name true }}
{{- end }}
{{- $issuer := printf "https://%s/realms/platform" $inputs.loginHost }}
{{- $protocol := printf "%s/protocol/openid-connect" $issuer }}
{{- $grafana := printf "https://%s" $inputs.grafanaHost }}
{{- $notifications := include "observability.notifications" . | fromYaml }}
{{- $services := include "observability.services" . | fromJson }}
{{- $configurationValues := merge (dict "enabled" true "nativeLifecycle" (dict "enabled" true) "serviceMetrics" $services.bindings "serviceLogs" $services.logs) (deepCopy $inputs) }}
{{- $prometheusLifecycle := dict "enabled" true "monitoringEnabled" $inputs.monitoringEnabled "grafanaHost" $inputs.grafanaHost "serviceMetrics" $services.bindings "serviceRules" $services.rules }}
{{- $prometheusValues := dict "nativeLifecycle" $prometheusLifecycle "nativeInputDigest" $digest "serviceDashboards" $services.dashboards "serviceDashboardLinks" $services.links "kube-prometheus-stack" (dict
  "cloudlabNativeLifecycle" true
  "alertmanager" (dict "config" $notifications.config "alertmanagerSpec" (dict
    "secrets" $notifications.secrets
    "persistentVolumeClaimRetentionPolicy" (dict "whenDeleted" "Retain" "whenScaled" "Retain")
    "storage" (dict "emptyDir" nil "volumeClaimTemplate" (dict
      "metadata" (dict "annotations" (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false"))
      "spec" (dict "storageClassName" $.Values.alertmanagerState.storageClass "accessModes" (list "ReadWriteOnce") "resources" (dict "requests" (dict "storage" (printf "%dGi" (int $.Values.alertmanagerState.sizeGiB)))))))))
  "grafana" (dict "persistence" (dict "annotations" (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false")) "grafana.ini" (dict
    "server" (dict "root_url" $grafana)
    "auth" (dict "signout_redirect_url" (printf "%s/logout?post_logout_redirect_uri=%s" $protocol (urlquery (printf "%s/login" $grafana))))
    "auth.generic_oauth" (dict "auth_url" (printf "%s/auth" $protocol) "token_url" (printf "%s/token" $protocol) "api_url" (printf "%s/userinfo" $protocol))))) }}
{{- $kialiValues := dict "nativeLifecycle" (dict "enabled" true "kialiHost" $inputs.kialiHost) "kiali-server" (dict "auth" (dict "openid" (dict "issuer_uri" $issuer)) "external_services" (dict "grafana" (dict "external_url" $grafana)) "server" (dict "web_fqdn" $inputs.kialiHost "web_port" "443" "web_schema" "https")) }}
{{- $lokiValues := dict "loki" (dict "cloudlabNativeLifecycle" true "singleBinary" (dict "persistence" (dict "enableStatefulSetAutoDeletePVC" true "whenDeleted" "Retain" "whenScaled" "Retain"))) }}
{{- $tempoValues := dict "tempo" (dict "persistence" (dict "enableStatefulSetAutoDeletePVC" false)) }}
{{- $overrides := dict "configuration" $configurationValues "prometheus" $prometheusValues "kiali" $kialiValues "loki" $lokiValues "tempo" $tempoValues }}
{{- range $component := list "configuration" "prometheus" "loki" "tempo" "alloy" "kiali" }}
{{- $values := get $overrides $component | default dict }}
{{- $_ := set $values "nativeInputDigest" $digest }}
{{- $lifecycle := get $values "nativeLifecycle" | default dict }}
{{- $_ := set $lifecycle "enabled" true }}
{{- $_ := set $values "nativeLifecycle" $lifecycle }}
{{- $_ := set $overrides $component $values }}
{{- end }}
{{- if gt (len (toJson $overrides)) 196608 }}{{ fail "Aggregate telemetry inline overrides exceed 192KiB" }}{{ end }}
{{- range $component := list "configuration" "prometheus" "loki" "tempo" "alloy" "kiali" }}
{{- $configuration := eq $component "configuration" }}
{{- $name := ternary "cloudlab-observability" (printf "cloudlab-%s" $component) $configuration }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  labels: {cloudlab.io/owner: observability-platform}
  annotations:
    cloudlab.io/observability-input-digest: {{ $digest | quote }}
    cloudlab.io/observability-health: required
    argocd.argoproj.io/sync-wave: {{ ternary "-20" "0" $configuration | quote }}
    {{- if eq $component "prometheus" }}
    cloudlab.io/notification-delivery: {{ ternary "candidate" "unconfigured" $.Values.platformNotifications.enabled | quote }}
    {{- end }}
spec:
  project: cloudlab-observability
  source:
      repoURL: {{ $source.repository | quote }}
      targetRevision: {{ $source.revision | quote }}
      path: platform/observability{{ if not $configuration }}/{{ $component }}{{ end }}
      helm:
        releaseName: {{ $name }}
        {{- if not $configuration }}
        valueFiles: [values.json]
        {{- end }}
        {{- if hasKey $overrides $component }}
        valuesObject:
{{ toYaml (get $overrides $component) | indent 10 }}
        {{- end }}
  destination: {server: 'https://kubernetes.default.svc', namespace: cloudlab-observability}
  revisionHistoryLimit: {{ ternary 0 10 (eq $component "prometheus") }}
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [FailOnSharedResource=true, ServerSideApply=true, DisableClientSideApplyMigration=true, PruneLast=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 1m}
{{- end }}
