{{- range $namespace := list "tailscale" "cloudlab-connectors" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    # Connectors retain their own transport; never enroll them in ambient capture.
    istio.io/dataplane-mode: none
    istio-injection: disabled
{{- end }}
{{- range $credential := list
      (dict "namespace" "tailscale" "name" "operator-oauth" "item" "tailscale-operator" "fields" (dict "client_id" "CLIENT_ID" "client_secret" "CLIENT_SECRET"))
      (dict "namespace" "cloudlab-connectors" "name" "cloudflared-runtime" "item" "cloudflare-tunnel" "fields" (dict "token" "TUNNEL_TOKEN")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $credential.name }}
  namespace: {{ $credential.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloudlab
    kind: ClusterSecretStore
  target:
    name: {{ $credential.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- range $key, $field := $credential.fields }}
        {{ $key }}: {{ printf "{{ .%s }}" $field | quote }}
        {{- end }}
  dataFrom:
    - extract:
        key: {{ $credential.item }}
{{- end }}
