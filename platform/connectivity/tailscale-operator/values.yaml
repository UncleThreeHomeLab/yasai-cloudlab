tailscale-operator:
  installCRDs: true
  ingressClass:
    enabled: false
  operatorConfig:
    hostname: cloudlab-operator
    defaultTags: [tag:cloudlab-operator]
    image:
      repository: tailscale/k8s-operator
      digest: sha256:3c8958c42fb3c46068e8553e11b944f2133b4671d4f36c86adc11f206746bf34
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 200m, memory: 256Mi}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    podSecurityContext:
      seccompProfile: {type: RuntimeDefault}
  proxyConfig:
    image:
      repository: tailscale/tailscale
      digest: sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    defaultTags: tag:cloudlab-ingress-proxy
  apiServerProxyConfig:
    mode: "false"
    allowImpersonation: "true"
