profiles:
  viewer:
    namespaceRules: &workloadReads
      - apiGroups: ['']
        resources: [pods, services, events]
        verbs: [get, list]
      - apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
        verbs: [get, list]
      - apiGroups: [batch]
        resources: [jobs, cronjobs]
        verbs: [get, list]
    clusterRules: []
  developer:
    namespaceRules: *workloadReads
    clusterRules: []
  platform-engineer:
    namespaceRules: *workloadReads
    clusterRules:
      - apiGroups: ['']
        resources: [nodes]
        verbs: [get, list]
  approver:
    # Approval happens in the breakglass UI/API; this profile binds approver
    # identities with the same read-only review context, nothing more.
    namespaceRules: *workloadReads
    clusterRules: []
  machine-read:
    # Narrow read-only subset for audience-bound short-lived machine credentials.
    namespaceRules:
      - apiGroups: ['']
        resources: [pods, services]
        verbs: [get, list]
    clusterRules: []
