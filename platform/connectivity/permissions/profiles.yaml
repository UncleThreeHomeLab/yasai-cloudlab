profiles:
  viewer:
    namespaceRules: &workloadReads
      - apiGroups: ['']
        resources: [pods, services, events]
        verbs: [get, list]
      - apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
        verbs: [get, list]
      - apiGroups: [batch]
        resources: [jobs, cronjobs]
        verbs: [get, list]
    clusterRules: []
  developer:
    namespaceRules: *workloadReads
    clusterRules: []
  platform-engineer:
    namespaceRules: *workloadReads
    clusterRules:
      - apiGroups: ['']
        resources: [nodes]
        verbs: [get, list]
