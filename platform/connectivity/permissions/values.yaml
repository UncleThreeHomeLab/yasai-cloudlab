# Verify-first activation order: 1) promote the service catalog pin first,
# 2) verify the admission guard, 3) pin the permissions revision,
# 4) record the acceptance commitment, 5) enable with zero assignments and
# verify zero bindings. Empty-grant fixture: gitops/fixtures/public/permissions-empty.yaml.
# Repair = fix the source forward (last-valid retained, never empty-apply);
# narrow = reduce scope; retire with state: retired and assignments: [].
# Required private platform/permissions.yaml example (existing identities only):
# permissions:
#   state: active
#   assignments:
#     - id: example-reader
#       profile: viewer
#       subject: {kind: ServiceAccount, name: reader, namespace: cloudlab-app-example}
#       scope: {namespace: cloudlab-app-example}
# Public profiles.yaml owns rules; cluster: true requires separate cluster rules.
# Retire with state: retired and assignments: []; retain the owner and roles.
# Replace identity/scope/profile/ID only after removal sync, binding absence and
# fresh request denial. RBAC is additive; existing streams can survive revocation.
# Missing/invalid sources retain prior grants; disabling the owner does not revoke.
mode: bindings
context: {repository: '', revision: '', commitment: '', namespace: argocd}
permissions: {}
