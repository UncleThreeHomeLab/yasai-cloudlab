# Backend adapter contracts for temporary permissions grants (access plan A4, public part).
# Desired source: this file. Field owner: connectivity/permissions owner.
# Reconciler: the selected backend only; only the selected adapter below reconciles.
# Credentials: none held here; a backend uses only its own approved credentials.
# Deletion policy: contract removal withdraws backend authorization; issued bindings expire or are deleted, never retained.
version: cloudlab-permissions-backend-adapters/v1
adapters:
  - name: k8s-breakglass
    version: v0.3.0-rc.20
    scope: human-only temporary Kubernetes RBAC grants through reviewed profiles
    owner: connectivity/permissions owner
    install: platform/connectivity/permissions/breakglass at the pinned platform revision
    credentials: none held; human OIDC via Keycloak only, no service credentials in the adapter
    expiry: session TTL within shared bounds (15/10/5 minutes); maxValidFor at or under the bound; no renewal
    deletion: sessions expire by TTL and are deleted on revocation; removal is followed by binding absence plus fresh denial
    idempotency: issuance and revocation carry durable session IDs; repeat revocation is a no-op and repeat issuance binds to the existing approval, never duplicating grants
    retention: contract removal withdraws backend authorization; issued bindings expire by TTL or are deleted on revocation, never retained
    unsupported: machine sessions via breakglass, spend/count usage budgets, standing grants, custom IAM, UID-based adoption and automatic renewal fail closed (rejected, never partially applied)
rules:
  inputs: A request carries an existing beneficiary identity, a reviewed profile name, a namespace or cluster scope, a TTL within shared bounds and an immutable approval binding requester, beneficiary, backend, canonical target IDs, actions, policy revision, TTL and usage budget.
  outputs: Native RBAC RoleBinding or ClusterRoleBinding objects only, referencing existing cloudlab-permissions ClusterRoles; backends create no roles and no authority-bearing custom resources.
  uiApi: "UI, bgctl and REST enforce identical server-side rules: requester isolation, self-approval rejection (blockSelfApproval true), changed-scope rejection and per-operation rechecks; clients add no authority."
  lifecycle: Bindings expire by TTL and are deleted on revocation; removal is followed by binding absence plus fresh denial. RBAC is additive; existing streams can survive revocation.
  outage: Backend outage fails closed for new grants; restarts issue nothing and preserve no grants; held sessions stay bounded by TTL and audit.
  audit: "Secret-free events only: session ID, requester/beneficiary opaque IDs, backend, actions, policy revision, TTL, decision and expiry; never tokens, credentials or private data."
  prohibitions: No standing grants, no custom IAM, no UID-based adoption, no private data in public Git, no automatic renewal.
