{{- include "cloudlab.data.normalize" . -}}
{{- $settings := .dataSettings -}}
{{- if or (eq $settings.applicationRole $settings.migrationRole) (eq $settings.applicationRole $settings.backupRole) (eq $settings.migrationRole $settings.backupRole) }}
{{- fail "Application, migration and backup roles must differ" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cloudlab-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    cnpg.io/hibernation: {{ ternary "on" "off" $settings.hibernated | quote }}
  labels:
    cloudlab.io/backup-path: coordinated-longhorn
spec:
  instances: 1
  imageName: {{ $settings.postgresImage | quote }}
  enableSuperuserAccess: false
  storage: {size: 16Gi, storageClass: cloudlab-data}
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: '2', memory: 4Gi}
  bootstrap:
    initdb:
      database: {{ $settings.database | quote }}
      owner: {{ $settings.migrationRole | quote }}
      secret: {name: notes-migration}
      dataChecksums: true
      postInitSQL:
        - REVOKE CONNECT ON DATABASE postgres FROM PUBLIC
        - REVOKE CONNECT ON DATABASE template1 FROM PUBLIC
      postInitApplicationSQL:
        - {{ printf "REVOKE ALL ON DATABASE %s FROM PUBLIC" $settings.database | quote }}
        - REVOKE CREATE ON SCHEMA public FROM PUBLIC
  managed:
    roles:
      {{- range $settings.serviceRequests }}
      {{- if .database }}
      {{- range $role := list (dict "name" .database.applicationRole "secret" (printf "%s-application" .service)) (dict "name" .database.migrationRole "secret" (printf "%s-migration" .service)) }}
      - name: {{ $role.name | quote }}
        ensure: present
        login: {{ not $settings.maintenance }}
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        connectionLimit: 10
        inRoles: []
        passwordSecret: {name: {{ $role.secret }}}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $role := list (dict "name" $settings.applicationRole "secret" "notes-application") (dict "name" $settings.migrationRole "secret" "notes-migration") (dict "name" $settings.backupRole "secret" "database-backup") }}
      - name: {{ $role.name | quote }}
        ensure: present
        login: {{ if and $settings.maintenance (ne $role.secret "database-backup") }}false{{ else }}true{{ end }}
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        connectionLimit: 20
        inRoles: []
        passwordSecret: {name: {{ $role.secret }}}
      {{- end }}
      {{- if $settings.identity.enabled }}
      - name: {{ $settings.identity.role | quote }}
        ensure: present
        login: {{ not $settings.maintenance }}
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        connectionLimit: 12
        inRoles: []
        passwordSecret: {name: keycloak-database}
      {{- end }}
  postgresql:
    parameters:
      ssl_min_protocol_version: TLSv1.2
      password_encryption: scram-sha-256
      max_connections: '100'
      shared_buffers: 256MB
    pg_hba:
      - hostnossl all all all reject
      {{- range $settings.serviceRequests }}
      {{- if .database }}
      {{- $database := .database.name }}
      {{- range $role := list .database.applicationRole .database.migrationRole }}
      - {{ printf "hostssl %s %s all scram-sha-256" $database $role | quote }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $name := list $settings.applicationRole $settings.migrationRole $settings.backupRole }}
      - {{ printf "hostssl %s %s all scram-sha-256" $settings.database $name | quote }}
      {{- end }}
      {{- if $settings.identity.enabled }}
      - {{ printf "hostssl %s %s all scram-sha-256" $settings.identity.database $settings.identity.role | quote }}
      {{- end }}
      - host all all all reject
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-private
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: cloudlab-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
      ports: [{protocol: TCP, port: 8000}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cloudlab-notes}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cloudlab-data-proof}
        - podSelector: {}
        {{- if $settings.identity.enabled }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cloudlab-identity}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    {{- $consumers := $settings.serviceConsumers | default list }}
    {{- range $settings.serviceRequests }}
    {{- if .database }}{{ $consumers = append $consumers .namespace }}{{- end }}
    {{- end }}
    {{- range $consumers | uniq }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
