{{- range $entry := list (dict "name" "notes-application" "item" "cnpg-notes-production") (dict "name" "notes-migration" "item" "cnpg-notes-migration") (dict "name" "database-backup" "item" "cnpg-backup") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: 'true'}
      data:
        username: '{{ `{{ .username }}` }}'
        password: '{{ `{{ .password }}` }}'
  dataFrom:
    - extract:
        key: {{ $entry.item }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-s3-config
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-s3-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        seaweedfs_s3_config: |
          {"identities":[
            {"name":"data-admin","credentials":[{"accessKey":{{ `{{ .admin_ACCESS_KEY_ID | toJson }}` }},"secretKey":{{ `{{ .admin_SECRET_ACCESS_KEY | toJson }}` }}}],"actions":["Admin","Read","Write","List","Tagging"]}
            {{- if not .Values.maintenance }}
            ,{"name":"notes","credentials":[{"accessKey":{{ `{{ .app_ACCESS_KEY_ID | toJson }}` }},"secretKey":{{ `{{ .app_SECRET_ACCESS_KEY | toJson }}` }}}],"actions":["Read:{{ .Values.bucket }}","Write:{{ .Values.bucket }}","List:{{ .Values.bucket }}","Tagging:{{ .Values.bucket }}"]}
            {{- end }}
          ]}
  dataFrom:
    - extract: {key: seaweedfs-admin}
      rewrite:
        - regexp: {source: '(.*)', target: 'admin_$1'}
    - extract: {key: s3-notes-production}
      rewrite:
        - regexp: {source: '(.*)', target: 'app_$1'}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-offsite
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: data-offsite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ `{{ .AWS_ACCESS_KEY_ID }}` }}'
        AWS_SECRET_ACCESS_KEY: '{{ `{{ .AWS_SECRET_ACCESS_KEY }}` }}'
        AWS_ENDPOINT: '{{ `{{ .AWS_ENDPOINTS }}` }}'
        BUCKET: '{{ `{{ .BUCKET }}` }}'
        REGION: '{{ `{{ .REGION }}` }}'
  dataFrom:
    - extract: {key: longhorn-b2}
