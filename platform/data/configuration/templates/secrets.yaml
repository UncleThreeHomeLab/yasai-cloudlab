# Vault items cnpg-notes-production, cnpg-notes-migration, cnpg-backup (username/password); seaweedfs-admin, s3-notes-production, per-service bucket items (S3); longhorn-b2 (offsite). Shapes: platform/data/contract.json.
{{- include "cloudlab.data.normalize" . -}}
{{- $settings := .dataSettings -}}
{{- range $entry := list (dict "name" "notes-application" "item" "cnpg-notes-production") (dict "name" "notes-migration" "item" "cnpg-notes-migration") (dict "name" "database-backup" "item" "cnpg-backup") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: 'true'}
      data:
        username: '{{ `{{- $value := index . "username" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        password: '{{ `{{- $value := index . "password" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
  dataFrom:
    - extract:
        key: {{ $entry.item }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudlab-s3-config
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: cloudlab-s3-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        admin_ACCESS_KEY_ID: '{{ `{{- $value := index . "admin_ACCESS_KEY_ID" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        admin_SECRET_ACCESS_KEY: '{{ `{{- $value := index . "admin_SECRET_ACCESS_KEY" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        seaweedfs_s3_config: |
          {"identities":[
            {"name":"data-admin","credentials":[{"accessKey":{{ `{{ .admin_ACCESS_KEY_ID | toJson }}` }},"secretKey":{{ `{{ .admin_SECRET_ACCESS_KEY | toJson }}` }}}],"actions":["Admin","Read","Write","List","Tagging"]}
            {{- if not $settings.maintenance }}
            ,{"name":"notes","credentials":[{"accessKey":{{ `{{- $value := index . "app_ACCESS_KEY_ID" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value | toJson }}` }},"secretKey":{{ `{{- $value := index . "app_SECRET_ACCESS_KEY" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value | toJson }}` }}}],"actions":["Read:{{ $settings.bucket }}","Write:{{ $settings.bucket }}","List:{{ $settings.bucket }}","Tagging:{{ $settings.bucket }}"]}
            {{- range $settings.serviceRequests }}
            {{- if .bucket }}
            ,{"name":{{ .service | quote }},"credentials":[{"accessKey":{{ printf `{{- $value := index . %q -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value | toJson }}` (printf "%s_ACCESS_KEY_ID" (replace "-" "_" .service)) }},"secretKey":{{ printf `{{- $value := index . %q -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value | toJson }}` (printf "%s_SECRET_ACCESS_KEY" (replace "-" "_" .service)) }}}],"actions":["Read:{{ .bucket.name }}","Write:{{ .bucket.name }}","List:{{ .bucket.name }}","Tagging:{{ .bucket.name }}"]}
            {{- end }}
            {{- end }}
            {{- end }}
          ]}
  dataFrom:
    - extract: {key: seaweedfs-admin}
      rewrite:
        - regexp: {source: '(.*)', target: 'admin_$1'}
    - extract: {key: s3-notes-production}
      rewrite:
        - regexp: {source: '(.*)', target: 'app_$1'}
    {{- range $settings.serviceRequests }}
    {{- if .bucket }}
    - extract: {key: {{ .bucket.item }}}
      rewrite:
        - regexp: {source: '(.*)', target: {{ printf "%s_$1" (replace "-" "_" .service) | quote }}}
    {{- end }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-offsite
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: data-offsite
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ `{{- $value := index . "AWS_ACCESS_KEY_ID" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        AWS_SECRET_ACCESS_KEY: '{{ `{{- $value := index . "AWS_SECRET_ACCESS_KEY" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        AWS_ENDPOINT: '{{ `{{- $value := index . "AWS_ENDPOINTS" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        BUCKET: '{{ `{{- $value := index . "BUCKET" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
        REGION: '{{ `{{- $value := index . "REGION" -}}{{- if not $value -}}{{- fail "Required data secret field is missing or empty" -}}{{- end -}}{{ $value }}` }}'
  dataFrom:
    - extract: {key: longhorn-b2}
