{{- include "cloudlab.data.normalize" . -}}
{{- $settings := .dataSettings -}}
{{- if $settings.identity.enabled }}
{{- if or (eq $settings.identity.database $settings.database) (has $settings.identity.role (list $settings.applicationRole $settings.migrationRole $settings.backupRole "postgres")) }}
{{- fail "Identity must use a dedicated database and role" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-database
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: keycloak-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: 'true'}
      data:
        username: '{{ `{{ .username }}` }}'
        password: '{{ `{{ .password }}` }}'
  dataFrom: [{extract: {key: cnpg-keycloak}}]
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster: {name: cloudlab-postgres}
  name: {{ $settings.identity.database | quote }}
  owner: {{ $settings.identity.role | quote }}
  ensure: present
  databaseReclaimPolicy: retain
{{- end }}
