{{- include "cloudlab.data.normalize" . -}}
{{- $settings := .dataSettings -}}
{{- $doomed := dict }}
{{- range $settings.deletions | default list }}
{{- if eq .kind "database" }}{{- $_ := set $doomed (printf "%s/%s" .service .name) true }}{{- end }}
{{- end }}
{{- range $settings.serviceRequests }}
{{- $service := .service }}
{{- if .database }}
{{- if eq .database.applicationRole .database.migrationRole }}{{ fail "Service application and migration roles must differ" }}{{- end }}
{{- if not (hasKey $doomed (printf "%s/%s" $service .database.name)) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $service }}
  annotations: {argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'}
spec:
  name: {{ .database.name | quote }}
  owner: {{ .database.migrationRole | quote }}
  cluster: {name: cloudlab-postgres}
  databaseReclaimPolicy: retain
{{- end }}
{{- range $entry := list (dict "name" (printf "%s-application" $service) "item" .database.applicationItem) (dict "name" (printf "%s-migration" $service) "item" .database.migrationItem) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
spec:
  refreshInterval: 24h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      metadata: {labels: {cnpg.io/reload: 'true'}}
      data:
        username: '{{ `{{ .username }}` }}'
        password: '{{ `{{ .password }}` }}'
  dataFrom:
    - extract: {key: {{ $entry.item }}}
{{- end }}
{{- end }}
{{- end }}
