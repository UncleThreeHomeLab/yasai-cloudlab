apiVersion: v1
kind: Namespace
metadata:
  name: cloudlab-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    cloudlab.io/gateway: private
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloudlab-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storageclass.kubernetes.io/is-default-class: 'false'
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: '2'
  staleReplicaTimeout: '2880'
  dataLocality: disabled
  replicaSoftAntiAffinity: disabled
  fsType: ext4
  # Logical application generations own recovery; exclude duplicate volume exports.
  recurringJobSelector: '[{"name":"application-logical-only","isGroup":true}]'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudlab-data
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '12'
    limits.memory: 16Gi
    requests.storage: 64Gi
    persistentvolumeclaims: '6'
