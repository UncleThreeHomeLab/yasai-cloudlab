{{- if and .Values.enabled .Values.serverEnabled }}
{{- $protocolPaths := include "identity.protocol-paths" . | fromYamlArray }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-protocols
spec:
  parentRefs:
    - {name: cloudlab, namespace: cloudlab-gateway-public, sectionName: https}
  hostnames: [{{ .Values.loginHost | quote }}]
  rules:
    - matches: [{path: {type: Exact, value: /}}]
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /realms/platform/account/}
            statusCode: 302
    - matches:
        {{- range $protocolPaths }}
        - {path: {type: Exact, value: {{ . | quote }}}}
        {{- end }}
        - {path: {type: PathPrefix, value: /resources}}
        # Account routes and opaque credential IDs need no percent-encoded paths.
        - {path: {type: RegularExpression, value: '^/realms/platform/account(/[^%]*)?$'}}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Proto]
            set:
              - {name: X-Forwarded-Proto, value: https}
              - {name: X-Forwarded-Host, value: {{ .Values.loginHost | quote }}}
              - {name: X-Forwarded-Port, value: '443'}
      backendRefs: [{name: cloudlab-keycloak-service, port: 8443}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-public-identity-management
  namespace: cloudlab-gateway-public
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: cloudlab}]
  action: DENY
  rules:
    - to:
        - operation:
            hosts: [{{ .Values.loginHost | quote }}, {{ printf "%s:*" .Values.loginHost | quote }}]
            notPaths: {{ concat $protocolPaths (list "/" "/resources" "/resources/*" "/realms/platform/account" "/realms/platform/account/*") | toJson }}
    - to:
        - operation:
            hosts: [{{ .Values.adminHost | quote }}, {{ printf "%s:*" .Values.adminHost | quote }}]
    - to:
        - operation:
            hosts: [{{ .Values.loginHost | quote }}, {{ printf "%s:*" .Values.loginHost | quote }}]
            paths: ['/realms/platform/clients-registrations', '/realms/platform/clients-registrations/*', '/realms/applications/clients-registrations', '/realms/applications/clients-registrations/*']
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-administration
  namespace: cloudlab-identity-admin
spec:
  parentRefs:
    - {name: cloudlab, namespace: cloudlab-gateway-private, sectionName: https}
  hostnames: [{{ .Values.adminHost | quote }}]
  rules:
    - matches: [{path: {type: Exact, value: /}}]
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.loginHost | quote }}
            path: {type: ReplaceFullPath, replaceFullPath: /realms/platform/account/}
            statusCode: 302
    {{- range $realm := list "platform" "applications" }}
    - matches: [{path: {type: PathPrefix, value: {{ printf "/realms/%s/account" $realm | quote }}}}]
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ $.Values.loginHost | quote }}
            statusCode: 302
    {{- end }}
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Proto]
            set:
              - {name: X-Forwarded-Proto, value: https}
              - {name: X-Forwarded-Host, value: {{ .Values.adminHost | quote }}}
              - {name: X-Forwarded-Port, value: '443'}
      backendRefs: [{name: cloudlab-keycloak-service, namespace: cloudlab-identity, port: 8443}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-private-account
  namespace: cloudlab-identity-admin
spec:
  parentRefs:
    - {name: cloudlab, namespace: cloudlab-gateway-private, sectionName: identity-account}
  hostnames: [{{ .Values.loginHost | quote }}]
  rules:
    - matches: [{path: {type: Exact, value: /}}]
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /realms/platform/account/}
            statusCode: 302
    - matches:
        {{- range $protocolPaths }}
        - {path: {type: Exact, value: {{ . | quote }}}}
        {{- end }}
        - {path: {type: PathPrefix, value: /resources}}
        - {path: {type: PathPrefix, value: /realms/platform/account}}
        - {path: {type: PathPrefix, value: /realms/applications/account}}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Proto]
            set:
              - {name: X-Forwarded-Proto, value: https}
              - {name: X-Forwarded-Host, value: {{ .Values.loginHost | quote }}}
              - {name: X-Forwarded-Port, value: '443'}
      backendRefs: [{name: cloudlab-keycloak-service, namespace: cloudlab-identity, port: 8443}]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: identity-private-administration
spec:
  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: cloudlab-identity-admin}]
  to: [{group: '', kind: Service, name: cloudlab-keycloak-service}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: identity
spec:
  targetRefs: [{group: '', kind: Service, name: cloudlab-keycloak-service}]
  validation:
    hostname: {{ .Values.loginHost | quote }}
    wellKnownCACertificates: System
{{- end }}
