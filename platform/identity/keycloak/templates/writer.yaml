{{- if and .Values.enabled .Values.reconciliationEnabled }}
{{- if .Values.operation }}
{{- if has .Values.operation.action (list "prepare-proof" "initialize-proof") }}
{{- if or .Values.bootstrapMode .Values.maintenance (not .Values.privateStateEnabled) (ne (len .Values.operation) 3) (ne .Values.operation.realm "platform") (not (regexMatch "^[a-f0-9]{32}$" .Values.operation.nonce)) }}{{ fail "Disposable enrollment requires its exact private viewer owner" }}{{ end }}
{{- else if has .Values.operation.action (list "prepare-emergency" "seed-emergency" "retire-bootstrap" "retire-emergency") }}
{{- if or .Values.bootstrapMode (not .Values.privateStateEnabled) (ne (len .Values.operation) 6) (not (regexMatch "^emergency-[a-f0-9]{32}$" .Values.operation.client)) (ne .Values.operation.item (printf "keycloak-%s" .Values.operation.client)) (not (regexMatch "^[a-z][a-z0-9-]{0,62}$" .Values.operation.bootstrapUsername)) (not (regexMatch "^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$" .Values.operation.bootstrapUserId)) (not (regexMatch "^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$" .Values.operation.keycloakUID)) }}
{{- fail "Emergency retirement requires the exact private owner and temporary service inventory" }}
{{- end }}
{{- if ne .Values.maintenance (has .Values.operation.action (list "prepare-emergency" "seed-emergency")) }}{{ fail "Offline recovery and retirement maintenance boundaries differ" }}{{ end }}
{{- else }}
{{- if or .Values.bootstrapMode (not .Values.privateStateEnabled) (ne .Values.operation.action "remove-client") (not (has .Values.operation.realm (list "platform" "applications"))) (not (regexMatch "^[a-z][a-z0-9-]{0,62}$" .Values.operation.client)) }}
{{- fail "Removal requires a bounded managed realm/client and ready private inputs" }}
{{- end }}
{{- end }}
{{- end }}
{{- $lock := .Files.Get "artifact.lock.json" | fromJson }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: identity-writer
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [identity-writer]
    verbs: [get, update]
  # Kubernetes cannot restrict collection POST by resourceNames. Only this
  # namespace's Argo writer can initialize its runtime-owned operational lock.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: [k8s.keycloak.org]
    resources: [keycloaks]
    resourceNames: [cloudlab-keycloak]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: identity-writer
subjects: [{kind: ServiceAccount, name: identity-writer}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: identity-writer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-writer-code
data:
  configuration.py: |
{{ .Files.Get "runtime/configuration.py" | indent 4 }}
  lease.py: |
{{ .Files.Get "runtime/lease.py" | indent 4 }}
  config-cli.properties: |
{{ .Files.Get "config-cli.properties" | indent 4 }}
{{- $pod := dict }}
{{- /* The same Lease protects both writers. Deadlines terminate pods before lease expiry. */}}

---
{{- if not .Values.bootstrapMode }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: identity-reconcile
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ or .Values.maintenance (not (empty .Values.operation)) }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 210
      backoffLimit: 0
      template:
        metadata:
          labels: {cloudlab.io/identity-writer: 'true'}
        spec:
{{ include "identity.pod" (dict "Values" .Values "Files" .Files "skipBusy" true) | indent 10 }}
{{- end }}
{{- if and (not .Values.maintenance) (or (empty .Values.operation) (has .Values.operation.action (list "remove-client" "initialize-proof"))) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-reconcile-sync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 210
  backoffLimit: 0
  template:
    metadata:
      labels: {cloudlab.io/identity-writer: 'true'}
    spec:
{{ include "identity.pod" . | indent 6 }}
{{- end }}
{{- end }}
