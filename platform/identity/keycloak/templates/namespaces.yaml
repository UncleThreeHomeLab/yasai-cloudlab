{{- if and .Values.enabled .Values.operatorEnabled }}
{{- range $entry := list (dict "name" "cloudlab-identity" "gateway" "public") (dict "name" "cloudlab-identity-admin" "gateway" "private") }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $entry.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    cloudlab.io/gateway: {{ $entry.gateway }}
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
{{- end }}
{{- end }}
