{{- if and .Values.enabled .Values.serverEnabled }}
{{- $entries := list (dict "name" "keycloak-database" "item" "cnpg-keycloak") }}
{{- if .Values.bootstrapAdminEnabled }}
{{- $entries = append $entries (dict "name" "keycloak-bootstrap-admin" "item" "keycloak-bootstrap-admin") }}
{{- end }}
{{- if .Values.primaryAdminEnabled }}
{{- if or (not .Values.bootstrapMode) (not .Values.privateStateEnabled) }}{{ fail "Primary initialization requires private bootstrap mode" }}{{- end }}
{{- $entries = append $entries (dict "name" "keycloak-primary-admin" "item" "keycloak-primary-admin") }}
{{- end }}
{{- $entries = append $entries (dict "name" "keycloak-realm-writers" "item" "keycloak-realm-writers") }}
{{- $entries = append $entries (dict "name" "keycloak-realm-health" "item" "keycloak-realm-health") }}
{{- $entries = append $entries (dict "name" "keycloak-client-secrets" "item" "keycloak-client-secrets") }}
{{- range $entry := $entries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom: [{extract: {key: {{ $entry.item }}}}]
{{- end }}
{{- end }}
