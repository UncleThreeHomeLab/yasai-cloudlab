{{- if and .Values.enabled .Values.serverEnabled }}
{{- /* Retain ESO ownership after retirement; the server no longer mounts bootstrap credentials. */}}
{{- $entries := list (dict "name" "keycloak-database" "item" "cnpg-keycloak") (dict "name" "keycloak-bootstrap-admin" "item" "keycloak-bootstrap-admin") }}
{{- if .Values.primaryAdminEnabled }}
{{- if or (not .Values.bootstrapMode) (not .Values.privateStateEnabled) }}{{ fail "Primary initialization requires private bootstrap mode" }}{{- end }}
{{- end }}
{{- if or .Values.primaryAdminEnabled (and .Values.privateStateEnabled (not .Values.bootstrapMode)) }}
{{- /* Keep ESO ownership after initialization; normal writers never mount this secret. */}}
{{- $entries = append $entries (dict "name" "keycloak-primary-admin" "item" "keycloak-primary-admin") }}
{{- end }}
{{- $entries = append $entries (dict "name" "keycloak-realm-writers" "item" "keycloak-realm-writers") }}
{{- $entries = append $entries (dict "name" "keycloak-realm-health" "item" "keycloak-realm-health") }}
{{- $entries = append $entries (dict "name" "keycloak-client-secrets" "item" "keycloak-client-secrets") }}
{{- if and .Values.operation (has .Values.operation.action (list "prepare-proof" "initialize-proof")) }}
{{- $entries = append $entries (dict "name" "keycloak-proof" "item" (printf "keycloak-proof-%s" .Values.operation.nonce)) }}
{{- end }}
{{- if and .Values.operation (has .Values.operation.action (list "prepare-emergency" "seed-emergency" "retire-bootstrap" "retire-emergency")) }}
{{- $entries = append $entries (dict "name" "keycloak-emergency" "item" .Values.operation.item) }}
{{- else if .Values.retiredEmergencyItem }}
{{- if or .Values.bootstrapAdminEnabled (not (regexMatch "^keycloak-emergency-[a-f0-9]{32}$" .Values.retiredEmergencyItem)) }}{{ fail "Retired emergency credentials require the accepted disabled bootstrap owner" }}{{ end }}
{{- $entries = append $entries (dict "name" "keycloak-emergency" "item" .Values.retiredEmergencyItem) }}
{{- end }}
{{- range $entry := $entries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $entry.name }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cloudlab, kind: ClusterSecretStore}
  target:
    name: {{ $entry.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom: [{extract: {key: {{ $entry.item }}}}]
{{- end }}
{{- end }}
